<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operacional Luck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--verde:#1f7a6d;--verde-esc:#15524a;--verde-claro:#e8f3f1;--tinta:#12332e;--texto:#1f2a28;--muted:#6b7d79;--linha:#e2ebe9;--bg:#f3f7f6;--card:#fff;--alerta:#c0392b;--alerta-bg:#fdecea;--ok:#1f7a6d;--aviso:#b8860b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--texto);-webkit-font-smoothing:antialiased;}
  /* LOGIN */
  .tela-acesso{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1f7a6d,#15524a);padding:20px;}
  .acesso-card{background:#fff;border-radius:16px;padding:38px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .acesso-logo{display:flex;justify-content:center;margin-bottom:8px;} .acesso-logo img{height:50px;}
  .acesso-card h1{font-size:1.15rem;text-align:center;color:var(--tinta);font-weight:700;}
  .acesso-card .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:24px;}
  .campo{margin-bottom:14px;} .campo label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .campo input{width:100%;padding:12px 14px;border:1.5px solid var(--linha);border-radius:10px;font-size:.95rem;}
  .campo input:focus{outline:none;border-color:var(--verde);}
  .btn-full{width:100%;padding:13px;background:var(--verde);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:6px;}
  .btn-full:hover{background:var(--verde-esc);} .btn-full:disabled{opacity:.6;cursor:default;}
  .link-troca{text-align:center;margin-top:16px;font-size:.84rem;color:var(--verde);cursor:pointer;}
  .msg{padding:10px 12px;border-radius:8px;font-size:.84rem;margin-bottom:14px;display:none;}
  .msg.erro{background:var(--alerta-bg);color:var(--alerta);display:block;}
  .msg.ok{background:var(--verde-claro);color:var(--verde);display:block;}
  .acesso-nota{font-size:.72rem;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5;}
  /* APP */
  .app{display:none;min-height:100vh;} .app.ativo{display:flex;}
  .sidebar{width:248px;background:var(--verde-esc);color:#dff0ec;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;}
  .sb-topo{padding:20px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px;}
  .sb-topo img{height:34px;} .sb-topo .nome{font-weight:700;font-size:.95rem;color:#fff;line-height:1.1;} .sb-topo .nome small{display:block;font-weight:400;font-size:.7rem;color:#a9cfc8;}
  .sb-scroll{overflow-y:auto;flex:1;}
  .sb-area{padding:14px 14px 6px;} .sb-area-tit{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#80b3aa;padding:0 8px 6px;font-weight:600;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:.88rem;color:#cfe6e1;margin-bottom:2px;}
  .sb-item:hover{background:rgba(255,255,255,.08);} .sb-item.ativo{background:var(--verde);color:#fff;font-weight:600;}
  .sb-item .ic{width:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;} .sb-item .pend{margin-left:auto;background:var(--alerta);color:#fff;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:20px;display:none;}
  .sb-rodape{padding:14px;border-top:1px solid rgba(255,255,255,.12);}
  .sb-user{display:flex;align-items:center;gap:10px;color:#cfe6e1;font-size:.8rem;}
  .sb-user .av{width:32px;height:32px;border-radius:50%;background:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;}
  .sb-user .sair{margin-left:auto;color:#9fc9c1;cursor:pointer;font-size:.75rem;}
  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topo{background:#fff;border-bottom:1px solid var(--linha);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
  .topo h2{font-size:1.15rem;color:var(--tinta);font-weight:700;} .area-badge{font-size:.72rem;background:var(--verde-claro);color:var(--verde);padding:4px 10px;border-radius:20px;font-weight:600;}
  .main{padding:24px 28px;flex:1;}
  .btn{padding:9px 16px;border:none;border-radius:9px;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--verde);color:#fff;} .btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde);} .btn.mini{padding:5px 12px;font-size:.78rem;}
  .btn.danger{background:#fff;color:var(--alerta);border:1.5px solid var(--alerta);}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:20px;margin-bottom:16px;}
  .card h3{font-size:1rem;color:var(--tinta);margin-bottom:14px;}
  .em-breve{text-align:center;padding:70px 20px;color:var(--muted);} .em-breve .ic{font-size:2.6rem;margin-bottom:12px;opacity:.5;} .em-breve h3{font-size:1.05rem;color:var(--texto);margin-bottom:6px;font-weight:600;} .em-breve p{font-size:.88rem;max-width:380px;margin:0 auto;line-height:1.5;}

  .cards-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .resumo{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;}
  .resumo .num{font-size:1.8rem;font-weight:700;color:var(--tinta);line-height:1;} .resumo .lbl{font-size:.78rem;color:var(--muted);margin-top:4px;}
  .resumo.alerta .num{color:var(--alerta);} .resumo.ok .num{color:var(--ok);}
  .lista-div{display:flex;flex-direction:column;gap:10px;}
  .div-item{background:var(--card);border:1px solid var(--linha);border-left:4px solid var(--alerta);border-radius:10px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;}
  .div-item .tag{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--alerta-bg);color:var(--alerta);white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;}
  .div-item .corpo{flex:1;min-width:0;} .div-item .rec{font-weight:700;color:var(--tinta);font-size:.92rem;} .div-item .det{font-size:.85rem;color:var(--texto);margin-top:3px;} .div-item .sub{font-size:.78rem;color:var(--muted);margin-top:2px;}
  .div-item.horario{border-left-color:var(--aviso);} .div-item.horario .tag{background:#fdf6e3;color:var(--aviso);}
  .barra-busca{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
  .barra-busca input{padding:10px 14px;border:1.5px solid var(--linha);border-radius:9px;font-size:.9rem;background:#fff;}


  .mot-bloco{margin-bottom:18px;}
  .mot-cab{font-size:.9rem;font-weight:700;color:var(--verde);padding:8px 0;border-bottom:2px solid var(--verde-claro);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .mot-count{background:var(--alerta-bg);color:var(--alerta);font-size:.72rem;padding:1px 9px;border-radius:20px;}
  .div-item{cursor:pointer;position:relative;}
  .detalhe-extra{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--linha);font-size:.82rem;color:var(--texto);}
  .detalhe-extra div{margin-bottom:3px;}
  .div-item.aberto .detalhe-extra{display:block;}
  .btn-check{background:#fff;border:1.5px solid var(--linha);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.9rem;flex-shrink:0;}
  .btn-check:hover{border-color:var(--verde);color:var(--verde);}
  .div-item.verificado{opacity:.5;}
  .div-item.verificado .btn-check{background:var(--verde);color:#fff;border-color:var(--verde);}

  .pg{display:none;} .pg.ativo{display:block;}
  /* usuarios */
  .u-linha{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;margin-bottom:8px;background:#fff;flex-wrap:wrap;}
  .u-linha .un{font-weight:600;color:var(--tinta);font-size:.9rem;} .u-linha .ue{font-size:.8rem;color:var(--muted);}
  .u-linha .areas-sel{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-size:.75rem;padding:4px 10px;border:1.5px solid var(--linha);border-radius:20px;cursor:pointer;color:var(--muted);user-select:none;}
  .chip.on{background:var(--verde-claro);border-color:var(--verde);color:var(--verde);font-weight:600;}
  .u-tag{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:20px;} .u-tag.aprov{background:var(--verde-claro);color:var(--verde);} .u-tag.pend{background:#fdf6e3;color:var(--aviso);}


  /* expande ao passar o mouse quando esta recolhida */
  .sidebar.mini:hover{width:248px;}
  .sidebar.mini:hover .nome, .sidebar.mini:hover .sb-item .rotulo, .sidebar.mini:hover #userInfo, .sidebar.mini:hover .sb-user .sair{display:block;}
  .sidebar.mini:hover .sb-topo{justify-content:flex-start;padding:20px;}
  .sidebar.mini:hover .sb-item{justify-content:flex-start;padding:10px 12px;}
  .sidebar.mini:hover .sb-item .ic{width:20px;font-size:1.05rem;}
  .sidebar.mini:hover .sb-area{padding:14px 14px 6px;}
  .sidebar.mini:hover .sb-area-tit{height:auto;border-top:none;margin:0;padding:0 8px 6px;color:#80b3aa;font-size:.68rem;overflow:visible;}
  .sidebar.mini:hover .sb-user{justify-content:flex-start;}
  .sidebar.mini:hover .sb-item .pend{position:static;transform:none;margin-left:auto;}
  .sidebar{transition:width .18s ease;}

  /* sidebar recolhida */
  .sidebar.mini{width:64px;}
  .sidebar.mini .nome, .sidebar.mini .sb-item .rotulo, .sidebar.mini #userInfo, .sidebar.mini .sb-user .sair{display:none;}
  .sidebar.mini .sb-topo{justify-content:center;padding:18px 0;}
  .sidebar.mini .sb-item{justify-content:center;padding:11px 0;}
  .sidebar.mini .sb-item .ic{width:auto;}
  .sidebar.mini .sb-area{padding:10px 8px 4px;}
  .sidebar.mini .sb-area-tit{height:0;border-top:1px solid rgba(255,255,255,.14);margin:8px 10px;padding:0;overflow:hidden;color:transparent;font-size:0;}
  .sidebar.mini .sb-user{justify-content:center;}
  .sidebar.mini .sb-item .pend{position:absolute;margin:0;transform:translate(14px,-12px);}
  .sidebar.mini .sb-item{position:relative;}
  .btn-toggle{background:rgba(255,255,255,.1);border:none;color:#dff0ec;width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .btn-toggle:hover{background:rgba(255,255,255,.2);}
  .sb-topo{position:relative;}

  @media(max-width:760px){.sidebar{position:fixed;left:-248px;z-index:50;transition:left .2s;}.sidebar.aberta{left:0;}.main{padding:16px;}.topo{padding:14px 16px;}}

  /* ================= REBRANDING "BRISA" (só o sistema; a tela de login continua como era) ================= */
  .app{--verde:#0e7c6b;--verde-esc:#0b4f44;--verde-claro:#e3f2ee;--tinta:#17302b;--texto:#17302b;--muted:#5c706b;--linha:#e3ebe8;--bg:#f5f7f6;--ok:#0b6b5c;
       font-family:'Manrope',Inter,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--texto);}
  .app .sidebar{background:#fff;color:#3c524d;border-right:1px solid var(--linha);}
  .app .sb-topo{border-bottom:1px solid #edf2f0;padding:22px 18px;}
  .app .sb-topo img{height:38px;}
  .app .sb-topo .nome{color:var(--tinta);font-weight:800;font-size:1rem;} .app .sb-topo .nome small{color:var(--muted);font-weight:500;}
  .app .sb-area{padding:16px 14px 6px;} .app .sb-area-tit{color:var(--muted);font-size:.68rem;font-weight:700;letter-spacing:.1em;padding:0 10px 8px;}
  .app .sb-item{color:#3c524d;font-weight:600;border-radius:10px;padding:10px 12px;font-size:.88rem;}
  .app .sb-item:hover{background:#f1f5f4;} .app .sb-item.ativo{background:var(--verde-claro);color:var(--verde-esc);font-weight:700;}
  .app .sb-item .pend{background:#e0583a;}
  .app .sb-rodape{border-top:1px solid #edf2f0;} .app .sb-user{color:var(--tinta);} .app .sb-user .av{background:var(--tinta);}
  .app .sb-user .sair{color:var(--muted);}
  .app .btn-toggle{background:#f1f5f4;color:#3c524d;} .app .btn-toggle:hover{background:#e3ebe8;}
  .app .sidebar.mini .sb-area-tit{border-top:1px solid #edf2f0;} .app .sidebar.mini:hover .sb-area-tit{color:var(--muted);}
  .app .topo{background:var(--bg);border-bottom:none;padding:30px 40px 6px;}
  .app .topo h2{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;color:var(--tinta);}
  .app .area-badge{background:var(--verde-claro);color:var(--verde-esc);font-weight:700;padding:6px 12px;}
  .app .main{padding:18px 40px 48px;}
  .app .card{border-radius:18px;border-color:var(--linha);padding:22px 24px;}
  .app .card h3{font-weight:800;}
  .app .resumo{border-radius:16px;padding:18px 20px;border-color:var(--linha);} .app .resumo .num{font-weight:800;}
  .app .btn{border-radius:12px;padding:11px 18px;font-weight:700;font-family:inherit;}
  .app .btn.sec{background:#fff;color:var(--tinta);border:1px solid #cfdcd8;}
  .app .btn.mini{padding:7px 12px;border-radius:10px;font-size:.8rem;}
  .app .btn.danger{border:1px solid #f3b9ab;}
  .app .chip{border:none;background:#e9efed;color:var(--muted);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.78rem;}
  .app .chip.on{background:#fff;color:var(--tinta);box-shadow:0 0 0 1px #cfdcd8;}
  .app .barra-busca input,.app input[type=date],.app input[type=search],.app select{border:1px solid #cfdcd8;border-radius:12px;font-family:inherit;}
  .app .barra-busca input{height:44px;}
  .app .em-breve h3{font-weight:800;}
  .app .div-item{border-radius:14px;}
  @media(max-width:760px){.app .topo{padding:18px 16px 4px;}.app .topo h2{font-size:1.4rem;}.app .main{padding:12px 16px 32px;}}

  .app .topo{align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .app .topo-tit{display:flex;flex-direction:column;gap:4px;min-width:0;margin-right:auto;}
  .app .topo-sub{font-size:.82rem;color:var(--muted);font-weight:600;} .app .topo-sub:empty{display:none;}
  .app .topo-acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;} .app .topo-acoes:empty{display:none;}
  .app .topo-acoes:not(:empty)~.area-badge{display:none;}
  .app .topo-acoes .btn{height:44px;}
  .app .topo-acoes input[type=date]{height:44px;padding:0 12px;background:#fff;}
  .app .seg{display:inline-flex;flex-wrap:wrap;background:#e9efed;border-radius:12px;padding:4px;gap:4px;}
  .app .seg button{height:36px;padding:0 14px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;}
  .app .seg button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .app .busca{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;background:#fff;border:1px solid #cfdcd8;border-radius:12px;color:var(--muted);flex:1 1 200px;max-width:320px;}
  .app .busca input{border:none!important;outline:none;height:40px;font-family:inherit;font-size:.9rem;flex:1;min-width:0;background:transparent;padding:0;}
  .app .filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px;}
  .app .cards-resumo{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;}
  .app .resumo{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px;}
  .app .resumo .lbl{font-weight:600;font-size:.8rem;margin-top:0;} .app .resumo .num{font-size:1.75rem;margin-bottom:2px;}
  .app .tabela{width:100%;border-collapse:collapse;font-size:.88rem;}
  .app .tabela th{text-align:left;font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.04em;padding:14px 20px;border-bottom:1px solid var(--linha);}
  .app .tabela td{padding:13px 20px;border-bottom:1px solid #edf2f0;}

  /* prévia Brisa: menu só com texto, logo verde, cartão do usuário */
  .logo-brisa{display:none;}
  .app .logo-brisa{display:flex;width:38px;height:38px;border-radius:11px;background:#fff;align-items:center;justify-content:center;flex-shrink:0;}
  .app .sb-topo img{display:none;}
  .app .sidebar:not(.mini) .sb-item .ic{display:none;}
  .app .sidebar.mini:hover .sb-item .ic{display:inline-flex;}
  .app .sb-item{font-size:.9rem;padding:10px 14px;}
  .app .sb-rodape{padding:14px;} .app .sb-user{background:var(--bg);border-radius:12px;padding:10px 12px;}
  .app .sidebar.mini .sb-user{background:none;padding:0;}
  .pill{font-size:.7rem;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-block;}
  @keyframes andando{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  .barra-anda{height:10px;background:#edf2f0;border-radius:5px;overflow:hidden;position:relative;}
  .barra-anda>span{position:absolute;top:0;bottom:0;width:40%;background:var(--verde);border-radius:5px;animation:andando 1.6s ease-in-out infinite;}
  .carro-card{border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fff;min-width:0;}
  .carro-card.vazio{border:1px dashed #e5a07f;background:#fffaf7;}
  .passeio-sec{border-left:6px solid var(--cor,#0f7a68);padding:0!important;overflow:hidden;}
  .passeio-sec .passeio-topo{background:var(--fundo,#f2f8f6);padding:16px 22px;border-bottom:1px solid var(--linha);}
  .passeio-sec .passeio-carros{padding:16px 22px 20px;}
  .passeio-sec .carro-card{border-top:4px solid var(--cor,#0f7a68);}
  .passeio-sec .carro-card.vazio{border-top:4px solid #e5a07f;}
  .carro-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:11px;background:var(--cor,#0f7a68);color:#fff;font-size:.7rem;font-weight:800;}
  .tag{font-size:.66rem;font-weight:800;border-radius:6px;padding:2px 7px;letter-spacing:.02em;white-space:nowrap;}
  .tag.t-bus{background:#dcefe9;color:#0b4f44} .tag.t-micrao{background:#ece3fb;color:#5b2a9c} .tag.t-mini{background:#ece3fb;color:#5b2a9c}
  .tag.t-van{background:#fde7d3;color:#8a3b0b} .tag.t-carro{background:#e8ecea;color:#3c4a46}
  .tag.i-esp{background:#fff1b8;color:#7a5600} .tag.i-ing{background:#d9ecff;color:#0b4a8a} .tag.i-bil{background:#f3dcf5;color:#7a1f86}
  .tag.pvt{background:#fbd9e3;color:#8a1538}
  .tag.st-ok{background:#dff3ea;color:#0b6b4c} .tag.st-av{background:#eef1f0;color:#4c605b}
  .carro-card .rot{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:.03em;}
  .carro-card input.plano-guia{border:1px solid transparent;border-radius:8px;padding:5px 8px;margin:-5px -8px;font-family:inherit;font-size:1rem;font-weight:800;color:var(--tinta);background:transparent;text-transform:uppercase;width:calc(100% + 16px);}
  .carro-card input.plano-guia:hover{border-color:var(--linha);} .carro-card input.plano-guia:focus{border-color:var(--verde);background:#fff;outline:none;}
  .carro-card.vazio input.plano-guia{border:1px solid #e5c2b2;background:#fff;margin:0;width:100%;font-size:.9rem;font-weight:600;}
  .app .area-badge{display:none;}
  .carro-card input.plano-guia::placeholder{text-transform:none;font-weight:500;}
  .app .sb-topo .logo-brisa img{display:block!important;height:32px}
  /* ===== TEMA ESCURO (botão 🌙 no rodapé do menu) ===== */
  .app.escuro{--verde:#3fb39f;--verde-esc:#8fe0cf;--verde-claro:#173a34;--tinta:#e8f1ee;--texto:#d9e5e1;--muted:#93a8a2;--linha:#2a3a36;--bg:#0e1614;--card:#16211e;--ok:#4cc3a9;--alerta:#ff8f7f;--alerta-bg:#3a201c;--aviso:#e6b24a;color-scheme:dark;}
  .app.escuro .sidebar{background:#121c1a;color:#b9cbc6;}
  .app.escuro .sb-topo,.app.escuro .sb-rodape,.app.escuro .sidebar.mini .sb-area-tit{border-color:#22302c;}

<script>
  const API = "https://us-central1-operacional-luck.cloudfunctions.net/auth";
  const API_COMPARAR = "https://us-central1-operacional-luck.cloudfunctions.net/comparar";
  const API_FECHAR = "https://us-central1-operacional-luck.cloudfunctions.net/fechar";
  const API_ESCALA = "https://us-central1-operacional-luck.cloudfunctions.net/escala";
  const API_PLANO = "https://us-central1-operacional-luck.cloudfunctions.net/plano";
  let USUARIO = null;

  async function chamar(acao, dados){
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({acao, token: USUARIO&&USUARIO.token, ...dados})});
    const j = await r.json();
    sessaoExpirou(j);
    return j;
  }
  // se a sessão venceu (12h), volta para a tela de login
  function sessaoExpirou(j){
    if(j && j.sair && USUARIO){ sair(); msg("Sua sessão expirou. Entre de novo.","erro"); return true; }
    return false;
  }
  function msg(txt, tipo){ const m=document.getElementById("msgAcesso"); m.textContent=txt; m.className="msg "+tipo; }
  function mostrarCadastro(){ document.getElementById("formLogin").style.display="none"; document.getElementById("formCadastro").style.display="block"; msg("",""); }
  function mostrarLogin(){ document.getElementById("formCadastro").style.display="none"; document.getElementById("formLogin").style.display="block"; msg("",""); }

  async function fazerCadastro(){
    const nome=cadNome.value.trim(), email=cadEmail.value.trim(), senha=cadSenha.value;
    if(!nome||!email||!senha){ msg("Preencha todos os campos.","erro"); return; }
    btnCad.disabled=true; btnCad.textContent="Criando...";
    const r=await chamar("cadastrar",{nome,email,senha});
    btnCad.disabled=false; btnCad.textContent="Criar acesso";
    if(r.ok){ msg("Acesso criado! Aguarde a aprovação da coordenação para entrar.","ok"); mostrarLogin(); }
    else msg(r.erro||"Erro ao criar acesso.","erro");
  }
  async function fazerLogin(){
    const email=loginEmail.value.trim(), senha=loginSenha.value;
    if(!email||!senha){ msg("Informe e-mail e senha.","erro"); return; }
    btnLogin.disabled=true; btnLogin.textContent="Entrando...";
    const r=await chamar("login",{email,senha});
    btnLogin.disabled=false; btnLogin.textContent="Entrar";
    if(r.ok&&r.trocarSenha){ USUARIO=r; abrirTrocaSenha(senha,true); }
    else if(r.ok){ USUARIO=r; iniciarApp(); }
    else msg(r.erro||"Erro ao entrar.","erro");
  }
  function sair(){ if(AVISOS_TIMER){ clearInterval(AVISOS_TIMER); AVISOS_TIMER=null; } PLANO.avisos=[]; pararAcompanhamento(); USUARIO=null; document.getElementById("app").classList.remove("ativo"); document.getElementById("telaAcesso").style.display="flex"; loginSenha.value=""; }

  // nomes em "Título" como na prévia (MARAGOGI (BOA VIAGEM | PIEDADE) -> Maragogi (Boa Viagem))
  const MINUSC=["de","da","do","das","dos","e","a","o","em","no","na"];
  function titulo(s){ return String(s||"").toLowerCase().replace(/\s+/g," ").trim().split(" ").map((w,i)=>i&&MINUSC.includes(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(" ").replace(/\(([a-zà-ú])/g,(m,x)=>"("+x.toUpperCase()); }
  function nomeServ(s){ s=nomePasseio(s).replace(/\s*\|\s*PIEDADE/i,"");
    const m=s.match(/^(IN|OUT)\s*\((.*)\)\s*$/i); if(m) return m[1].toUpperCase()+" "+titulo(m[2]);
    return titulo(s); }
  const nomeCurtoServ=(s)=>nomeServ(s).split(" (")[0];
  // cabeçalho da página no estilo Brisa: subtítulo em cima do título e ações à direita
  function cab(sub,acoes){ const s=document.getElementById("subPg"), a=document.getElementById("acoesPg"); if(s) s.textContent=sub||""; if(a) a.innerHTML=acoes||""; }
  const DIAS_SEM=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"], MESES_EXT=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  function dataLonga(iso){ if(!iso) return ""; const d=new Date(iso+"T12:00:00"); return DIAS_SEM[d.getDay()]+", "+d.getDate()+" de "+MESES_EXT[d.getMonth()]; }
  const segmento=(ops,atual,acao)=>'<div class="seg">'+ops.map(([v,t])=>'<button class="'+(atual===v?"on":"")+'" onclick="'+acao.replace("$v",v)+'">'+t+'</button>').join("")+'</div>';
  const campoBusca=(id,ph,val,acao)=>'<label class="busca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="search" id="'+id+'" placeholder="'+ph+'" value="'+esc(val||"")+'" oninput="'+acao+'"></label>';

  // ---- Checagem da prévia: motor (lê a prévia e aplica as regras do operacional) ----
  const CHK_ROAD={REC:25,CABO:45,PAIVA:35,PGA:70,SER:80,CAR:100,MRG:150,JPA:150,PIPA:240};
  const CHK_AREA={PGA:"PGA",SER:"PGA",CAR:"PGA",MRG:"MRG",JPA:"MRG",CABO:"CABO",PAIVA:"CABO",REC:"REC",PIPA:"PIPA"};
  const CHK_KM={PGA:65,MRG:130,CABO:35};
  const CHK_P={desemb:40,parada:10,domR:90,domA:120,intR:120,intA:150,esperaLonga:240};
  // restrições de horário dos motoristas (nome como está na prévia)
  const CHK_RESTR={
    cedo:{ate:15*60,nomes:["ZACA","MARCOS MOURA","DELSON","JOAO CORBIANO","SILVA","LINDON"]},   // pegam cedo, não pegam tarde
    tarde:{desde:12*60,nomes:["EDSON","JOSAFA","RIZALDO","ANTONIO","HUGO","CARLITO","JOSIAS","MARCOS FERREIRA"]} // pegam tarde
  };
  function chkRestricao(mot){ const m=chkNorm(mot); return CHK_RESTR.cedo.nomes.includes(m)?"cedo":CHK_RESTR.tarde.nomes.includes(m)?"tarde":null; }
  // o serviço cabe no turno do motorista? (madrugada vale para os dois)
  function chkNoTurno(mot,ini,fim){
    const r=chkRestricao(mot); if(!r||ini==null) return true;
    const i=((ini%1440)+1440)%1440, f=((((fim==null?ini:fim))%1440)+1440)%1440;
    if(r==="cedo") return !(f>CHK_RESTR.cedo.ate||i>=CHK_RESTR.cedo.ate);
    return !(i>=5*60&&i<CHK_RESTR.tarde.desde);
  }
  function chkNorm(s){ return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().trim(); }
  function chkMin(v){
    if(v==null||v==="") return null;
    if(typeof v==="number"){ if(v>=0&&v<1) return Math.round(v*1440)%1440; return null; }
    if(v instanceof Date) return v.getHours()*60+v.getMinutes();
    const s=String(v).trim(); let m=s.match(/(\d{1,2}):(\d{2})/); if(m) return +m[1]*60+ +m[2];
    m=s.match(/^(\d{2})(\d{2})h$/i); if(m) return +m[1]*60+ +m[2];
    m=s.match(/^(\d{1,2})h$/i); if(m) return +m[1]*60;
    return null;
  }
  function chkColeta(v){
    if(v==null||v==="") return [null,null];
    if(typeof v==="number"||v instanceof Date){ const x=chkMin(v); return [x,x]; }
    const t=[...String(v).matchAll(/(\d{1,2}):(\d{2})/g)];
    if(!t.length){ const x=chkMin(v); return [x,x]; }
    return [+t[0][1]*60+ +t[0][2], +t[t.length-1][1]*60+ +t[t.length-1][2]];
  }
  function chkHora(m){ if(m==null) return "—"; m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
  function chkDur(m){ const s=m<0?"-":""; m=Math.abs(Math.round(m)); const h=Math.floor(m/60), mi=m%60; return s+(h?h+"h"+(mi?String(mi).padStart(2,"0"):""):mi+" min"); }
  function chkCap(veic){
    const v=chkNorm(veic);
    if(/^LOCALIZA/.test(v)) return {tipo:"Localiza",cap:3};
    if(v==="VAN 2668") return {tipo:"Van",cap:18};
    if(/^MICRAO/.test(v)) return {tipo:"Micrão",cap:32};
    if(/^MICRO/.test(v)) return {tipo:"Micro",cap:33};
    if(/^(BUS|ONIBUS)/.test(v)) return {tipo:"Bus",cap:46};
    return {tipo:"Van",cap:15};
  }
  function chkAreaTexto(t){
    const s=chkNorm(t);
    if(/MARAGOGI|JAPARATINGA|\bMRG\b/.test(s)) return "MRG";
    if(/PIPA/.test(s)) return "PIPA";
    if(/SERRAMBI|\bSER\b/.test(s)) return "SER";
    if(/CARNEIROS|\bCAR\b/.test(s)) return "CAR";
    if(/CABO|PAIVA/.test(s)) return "CABO";
    if(/\bPGA\b|\bPORTO\b/.test(s)) return "PGA";
    if(/\bREC\b|RECIFE|BOA VIAGEM|PIEDADE/.test(s)) return "REC";
    return null;
  }
  function chkServicos(txt){
    const out=[]; if(!txt) return out;
    for(const l of String(txt).split(/\n/)){
      const m=l.match(/TRF (OUT|IN) \(?([A-Z]+)\)? \| (\w+) - (\d+) (Nac|Int)\.? (\d{1,2}):(\d{2}) \| ?(.*)/i);
      if(!m) continue;
      let pax=0; (" "+m[8]).replace(/(?:^|\s)(\d+)\s+[A-Za-zÀ-ú]/g,(x,n)=>{ pax+=+n; return x; });
      out.push({kind:m[1].toUpperCase(),code:m[2].toUpperCase(),voo:m[3].toUpperCase()+" "+m[4],intl:/int/i.test(m[5]),t:+m[6]*60+ +m[7],pax});
    }
    return out;
  }
  function chkHoteis(s){ return s? String(s).split("+").map(x=>x.trim()).filter(Boolean).length : 0; }
  function chkPick(txt){
    const s=chkNorm(txt);
    const m=s.match(/PICK\s*-?\s*UP[^0-9]{0,25}(\d{1,2})\s*[H:]\s*(\d{2})?/)||s.match(/SAIDA DO (?:HTL|HOTEL)[^0-9]{0,12}(\d{1,2})\s*[H:]\s*(\d{2})?/)||s.match(/DESEJA (?:TRF|SAIR|SAIDA)[^0-9]{0,15}(\d{1,2})\s*[H:]\s*(\d{2})?/);
    return m? (+m[1])*60+(+(m[2]||0)) : null;
  }
  function chkInicioLancado(inicios,mot){
    if(!inicios) return null; const m=chkNorm(mot);
    if(m in inicios) return inicios[m];
    const ks=Object.keys(inicios).filter(k=>m.startsWith(k)||k.startsWith(m)||(k.split(" ")[0]===m.split(" ")[0]&&m.split(" ")[1]&&k.split(" ")[1]&&m.split(" ")[1].startsWith(k.split(" ")[1])));
    return ks.length===1?inicios[ks[0]]:null;
  }
  function chkAbs(m,sh){ if(m==null) return null; return sh==="N"? (m<720?m+1440:m) : m+1440; }
  function chkViagem(de,para){
    if(!de||!para) return 0; if(de===para) return de==="AIR"?0:10;
    if(de==="AIR") return CHK_ROAD[para]||60; if(para==="AIR") return CHK_ROAD[de]||60;
    return Math.abs((CHK_ROAD[de]||60)-(CHK_ROAD[para]||60))+15;
  }

  // lê as abas Noite e Dia da planilha (linhas como vêm do SheetJS, header:1)
  function chkLinhas(wb){
    const rows=[]; rows.inicios={};
    for(const [sh,re] of [["N",/escala \(noite\)/i],["D",/escala \(dia\)/i]]){
      const nome=wb.SheetNames.find(n=>re.test(n)); if(!nome) continue;
      const L=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,raw:true,defval:null});
      for(let i=1;i<L.length;i++){
        const v=L[i]||[]; const outtxt=v[7], intxt=v[8];
        // lista "MOTORISTA | horário de início" no fim da aba Noite
        if(sh==="N"&&!outtxt&&!intxt&&!v[4]&&typeof v[0]==="string"&&/^[A-Za-zÀ-ú .'-]+$/.test(v[0].trim())&&chkMin(v[1])!=null){ rows.inicios[chkNorm(v[0])]=chkMin(v[1]); continue; }
        if(!outtxt&&!intxt) continue;
        rows.push({sh,linha:i+1,col1:v[0],hin:v[1],hout:v[2],hinH:v[3],veic:v[4]?String(v[4]).trim():"",mot:v[5]?chkNorm(v[5]):"",guia:v[6],outtxt:outtxt?String(outtxt):"",intxt:intxt?String(intxt):"",paxo:v[9],paxi:v[10]});
      }
    }
    return rows;
  }

  // transforma cada linha em trechos (OUT, IN, extra)
  function chkTrechos(rows){
    const legs=[]; let id=0;
    for(const r of rows){
      const o=chkServicos(r.outtxt), inn=chkServicos(r.intxt);
      const [a,b]=chkColeta(r.col1);
      if(o.length){
        const code=o[0].code, road=CHK_ROAD[code]||60;
        const start=chkAbs(a,r.sh), last=chkAbs(b,r.sh);
        let fl=chkAbs(Math.min(...o.map(x=>x.t)),r.sh); if(start!=null&&fl<start) fl+=1440;
        legs.push({id:id++,r,sh:r.sh,kind:"OUT",code,area:CHK_AREA[code]||code,start,end:last!=null?last+road:null,deadline:start,startLoc:code,endLoc:"AIR",flight:fl,
          intl:new Set(o.map(x=>x.intl)),pax:o.reduce((s,x)=>s+x.pax,0),nh:chkHoteis(r.hout),priv:/PRIVATIVO|\bPRIV\b|\bPVT\b/i.test(r.outtxt),voos:o,pick:chkPick(r.outtxt),junto:/JUNTO/i.test(r.outtxt)});
      } else if(r.outtxt&&a!=null){
        const t=chkNorm(r.outtxt), start=chkAbs(a,r.sh);
        if(/TRF OUT|OUT HTL/.test(t)){
          const code=chkAreaTexto(r.outtxt.replace(/TRF OUT/i,""))||chkAreaTexto(r.hout)||"PGA";
          legs.push({id:id++,r,sh:r.sh,kind:"OUT",code,area:CHK_AREA[code]||code,start,end:start+(CHK_ROAD[code]||60),deadline:start,startLoc:code,endLoc:"AIR",flight:null,semVoo:true,
            intl:new Set(),pax:+r.paxo||0,nh:chkHoteis(r.hout),priv:/PRIVATIVO|\bPRIV\b|\bPVT\b/i.test(r.outtxt),voos:[],pick:chkPick(r.outtxt),junto:/JUNTO/i.test(r.outtxt)});
        } else {
          const dur=/MARAGOGI|JAPARATINGA/.test(t)?(/\bPORTO\b/.test(t)?100:170):/\bPORTO\b|\bPGA\b/.test(t)&&/RECIFE|BOA VIAGEM|PIEDADE|AEROPORTO|IBIS/.test(t)?90:60;
          const partes=String(r.outtxt).split("\n")[0].split("/");
          const lA=chkAreaTexto(partes[0]), lB=partes.length>1?chkAreaTexto(partes.slice(1).join("/")):lA;
          const lApoio=/APOIO|GARAGEM/.test(t)?(/\bPORTO\b/.test(t)?"PGA":/RECIFE|PRAZERES/.test(t)?"AIR":null):null;
          legs.push({id:id++,r,sh:r.sh,kind:"EXTRA",start,end:start+dur,deadline:start,startLoc:lApoio||lA,endLoc:lApoio||lB,pax:+r.paxo||0,priv:/PRIVATIVO|\bPRIV\b|\bPVT\b/i.test(r.outtxt),apoio:/APOIO|GARAGEM|STAND BY|RET\. FUNC/.test(t),txt:r.outtxt.split("\n")[0]});
        }
      }
      if(inn.length){
        const code=inn[0].code, road=CHK_ROAD[code]||60, n=chkHoteis(r.hinH);
        const ult={}; for(const x of inn) ult[x.voo]=Math.max(ult[x.voo]||0,x.t); const tv=Object.values(ult);
        let f0=chkAbs(Math.min(...tv),r.sh), f1=chkAbs(Math.max(...tv),r.sh); if(f1<f0) f1+=1440;
        legs.push({id:id++,r,sh:r.sh,kind:"IN",code,area:CHK_AREA[code]||code,start:f0,end:f1+CHK_P.desemb+road+CHK_P.parada*Math.max(n-1,0),deadline:f0+CHK_P.desemb,startLoc:"AIR",endLoc:code,flight:f0,flightMax:f1,
          intl:new Set(inn.map(x=>x.intl)),pax:inn.reduce((s,x)=>s+x.pax,0),nh:n,priv:/PRIVATIVO|\bPRIV\b|\bPVT\b/i.test(r.intxt),voos:inn,junto:/JUNTO/i.test(r.intxt)});
      } else if(r.intxt){
        const h=chkAbs(chkMin(r.hin),r.sh);
        if(h!=null){
          const code=chkAreaTexto(r.intxt.replace(/TRF IN/i,""))||chkAreaTexto(r.hinH)||"PGA", road=CHK_ROAD[code]||60, n=chkHoteis(r.hinH);
          legs.push({id:id++,r,sh:r.sh,kind:"IN",code,area:CHK_AREA[code]||code,start:h,end:h+CHK_P.desemb+road+CHK_P.parada*Math.max(n-1,0),deadline:h+CHK_P.desemb,startLoc:"AIR",endLoc:code,flight:h,flightMax:h,manual:true,
            intl:new Set(),pax:+r.paxi||0,nh:n,priv:/PRIVATIVO|\bPRIV\b|\bPVT\b/i.test(r.intxt),voos:[],junto:/JUNTO/i.test(r.intxt)});
        }
      }
    }
    return legs;
  }

  // junta linhas do mesmo veículo/motorista que são a mesma viagem (grupos e INs de até 30 min)
  function chkViagens(legs){
    const trips=[];
    for(const L of legs){
      if(L.kind!=="EXTRA"||L.apoio||!L.r.veic||L.start==null) continue;
      const o=legs.find(x=>x.kind==="OUT"&&x.r.veic===L.r.veic&&x.r.mot===L.r.mot&&x.start!=null&&x.end!=null&&L.start>=x.start-20&&L.start<=x.end-(CHK_ROAD[x.code]||60)+20&&(!L.startLoc||CHK_AREA[L.startLoc]===x.area||L.startLoc===x.code));
      if(o){ L.juntoOut=o; o.posAero=20; o.extraJunto=(o.extraJunto||[]).concat(L.r.linha); }
    }
    legs=legs.filter(L=>!L.juntoOut);
    for(const L of legs){
      if(L.start==null) { trips.push(Object.assign({},L,{linhas:[L.r.linha],rows:[L.r],intl:new Set(L.intl||[]),privs:[L.priv],juntos:[L.junto]})); continue; }
      const t=L.r.veic&&trips.find(t=>t.kind===L.kind&&t.kind!=="EXTRA"&&t.sh===L.sh&&t.r.veic===L.r.veic&&t.r.mot===L.r.mot&&t.area===L.area&&t.start!=null&&Math.abs(t.start-L.start)<=30);
      if(t){
        t.pax+=L.pax; t.nh+=L.nh; t.linhas.push(L.r.linha); t.rows.push(L.r); t.voos=t.voos.concat(L.voos);
        L.intl.forEach(x=>t.intl.add(x)); t.start=Math.min(t.start,L.start); t.end=Math.max(t.end||0,L.end||0);
        t.deadline=Math.min(t.deadline,L.deadline); if(L.flight!=null) t.flight=t.flight==null?L.flight:Math.min(t.flight,L.flight);
        if(L.flightMax!=null) t.flightMax=Math.max(t.flightMax||0,L.flightMax);
        t.privs.push(L.priv); t.juntos.push(L.junto);
      } else trips.push(Object.assign({},L,{linhas:[L.r.linha],rows:[L.r],intl:new Set(L.intl||[]),privs:[L.priv],juntos:[L.junto]}));
    }
    return trips;
  }

  // ordem do dia: no IN conta a hora em que o motorista precisa estar no aeroporto (pax saindo)
  const chkOrd=t=>t.kind==="IN"?t.deadline-1:t.start;
  function chkRef(t){ return (t.sh==="N"?"Noite":"Dia")+" L"+t.linhas.join("/")+(t.r.mot?" · "+titulo(t.r.mot):"")+(t.r.veic?" · "+t.r.veic:""); }
  function chkDesc(t){
    if(t.kind==="EXTRA") return t.txt+" "+chkHora(t.start);
    const v=t.voos.length? [...new Set(t.voos.map(x=>x.voo+" "+chkHora(x.t)))].join(", ") : (t.semVoo?"sem voo":"");
    return (t.kind==="OUT"?"OUT ":"IN ")+t.code+(t.priv?" priv.":"")+" "+(t.kind==="OUT"?chkHora(t.start):chkHora(t.flight))+(v?" ("+v+")":"")+" · "+t.pax+" pax";
  }

  function chkAnalisar(rows){
    const itens=[]; const add=(turno,cat,tipo,ref,found,action,id)=>itens.push({turno,cat,tipo,ref,found,action,id:id||cat+"-"+itens.length});
    const legs=chkTrechos(rows.filter(r=>r.veic));
    const trips=chkViagens(legs);
    const road=trips.filter(t=>t.kind!=="EXTRA");

    // 1) margens dos OUT, coleta pedida pelo pax, espera longa
    const margens=[];
    for(const t of road.filter(t=>t.kind==="OUT")){
      const intl=t.intl.has(true); let status="OK", margem=null;
      if(t.start==null) status="Sem horário";
      else if(t.flight!=null){ margem=t.flight-t.end;
        if(margem<(intl?CHK_P.intR:CHK_P.domR)) status="Risco"; else if(margem<(intl?CHK_P.intA:CHK_P.domA)) status="Atenção"; else if(margem>CHK_P.esperaLonga&&!t.priv) status="Espera longa"; }
      const pick=t.pick!=null?chkAbs(t.pick,t.sh):null;
      if(pick!=null&&t.start!=null&&Math.abs(pick-t.start)>=10&&status!=="Risco") status="Ajustar coleta";
      margens.push({t,status,margem,pick});
      const ref=chkRef(t);
      if(status==="Sem horário") add(t.sh==="N"?"noite":"dia","conferir","Coleta sem horário",ref,chkDesc(t)+": a coluna de coleta está vazia ou ilegível ("+String(t.r.col1==null?"vazia":t.r.col1)+").","Corrigir o horário de coleta.");
      else if(status==="Risco"||status==="Atenção") add(t.sh==="N"?"noite":"dia","horario","Margem curta",ref,chkDesc(t)+": chega ~"+chkHora(t.end)+", "+chkDur(margem)+" antes do voo"+(pick!=null?" (horário pedido pelo pax)":"")+".",pick!=null?"Horário pedido pelo pax — só confirmar.":"Antecipar a coleta ou confirmar.");
      else if(status==="Espera longa") add(t.sh==="N"?"noite":"dia","horario","Coleta muito cedo",ref,chkDesc(t)+": chega ~"+chkHora(t.end)+", "+chkDur(margem)+" antes do voo.","Se não for pedido do pax, coletar mais perto do padrão.");
      else if(status==="Ajustar coleta") add(t.sh==="N"?"noite":"dia","horario","Coleta diferente do pedido",ref,chkDesc(t)+": a prévia coleta "+chkHora(t.start)+" e a observação pede "+chkHora(pick)+".","Ajustar para o horário da observação.");
      if(t.semVoo) add(t.sh==="N"?"noite":"dia","conferir","OUT sem voo",ref,chkDesc(t)+" lançado sem voo.","Conferir o voo para checar a margem.");
    }

    // 2) lotação, privativo junto, internacional com doméstico
    for(const t of road){
      const c=chkCap(t.r.veic), ref=chkRef(t), tu=t.sh==="N"?"noite":"dia";
      if(t.pax>c.cap&&!(t.privs.length>1&&t.privs.some(x=>x))&&!t.rows.some(r=>new RegExp("PARA "+t.pax+" PAX","i").test(r.outtxt+" "+r.intxt))) add(tu,"conferir","Lotação",ref,chkDesc(t)+" num "+c.tipo+" (limite "+c.cap+").","Confirmar se há criança ou trocar o veículo.");
      if(t.privs.length>1&&t.privs.some(x=>x)&&!t.juntos.some(x=>x)) add(tu,"conflito",t.privs.every(x=>x)?"Privativos juntos":"Privativo com regular",ref,chkDesc(t)+" — "+t.privs.length+" reservas na mesma viagem, sendo "+t.privs.filter(x=>x).length+" privativa(s).","Separar: privativo não junta com regular nem com outro privativo.");
      if(t.intl.size>1) add(tu,"conflito","Internacional com doméstico",ref,chkDesc(t)+".","Separar ou confirmar a exceção.");
      const porNum={}; for(const x of t.voos){ (porNum[x.voo]=porNum[x.voo]||new Set()).add(x.t); }
      for(const [v,s] of Object.entries(porNum)) if(s.size>1) add(tu,"conferir","Voo com dois horários",ref,"O "+v+" aparece com "+[...s].map(chkHora).join(" e ")+".","Conferir o horário certo.");
    }

    // 3) linha do tempo por motorista e por veículo
    const porMot={}; for(const t of trips) if(t.start!=null&&t.r.mot) (porMot[t.r.mot]=porMot[t.r.mot]||[]).push(t);
    const chkOp=(u,excl,filtro)=>{
      const opcoes=[];
      // reserva vinculada
      const lig=((u.r.outtxt+" "+u.r.intxt).match(/JUNTO COM (?:A |O )?(REC-\d+)/i)||[])[1];
      if(lig){ const alvo=trips.find(t=>t.rows.some(r=>(r.outtxt+" "+r.intxt).includes(lig))); if(alvo) opcoes.push({txt:"Juntar com "+titulo(alvo.r.mot)+" ("+alvo.r.veic+"), como pede a observação ("+lig+").",score:-1}); }
      // junção com viagem regular que já existe
      if(!filtro&&!u.priv&&u.kind!=="EXTRA") for(const t of road){
        if(t.id===u.id||t.r.mot===excl) continue;
        if(t.kind!==u.kind||t.area!==u.area||t.priv||t.sh!==u.sh) continue;
        if([...t.intl][0]!==[...u.intl][0]&&t.intl.size&&u.intl.size) continue;
        const c=chkCap(t.r.veic); if(t.pax+u.pax>c.cap||t.nh+u.nh>8) continue;
        const ok=u.kind==="IN"? Math.abs(t.flight-u.flight)<25 : (t.end!=null&&u.end!=null&&Math.abs(t.end-u.end)<=15&&t.flight!=null&&u.flight!=null&&Math.abs(t.flight-u.flight)<25);
        if(ok) opcoes.push({txt:"Juntar com "+titulo(t.r.mot)+" ("+t.r.veic+", "+t.pax+" pax): fica "+(t.pax+u.pax)+"/"+c.cap+" e "+(t.nh+u.nh)+" hotéis.",score:-5});
      }
      // encaixe na agenda de um motorista
      for(const [mot,ts0] of Object.entries(porMot)){
        if(mot===excl||(filtro&&!filtro(mot,u))||!chkNoTurno(mot,u.kind==="IN"?u.deadline:u.start,u.end)) continue;
        const ts=ts0.filter(t=>t.id!==u.id);
        if(!ts.some(t=>t.sh===u.sh)) continue;
        for(let i=0;i<=ts.length;i++){
          const p=ts[i-1], n=ts[i];
          if(p&&p.end==null) continue;
          const veic=(p||n).r.veic, c=chkCap(veic);
          if(u.pax>c.cap&&!(u.r.veic&&chkCap(u.r.veic).tipo===c.tipo)) continue;
          const pede=chkNorm(u.r.outtxt+" "+u.r.intxt);
          if(/SEDAN|SUV|HAVAL/.test(pede)&&c.tipo!=="Localiza") continue;
          if(/PRIV(ATIVO)? VAN|\bVAN\b/.test(pede)&&c.tipo==="Localiza") continue;
          const chega=p? p.end+(p.posAero||0)+chkViagem(p.endLoc,u.startLoc) : null;
          if(p&&chega>u.deadline) continue;
          if(n&&u.end+chkViagem(u.endLoc,n.startLoc)>n.deadline) continue;
          if(!p&&n&&n.start-u.end>120) continue;
          if(!n&&p&&u.start-p.end>120) continue;
          if(!p&&!n) continue;
          const vazio=(p?chkViagem(p.endLoc,u.startLoc):0)+(n?chkViagem(u.endLoc,n.startLoc):0)-(p&&n?chkViagem(p.endLoc,n.startLoc):0);
          const espera=p? u.deadline-chega : 0;
          const porte=(c.cap-u.pax>12?25:0)+(u.priv&&u.pax<=3&&c.tipo!=="Localiza"?15:0);
          opcoes.push({mot,txt:titulo(mot)+" ("+veic+")"+(p?": termina "+chkDesc(p).split(" (")[0]+" ~"+chkHora(p.end)+(p.endLoc==="AIR"?" no aeroporto":p.endLoc?" em "+p.endLoc:""):"")+(n?(p?" e ":": ")+"o próximo serviço é "+chkHora(n.start):"")+".",score:vazio+espera/8+porte+(p&&p.kind==="EXTRA"?25:0)+(n&&n.kind==="EXTRA"?10:0)+(u.r.veic&&chkCap(u.r.veic).tipo!==c.tipo?15:0)});
          break;
        }
      }
      opcoes.sort((a,b)=>a.score-b.score);
      return opcoes.slice(0,2);
    };
    const folgas={};
    for(const [mot,ts] of Object.entries(porMot)){
      const r=chkRestricao(mot); if(!r) continue;
      const fora=ts.filter(t=>t.start!=null&&!chkNoTurno(mot,t.kind==="IN"?t.deadline:t.start,t.end)&&!(t.apoio));
      if(!fora.length) continue;
      const sh=fora[0].sh;
      add(sh==="N"?"noite":"dia","horario","Fora do turno do motorista",titulo(mot)+" · "+[...new Set(fora.map(t=>t.r.veic))].join("/"),
        titulo(mot)+(r==="cedo"?" pega cedo e não pega tarde (até "+chkHora(CHK_RESTR.cedo.ate)+")":" pega tarde (a partir de "+chkHora(CHK_RESTR.tarde.desde)+")")+", mas está com: "+fora.map(t=>chkDesc(t).split(" · ")[0]+" (L"+t.linhas.join("/")+", até ~"+chkHora(t.end)+")").join("; ")+".",
        (()=>{ const o=chkOp(fora[0],mot); return o.length&&!/^Juntar/.test(o[0].txt)?"Passar "+chkDesc(fora[0]).split(" · ")[0]+" para "+o[0].txt.replace(/\.$/,"")+".":"Trocar com um motorista do turno certo."; })(),"turno-"+mot);
    }
    for(const [mot,ts] of Object.entries(porMot)){
      ts.sort((a,b)=>chkOrd(a)-chkOrd(b));
      for(let i=0;i+1<ts.length;i++){
        const a=ts[i], b=ts[i+1]; if(a.end==null) continue;
        const chega=a.end+(a.posAero||0)+chkViagem(a.endLoc,b.startLoc), folga=b.deadline-chega;
        folgas[a.id]=folga;
        if(a.kind==="EXTRA"&&b.kind==="EXTRA") continue;
        const tu=b.sh==="N"?"noite":"dia";
        const txt=chkDesc(a)+" termina ~"+chkHora(a.end)+(a.endLoc&&a.endLoc!=="AIR"?" em "+a.endLoc:"")+"; "+chkDesc(b)+(b.kind==="IN"?" (pax saindo ~"+chkHora(b.deadline)+")":"")+".";
        if(folga<-15) add(tu,"conflito",a.r.veic!==b.r.veic?"Motorista em dois veículos":(a.kind==="IN"&&b.kind==="OUT"?"Casadinha não fecha":"Horários não fecham"),"L"+a.linhas.join("/")+" → L"+b.linhas.join("/")+" · "+titulo(mot),txt+" Faltam ~"+chkDur(-folga)+".",(()=>{ if(a.kind==="OUT"&&a.flight!=null){ const nova=a.flight-a.end-folga, lim=a.intl.has(true)?CHK_P.intA:CHK_P.domA; if(-folga<=60&&a.flight-(a.end+folga)>=lim) return "Antecipar a coleta do OUT em ~"+chkDur(-folga)+": ainda chega "+chkDur(a.flight-(a.end+folga))+" antes do voo."; } const o=chkOp(b,mot); return o.length?(/^Juntar/.test(o[0].txt)?"Tirar "+chkDesc(b).split(" · ")[0]+" daqui e "+o[0].txt.charAt(0).toLowerCase()+o[0].txt.slice(1):"Passar "+chkDesc(b).split(" · ")[0]+" para "+o[0].txt.replace(/\.$/,"")+"."):"Passar um dos serviços para outro motorista ou ajustar o horário."; })(),"mot-"+mot+"-"+a.id);
        else if(folga<10&&!a.apoio&&!b.apoio) add(tu,"horario","Apertado","L"+a.linhas.join("/")+" → L"+b.linhas.join("/")+" · "+titulo(mot),txt+(folga<0?" Atraso de ~"+chkDur(-folga)+".":" Folga de ~"+chkDur(folga)+"."),"Avisar o motorista.","apt-"+mot+"-"+a.id);
      }
    }
    const porVei={}; for(const t of trips) if(t.start!=null&&t.r.veic) (porVei[t.r.veic]=porVei[t.r.veic]||[]).push(t);
    for(const [vei,ts] of Object.entries(porVei)){
      if(/^(LOCALIZA|VAN|MICRO|MICRAO|BUS)$/i.test(chkNorm(vei))){ add(ts[0].sh==="N"?"noite":"dia","conferir","Veículo sem número",chkRef(ts[0]),"Veículo lançado só como \""+vei+"\".","Completar o número do veículo."); continue; }
      ts.sort((a,b)=>chkOrd(a)-chkOrd(b));
      const probs=[];
      for(let i=0;i+1<ts.length;i++){
        const a=ts[i], b=ts[i+1]; if(a.r.mot===b.r.mot||a.end==null) continue;
        const folga=b.deadline-(a.end+(a.posAero||0)+chkViagem(a.endLoc,b.startLoc));
        if(folga<10&&!(a.apoio||b.apoio)) probs.push({a,b,folga});
      }
      if(!probs.length) continue;
      const grave=probs.some(x=>x.folga<-15), x0=probs.find(x=>x.folga<-15)||probs[0];
      const mots=[...new Set(probs.flatMap(x=>[x.a.r.mot,x.b.r.mot]))].map(titulo);
      const txt=probs.map(x=>titulo(x.a.r.mot)+" termina "+chkDesc(x.a)+" ~"+chkHora(x.a.end)+" e "+titulo(x.b.r.mot)+" precisa do carro para "+chkDesc(x.b)+(x.folga<0?" (faltam ~"+chkDur(-x.folga)+")":"")).join("; ")+".";
      let sug="Apertado; avisar os dois.";
      if(grave){ const o=chkOp(x0.b,x0.b.r.mot).filter(o=>!/^Juntar/.test(o.txt)); sug=o.length?"Passar "+chkDesc(x0.b).split(" · ")[0]+" para "+o[0].txt.replace(/\.$/,"")+".":"Trocar o veículo de um deles."; }
      add(x0.b.sh==="N"?"noite":"dia",grave?"conflito":"horario","Troca de veículo",vei+" · "+mots.join(" / "),txt,sug,"vei-"+vei);
    }

    // voo com horários diferentes em linhas diferentes
    { const vh={}; for(const t of road) for(const v of t.voos){ (vh[v.voo]=vh[v.voo]||[]).push({t,h:v.t}); }
      for(const [voo,L] of Object.entries(vh)){ const hs=[...new Set(L.map(x=>x.h))]; if(hs.length<2) continue;
        const ls=[...new Set(L.map(x=>x.t))]; if(ls.length<2) continue;
        add(L[0].t.sh==="N"?"noite":"dia","conferir","Voo com dois horários",voo,"O "+voo+" aparece com "+hs.map(chkHora).join(" e ")+": "+ls.map(t=>(t.sh==="N"?"Noite":"Dia")+" L"+t.linhas.join("/")+(t.r.mot?" "+titulo(t.r.mot):"")).join(", ")+".","Confirmar o horário certo do voo."); } }

    // 4) sem veículo: encaixe em quem já está na escala
    const semV=chkViagens(chkTrechos(rows.filter(r=>!r.veic&&!/APOIO/i.test(r.outtxt))));
    const apoiosSem=rows.filter(r=>!r.veic&&/APOIO/i.test(r.outtxt));
    const sugestoes=[];
    for(const u of semV){
      if(u.start==null) continue;
      const tu=u.sh==="N"?"noite":"dia";
      const best=chkOp(u,null);
      add(tu,"semveic",best.length?"Encaixe":"Precisa de veículo",(u.sh==="N"?"Noite":"Dia")+" L"+u.linhas.join("/"),chkDesc(u)+" sem veículo.",best.length?best.map(o=>o.txt).join(" Ou: "):"Não achei encaixe dentro das regras — escalar.");
      sugestoes.push({u,best});
    }
    if(apoiosSem.length){
      const grupos={}; for(const r of apoiosSem){ const k=(r.sh==="N"?"Noite":"Dia")+" "+(/PORTO/i.test(r.outtxt)?"Porto":"Recife")+" "+(/VOLTA/i.test(r.outtxt)?"volta":"ida"); (grupos[k]=grupos[k]||[]).push(r); }
      for(const sh of ["N","D"]){ const ks=Object.keys(grupos).filter(k=>k.startsWith(sh==="N"?"Noite":"Dia")); if(!ks.length) continue;
        add(sh==="N"?"noite":"dia","semveic","Apoios",ks.reduce((s,k)=>s+grupos[k].length,0)+" apoios sem veículo",ks.map(k=>k.replace(/^(Noite|Dia) /,"")+": "+grupos[k].length).join(" · ")+".","Escalar os apoios."); }
    }

    // 5) ganhos: junções que liberam um motorista e porte do veículo
    const servMot=m=>(porMot[m]||[]).filter(t=>t.kind!=="EXTRA").length;
    const cand={};
    for(const a of road) for(const b of road){
      if(a.id>=b.id||a.kind!==b.kind||a.area!==b.area||a.sh!==b.sh||a.priv||b.priv||a.r.mot===b.r.mot||a.area==="REC") continue;
      if(!a.voos.length||!b.voos.length) continue;
      if(a.intl.size&&b.intl.size&&[...a.intl][0]!==[...b.intl][0]) continue;
      if(Math.abs(a.nh-b.nh)>2||a.nh+b.nh>8) continue;
      let ok=false;
      if(a.kind==="IN") ok=Math.abs(a.flight-b.flight)<25&&Math.abs((a.flightMax||a.flight)-(b.flightMax||b.flight))<25;
      else ok=a.end!=null&&b.end!=null&&Math.abs(a.end-b.end)<=5&&a.flight!=null&&b.flight!=null&&Math.abs(a.flight-b.flight)<25;
      if(!ok) continue;
      const [fica,sai]=servMot(a.r.mot)>=servMot(b.r.mot)?[a,b]:[b,a];
      const c=chkCap(fica.r.veic); if(fica.pax+sai.pax>c.cap) continue;
      const libera=servMot(sai.r.mot)===1;
      if(!libera&&a.kind==="IN") continue;
      const nota=(fica.nh+sai.nh)*10+(fica.pax+sai.pax)/c.cap;
      if(!cand[sai.id]||cand[sai.id].nota>nota) cand[sai.id]={fica,sai,c,libera,nota};
    }
    for(const {fica,sai,c,libera} of Object.values(cand))
      add(sai.sh==="N"?"noite":"dia","ganho",sai.kind==="IN"?"Junção de IN":"Junção de OUT",titulo(sai.r.mot)+" ("+sai.r.veic+") → "+titulo(fica.r.mot)+" ("+fica.r.veic+")",chkDesc(sai)+" e "+chkDesc(fica)+" ("+sai.nh+" + "+fica.nh+" hotéis).","Passar os pax de "+titulo(sai.r.mot)+" para "+titulo(fica.r.mot)+": fica "+(fica.pax+sai.pax)+"/"+c.cap+"."+(libera?" "+titulo(sai.r.mot)+" fica livre (era o único serviço de estrada dele).":" Ganho pequeno — avaliar."));
    for(const [vei,ts] of Object.entries(porVei)){
      const c=chkCap(vei); if(c.cap<32) continue;
      const rs=ts.filter(t=>t.kind!=="EXTRA"); if(!rs.length) continue;
      const max=Math.max(...rs.map(t=>t.pax)); if(max>15) continue;
      add(rs[0].sh==="N"?"noite":"dia","ganho","Porte do veículo",titulo(rs[0].r.mot)+" · "+vei,rs.length===1?"Único serviço do dia: "+chkDesc(rs[0])+" e "+rs[0].nh+" hotéis.":rs.length+" viagens no dia, no máximo "+max+" pax.","Cabe numa van de 15 — avaliar bagagem e liberar o "+c.tipo.toLowerCase()+".");
    }

    // 6) aproveitamento do dia (casadinhas por região)
    const dia=road.filter(t=>t.start!=null&&t.start>=1440&&["PGA","MRG","CABO"].includes(t.area));
    const feitas=new Set(); const pares=[];
    for(const ts of Object.values(porMot)){ const r=ts.filter(t=>t.kind!=="EXTRA"); for(let i=0;i+1<r.length;i++){ const a=r[i], b=r[i+1]; if(a.kind==="IN"&&b.kind==="OUT"&&a.area===b.area&&dia.includes(a)&&dia.includes(b)){ feitas.add(a.id); feitas.add(b.id); pares.push([a,b]); } } }
    const aprov={regioes:[],faltam:[]};
    for(const area of ["PGA","MRG","CABO"]){
      const ins=dia.filter(t=>t.area===area&&t.kind==="IN"), outs=dia.filter(t=>t.area===area&&t.kind==="OUT");
      const mt={};
      const adj=a=>outs.filter(b=>b.start!=null&&a.end!=null&&b.start-a.end>=10&&b.start-a.end<=180&&b.pax<=chkCap(a.r.veic).cap&&(/LOCALIZA/i.test(a.r.veic)===/LOCALIZA/i.test(b.r.veic)));
      const aug=(a,seen)=>{ for(const b of adj(a)){ if(seen.has(b.id)) continue; seen.add(b.id); if(!mt[b.id]||aug(mt[b.id],seen)){ mt[b.id]=a; return true; } } return false; };
      for(const a of ins) aug(a,new Set());
      const nf=pares.filter(p=>p[0].area===area).length, np=Object.keys(mt).length, v=ins.length+outs.length;
      aprov.regioes.push({area,v,i:ins.length,o:outs.length,c:nf,p:Math.max(np,nf),s:v-2*nf,km:(v-2*nf)*CHK_KM[area]});
      for(const [bid,a] of Object.entries(mt)){ const b=outs.find(o=>o.id==bid); if(!feitas.has(a.id)&&!feitas.has(b.id)) aprov.faltam.push({a,b}); }
    }
    const todas=road.filter(t=>t.start!=null&&t.start>=1440);
    const vans=todas.filter(t=>chkCap(t.r.veic).tipo==="Van");
    aprov.ate15=todas.length?Math.round(100*todas.filter(t=>t.pax<=15).length/todas.length):0;
    aprov.ocupVans=vans.length?Math.round(100*vans.reduce((s,t)=>s+t.pax,0)/vans.reduce((s,t)=>s+chkCap(t.r.veic).cap,0)):0;
    aprov.semPar=aprov.regioes.reduce((s,r)=>s+r.s,0); aprov.km=aprov.regioes.reduce((s,r)=>s+r.km,0);

    const resumo={motDia:new Set(trips.filter(t=>t.sh==="D").map(t=>t.r.mot)).size,motNoite:new Set(trips.filter(t=>t.sh==="N").map(t=>t.r.mot)).size,
      outDia:road.filter(t=>t.sh==="D"&&t.kind==="OUT").length,inDia:road.filter(t=>t.sh==="D"&&t.kind==="IN").length,outNoite:road.filter(t=>t.sh==="N"&&t.kind==="OUT").length,inNoite:road.filter(t=>t.sh==="N"&&t.kind==="IN").length,
      semVeic:semV.length,apoiosSem:apoiosSem.length};
    // ids estáveis para guardar as respostas

    // 7) jornada dos motoristas (reclamações: rodando muito, sem almoço, escala apertada)
    const CHK_BASE_PORTO=["MICRAO 1961","MICRAO 2423","MICRAO 1905","MICRAO 1849","VAN 1853","VAN 2315","VAN 2321","VAN 2436","VAN 1830","0F46"];
    const jornadas=[], semLista=new Set(), semInicioOk=[], lancUsado=new Set();
    for(const [mot,ts0] of Object.entries(porMot)){
      const ts=ts0.filter(t=>t.start!=null&&t.end!=null&&!/GARAGEM.*RESID|RESID.*GARAGEM/i.test(t.txt||"")).sort((a,b)=>chkOrd(a)-chkOrd(b));
      if(!ts.length) continue;
      // separa em jornadas quando a pausa passa de 8h
      const grupos=[[ts[0]]];
      for(let i=1;i<ts.length;i++){ const a=ts[i-1], b=ts[i]; if(chkOrd(b)-(a.end+(a.posAero||0))>480) grupos.push([b]); else grupos[grupos.length-1].push(b); }
      for(const g of grupos){
        const veics=[...new Set(g.map(t=>chkNorm(t.r.veic)))];
        const base=veics.some(v=>CHK_BASE_PORTO.includes(v))?"PGA":"AIR";
        let ini=chkOrd(g[0])-(g[0].kind==="IN"?0:chkViagem(base,g[0].startLoc))-(g[0].kind==="IN"?chkViagem(base,"AIR"):0);
        // início da jornada: o horário que o operacional lança no fim da aba Noite (quando houver)
        const lanc=g[0].sh==="N"&&!lancUsado.has(mot)?chkInicioLancado(rows.inicios,mot):null, iniCalc=ini; if(lanc!=null) lancUsado.add(mot);
        if(lanc!=null){ ini=chkAbs(lanc,"N"); if(ini>chkOrd(g[0])+(g[0].kind==="IN"?CHK_P.desemb:0)-chkViagem(base,g[0].startLoc||"AIR")+10) semInicioOk.push({mot,ini,first:g[0]}); }
        else if(g[0].sh==="N"&&!lancUsado.has(mot)) semLista.add(mot);
        const ult=g[g.length-1], fim=ult.end+(ult.posAero||0)+chkViagem(ult.endLoc||base,base);
        let efetivo=chkViagem(base,g[0].startLoc)+chkViagem(ult.endLoc||base,base), maiorPausa=0, apertados=0; const livres=[];
        for(let i=0;i<g.length;i++){
          const t=g[i]; efetivo+=t.kind==="IN"? (t.end-t.deadline+CHK_P.desemb*0) : (t.end-t.start);
          if(i+1<g.length){ const n=g[i+1], desl=chkViagem(t.endLoc,n.startLoc), livreIni=t.end+(t.posAero||0)+desl, livreFim=chkOrd(n)+(n.kind==="IN"?CHK_P.desemb:0);
            efetivo+=desl; const pausa=livreFim-livreIni; maiorPausa=Math.max(maiorPausa,pausa); if(pausa<15&&!(t.apoio||n.apoio)) apertados++; if(pausa>0) livres.push([livreIni,livreFim]); }
        }
        const dur=fim-ini, sh=g.some(t=>t.sh==="D")?"D":"N";
        const dia=sh==="D"?1440:0;
        const trabAlmoco=g.some(t=>(t.kind==="IN"?t.deadline:t.start)<dia+870&&t.end>dia+690);
        // almoço/pausa: 2 intervalos de 30 min (ou 1 de 1h) — regra do operacional
        const naJanela=livres.map(([a,b])=>Math.min(b,dia+930)-Math.max(a,dia+630));
        const temAlmoco=naJanela.some(x=>x>=60)||naJanela.filter(x=>x>=30).length>=2;
        const pausas30=livres.filter(([a,b])=>b-a>=30).length;
        const semAlmoco=trabAlmoco&&!temAlmoco&&!(ini>dia+870||fim<dia+690);
        const intra=(dur>360&&!(maiorPausa>=60||pausas30>=2))||(dur>240&&dur<=360&&maiorPausa<15);
        const servicos=g.filter(t=>t.kind!=="EXTRA").length+g.filter(t=>t.apoio).length/2+g.filter(t=>t.kind==="EXTRA"&&!t.apoio).length;
        const mrg=g.some(t=>t.area==="MRG"||/MARAGOGI|JAPARATINGA/i.test(t.txt||""));
        const partida=g.some(t=>t.apoio)&&efetivo<0.55*(fim-ini);
        jornadas.push({iniLancado:lanc!=null,mot,sh,base:base==="PGA"?"Porto":"Recife",veics,servicos,ini,fim,dur,efetivo:Math.round(efetivo),maiorPausa,apertados,semAlmoco,intra,mrg,partida,trips:g,alertas:[]});
      }
    }
    if(Object.keys(rows.inicios||{}).length){
      const falt=[...semLista].filter(m=>(porMot[m]||[]).some(t=>t.sh==="N"&&t.kind!=="EXTRA"));
      if(falt.length) add("noite","conferir","Fora da lista de início","Aba Noite · lista de horários",falt.map(titulo).join(", ")+" têm serviço à noite mas não estão na lista de horário de início.","Incluir na lista (a jornada deles foi calculada pelo primeiro serviço).");
      for(const x of semInicioOk) add("noite","horario","Início depois do 1º serviço",titulo(x.mot),"Lançado para começar às "+chkHora(x.ini)+", mas o primeiro serviço é "+chkDesc(x.first)+".","Conferir o horário de início na lista da aba Noite.");
    }
    // descanso entre a jornada da noite e a do dia do mesmo motorista
    for(const j of jornadas){ const ant=jornadas.filter(x=>x.mot===j.mot&&x!==j&&x.fim<=j.ini).sort((a,b)=>b.fim-a.fim)[0]; j.descanso=ant?j.ini-ant.fim:null; }
    for(const j of jornadas){
      if(j.dur>600&&!j.partida) j.alertas.push(j.dur>720?"Jornada 12h+":"Jornada 10h+");
      if(j.efetivo>480) j.alertas.push("Efetivo 8h+");
      if(j.semAlmoco) j.alertas.push("Sem almoço");
      if(j.intra&&!j.partida) j.alertas.push("Sem pausa");
      if(j.descanso!=null&&j.descanso<660) j.alertas.push("Descanso < 11h");
      if(j.apertados) j.alertas.push(j.apertados+" encaixe"+(j.apertados>1?"s":"")+" apertado"+(j.apertados>1?"s":""));
    }
    // sugestão: tirar um serviço (o do almoço ou o último) e passar para quem tem 0–1 serviço
    const servDe=m=>(jornadas.filter(j=>j.mot===m).reduce((s,j)=>s+j.servicos,0));
    const temNoite=m=>jornadas.some(j=>j.mot===m&&j.sh==="N");
    const alertaDe=m=>jornadas.some(j=>j.mot===m&&j.alertas.some(a=>!/encaixe/.test(a)));
    const ocupado=m=>(porMot[m]||[]).some(t=>/DISPOSI|STAND ?BY/i.test(t.txt||"")); const jaRecebeu=new Set();
    for(const j of jornadas){
      if(!j.alertas.some(a=>!/encaixe/.test(a))) continue;
      const cand=j.trips.filter(t=>t.kind!=="EXTRA");
      const alvo=(j.semAlmoco&&cand.find(t=>t.start<(j.sh==="D"?1440:0)+870&&t.end>(j.sh==="D"?1440:0)+690))||cand[cand.length-1];
      if(!alvo){ j.sugestao="Só tem apoio/extra: ver a escala de apoio."; continue; }
      const o=chkOp(alvo,j.mot,(m,u)=>!jaRecebeu.has(m)&&!ocupado(m)&&servDe(m)<=1.5&&!alertaDe(m)&&!(u.sh==="D"&&temNoite(m)&&u.start<1440+840)&&!(jornadas.some(x=>x.mot===m&&x.mrg)&&servDe(m)>=2));
      if(o.length) jaRecebeu.add(o[0].mot);
      j.sugestao=o.length?"Passar "+chkDesc(alvo).split(" · ")[0]+" para "+o[0].txt.replace(/\.$/,"")+".":"Ninguém com 0–1 serviço livre no lugar e hora certos: a escala precisa de reforço "+(alvo.area&&alvo.area!=="REC"?"para "+alvo.area:"em Recife")+" por volta das "+chkHora(alvo.start)+".";
      const graves=j.alertas.filter(a=>!/encaixe/.test(a));
      add(j.sh==="N"?"noite":"dia","jornada",graves.join(" · "),titulo(j.mot)+" · "+j.veics.join("/"),"Jornada de "+chkDur(j.dur)+" ("+chkHora(j.ini)+"–"+chkHora(j.fim)+", base "+j.base+"), "+chkDur(j.efetivo)+" dirigindo, "+j.servicos+" serviço(s), maior pausa "+chkDur(j.maiorPausa)+(j.descanso!=null?", descanso antes "+chkDur(j.descanso):"")+".",j.sugestao,"jor-"+j.mot+"-"+j.sh);
    }
    const cont={}; for(const it of itens){ const base=it.cat+"|"+it.tipo+"|"+it.ref; cont[base]=(cont[base]||0)+1; it.id=base+"|"+cont[base]; }
    return {itens,margens,trips,porMot,folgas,aprov,resumo,jornadas};
  }

  // ---- Observações especiais (lidas de todas as reservas) ----
  const CHK_OBS=[
    {tipo:"Acessibilidade",re:/CADEIRA DE RODAS|CADEIRANTE|SCOOTER|MOBILIDADE|MULETA|ANDADOR|JOELHO|DIFICULDADE (DE|PARA) (LOCOMO|ANDAR|SUBIR|DESCER)|LOCOMO[CÇ]|PCD|DEFICI[EÊ]N|AUTIS|GESTANTE|GR[AÁ]VIDA|OXIG[EÊ]NIO|PRECISA DE AJUDA|AJUDA PARA SUBIR/,acao:"Escalar carro adequado e avisar o motorista para ajudar no embarque."},
    {tipo:"Criança / cadeirinha",re:/CADEIRINHA|BEB[EÊ] ?CONFORTO|CONFORTO BEB|ASSENTO (DE )?ELEVA|BOOSTER|ACOPLA/,acao:"Conferir se o item está no carro (e se o veículo acopla)."},
    {tipo:"Bagagem / veículo pedido",re:/\d+\s*MALAS|MALAS? GRANDE|BAGAGEM|CARRO[ÇC]A|PRANCHA|BIKE|BICICLETA|MAIOR (SUV|CARRO)|SUV (GRANDE|PREMIUM)|HAVAL|MICRO DE \d+|\d+\s*[ÔO]NIBUS|CARRO E N[AÃ]O VAN|CACHORR|\bPET\b|ANIMAL/,acao:"Confirmar se o veículo escalado comporta."},
    {tipo:"Atendimento",re:/INFLUENC|CESTA|\bVIP\b|FUNCION[AÁ]RI|DIRETOR|ANIVERS|LUA DE MEL|\b[AÁ]GUA\b|ALMO[CÇ]|APRESENTA[RM]? NO BOX|NO BOX|N[AÃ]O (TEM|POSSUI) VOO|SEM VOO|CORTESIA|AGENTE DE VIAGEN|N[AÃ]O TEM CELULAR|IMPRIMIR|ATT ESPECIAL|ATEN[CÇ][AÃ]O ESPECIAL/,acao:"Avisar o motorista e o Box."}
  ];
  const CHK_VANS_CADEIRINHA=["VAN 2670","VAN 2685","VAN 2686","VAN 2616","VAN 2436"];
  function chkObsEspeciais(txt){
    const t=chkNorm(txt); if(!t) return [];
    if(/CRIADA PARA FINS DE ESCALA/.test(t)) return [];
    const partes=String(txt).split(/\/\/|\n|\s\/\s|\*\*/).map(x=>x.trim()).filter(Boolean);
    const achados=[];
    for(const c of CHK_OBS){
      const tr=partes.filter(x=>c.re.test(chkNorm(x))&&!/^VER HOTEL/i.test(x)); if(!tr.length) continue;
      achados.push({tipo:c.tipo,trecho:tr.join(" · ").slice(0,260),acao:c.acao});
    }
    return achados;
  }
  function chkItensObs(rows,recs,casar){
    const itens=[], vistos=new Set();
    const add=(turno,tipo,ref,found,action,fonte)=>itens.push({turno,cat:"obs",tipo,ref,found,action,fonte});
    const veicOk=(tipo,veic)=>!(tipo==="Criança / cadeirinha"&&/^VAN /.test(chkNorm(veic))&&!CHK_VANS_CADEIRINHA.includes(chkNorm(veic)));
    for(const p of (recs||[])){
      if(!p.obs||p._m===undefined||/N[ÃA]O ESCALAR|DISPENSOU|\bCLD\b|CANCELAD/i.test(p.obs)) continue;
      const ach=chkObsEspeciais(p.obs); if(!ach.length) continue;
      const m=casar?casar(p):null;
      for(const a of ach){
        const k=p.codigo+"|"+a.tipo; if(vistos.has(k)) continue; vistos.add(k);
        const quem=m&&m.r.veic?titulo(m.r.mot)+" ("+m.r.veic+")":p.veic?titulo(p.mot)+" ("+p.veic+", Phoenix)":"sem veículo";
        const hora=chkHora(p.tipo==="IN"?p.hVoo:p.hApr);
        const veic=m&&m.r.veic?m.r.veic:p.veic;
        let acao=a.acao;
        if(quem==="sem veículo") acao="Sem veículo: escalar já considerando isso. "+acao;
        if(veic&&!veicOk(a.tipo,veic)) acao="A "+veic+" não está na lista das vans que acoplam cadeirinha — confirmar ou trocar. "+acao;
        add(m?(m.r.sh==="N"?"noite":"dia"):(p.data&&hora&&(p.tipo==="IN"?p.hVoo:p.hApr)<360?"noite":"dia"),a.tipo,p.codigo+" · "+chkHotelNorm(p.tipo==="OUT"?p.origem:p.destino)+" · "+p.tipo+" "+(p.voo?p.voo+" ":"")+hora+" · "+quem,"\""+a.trecho+"\" ("+p.pax+" pax"+(p.parceiro?", "+p.parceiro:"")+").",acao,"phoenix");
      }
    }
    // linhas da prévia (sem o Phoenix, ou o que o Phoenix não trouxe)
    for(const r of rows){
      for(const [k,txt] of [["OUT",r.outtxt],["IN",r.intxt]]){
        if(!txt) continue;
        const resto=String(txt).split("\n").map(l=>l.replace(/^.*?TRF (IN|OUT)[^|]*\|[^|]*\|[^/]*/i,"")).join(" // ");
        const ach=chkObsEspeciais(resto); if(!ach.length) continue;
        const recsL=String(txt).match(/REC-\d+/g)||[];

  function chkHtmlHistJornada(D){
    const J=[]; for(const x of D) for(const j of (x.jornadas||[])) J.push(Object.assign({dia:x.data},j));
    let h='<h3 style="font-size:1.05rem;color:var(--tinta);margin:22px 0 6px">Motoristas: serviços e jornada</h3>';
    if(!J.length) return h+'<div class="card" style="font-size:.85rem;color:var(--muted)">Ainda não há jornadas salvas neste mês. Elas entram nos dias salvos a partir de agora (botão "Salvar no histórico" na aba Aproveitamento).</div>';
    const n=J.length, med=k=>J.reduce((s,j)=>s+(+j[k]||0),0)/n, crit=j=>(j.alertas||[]).some(a=>!/encaixe/.test(a));
    const dias=new Set(J.map(j=>j.dia)).size;
    const a10=J.filter(j=>j.dur>600&&!j.partida).length, a12=J.filter(j=>j.dur>720&&!j.partida).length, sa=J.filter(j=>j.semAlmoco).length, s1=J.filter(j=>j.servicos<=1).length, dc=J.filter(j=>j.descanso!=null&&j.descanso<660).length;
    h+='<p style="font-size:.8rem;color:var(--muted);margin-bottom:10px">'+n+' jornadas de '+new Set(J.map(j=>j.mot)).size+' motoristas em '+dias+' dia(s) salvos.</p><div class="cards-resumo">'
      +'<div class="resumo"><div class="num">'+med("servicos").toFixed(1).replace(".",",")+'</div><div class="lbl">Serviços por motorista/dia</div></div>'
      +'<div class="resumo"><div class="num">'+chkDur(med("dur"))+'</div><div class="lbl">Jornada média (saída e volta à base)</div></div>'
      +'<div class="resumo"><div class="num">'+chkDur(med("ef"))+'</div><div class="lbl">Tempo efetivo médio (dirigindo)</div></div>'
      +'<div class="resumo alerta"><div class="num">'+a10+' ('+Math.round(100*a10/n)+'%)</div><div class="lbl">Jornadas acima de 10h · '+a12+' acima de 12h</div></div>'
      +'<div class="resumo alerta"><div class="num">'+sa+'</div><div class="lbl">Sem 2 intervalos de 30 min entre 10:30 e 15:30</div></div>'
      +'<div class="resumo alerta"><div class="num">'+dc+'</div><div class="lbl">Descanso menor que 11h</div></div>'
      +'<div class="resumo"><div class="num">'+s1+' ('+Math.round(100*s1/n)+'%)</div><div class="lbl">Jornadas com só 1 serviço</div></div></div>';
    const por={};
    for(const j of J){ const p=(por[j.mot]=por[j.mot]||{mot:j.mot,dias:new Set(),j:[],base:j.base}); p.dias.add(j.dia); p.j.push(j); }
    const L=Object.values(por).map(p=>{ const k=p.j.length, m=f=>p.j.reduce((s,j)=>s+(+j[f]||0),0)/k;
      return {mot:p.mot,base:p.base,dias:p.dias.size,serv:m("servicos"),dur:m("dur"),ef:m("ef"),a10:p.j.filter(j=>j.dur>600&&!j.partida).length,sa:p.j.filter(j=>j.semAlmoco).length,dc:p.j.filter(j=>j.descanso!=null&&j.descanso<660).length,mrg:p.j.filter(j=>j.mrg).length,crit:p.j.filter(crit).length}; })
      .sort((a,b)=>b.crit-a.crit||b.dur-a.dur);
    h+='<div class="card" style="padding:6px 8px;overflow-x:auto"><table class="chk-tab" style="min-width:900px"><thead><tr><th>Motorista</th><th>Base</th><th>Dias</th><th>Serviços/dia</th><th>Jornada média</th><th>Efetivo médio</th><th>Dias 10h+</th><th>Dias sem almoço</th><th>Descanso &lt; 11h</th><th>Dias com MRG</th><th>Dias críticos</th></tr></thead><tbody>';
    for(const x of L) h+='<tr><td style="font-weight:700">'+esc(titulo(x.mot))+'</td><td>'+esc(x.base||"")+'</td><td>'+x.dias+'</td><td>'+x.serv.toFixed(1).replace(".",",")+'</td><td style="'+(x.dur>600?"color:#9a3412;font-weight:800":"")+'">'+chkDur(x.dur)+'</td><td>'+chkDur(x.ef)+'</td><td>'+(x.a10||"—")+'</td><td>'+(x.sa||"—")+'</td><td>'+(x.dc||"—")+'</td><td>'+(x.mrg||"—")+'</td><td style="'+(x.crit>=2?"color:#b42318;font-weight:800":"")+'">'+x.crit+(x.crit?" de "+x.dias:"")+'</td></tr>';
    h+='</tbody></table></div><button class="btn sec" style="margin-bottom:10px" onclick="chkBaixarJornadas()">Baixar jornadas do mês</button>'
      +'<p style="font-size:.76rem;color:var(--muted);line-height:1.5">Dia crítico = jornada acima de 10h, efetivo acima de 8h, sem almoço, sem pausa ou descanso menor que 11h. Jornada partida (apoio de Porto de manhã e fim de tarde) não conta como sobrecarga. Passeios não entram (não estão na prévia de transfer).</p>';
    return h;
  }
  function chkBaixarJornadas(){
    const D=(CHK.hist[CHK.mesHist]||{}).dias||[];
    const L=[["Dia","Motorista","Turno","Base","Serviços","Início","Fim","Jornada (h)","Efetivo (h)","Maior pausa (min)","Sem almoço","Descanso antes (h)","Encaixes apertados","Jornada partida","Alertas"]];
    for(const x of D) for(const j of (x.jornadas||[])) L.push([dataBR(x.data),titulo(j.mot),j.turno,j.base,j.servicos,j.ini,j.fim,(j.dur/60).toFixed(1).replace(".",","),(j.ef/60).toFixed(1).replace(".",","),j.pausa,j.semAlmoco?"sim":"",j.descanso!=null?(j.descanso/60).toFixed(1).replace(".",","):"",j.apertados,j.partida?"sim":"",(j.alertas||[]).join(", ")]);
    const csv="\ufeff"+L.map(l=>l.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";")).join("\n");

  async function chkApagarDia(data){
    if(!confirm("Apagar do histórico o dia "+dataBR(data)+"?")) return;
    try{ await chamarPrevia({acao:"apagar",data}); delete CHK.hist[data.slice(0,7)]; chkDesenharHist(); }
    catch(e){ alert("Não consegui apagar: "+e.message); }
  }
  async function chkCarregarHist(mes){
    if(CHK.carregandoHist===mes) return; CHK.carregandoHist=mes;
    try{ const j=await chamarPrevia({acao:"mes",mes}); CHK.hist[mes]={dias:j.dias||[]}; }
    catch(e){ CHK.hist[mes]={erro:"Não consegui carregar: "+e.message}; }
    CHK.carregandoHist=null; chkDesenharHist();
  }

  // ---- Comparador de escalas ----
  function hojeISO(){ const d=new Date(Date.now()-3*3600*1000); return d.toISOString().slice(0,10); }
  function renderComparador(m){
    m.innerHTML=`
      <div class="barra-busca">
        <input type="date" id="compData" value="${hojeISO()}" style="flex:0;">
        <button class="btn" id="btnConferir" onclick="rodarComparador()">🔄 Conferir agora</button>
        <span id="compInfo" style="font-size:.8rem;color:var(--muted);"></span>
      </div>
      <div id="compResultado"></div>`;
  }
  const TAGS_DIV = {
    HORARIO:{txt:"Horário",cls:"horario"}, APR_INI_FINAL:{txt:"Apr. ini ≠ final",cls:"horario"},
    CANCELADO:{txt:"Cancelado?",cls:""}, DISPENSADO:{txt:"Dispensou",cls:"horario"}, SO_NA_ORDEM:{txt:"Só na ordem",cls:""}, SO_NO_MAPA:{txt:"Só no Mapa",cls:""},
  };
  async function rodarComparador(){
    const data=document.getElementById("compData").value;
    const btn=document.getElementById("btnConferir");
    const info=document.getElementById("compInfo");
    const res=document.getElementById("compResultado");
    if(!data) return;
    btn.disabled=true; btn.textContent="Conferindo..."; info.textContent="Lendo o Phoenix, um momento..."; res.innerHTML="";
    try{
      const r=await fetch(API_COMPARAR,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data, token:USUARIO.token})});
      const j=await r.json();
      if(sessaoExpirou(j)) return;
      btn.disabled=false; btn.textContent="🔄 Conferir agora";
      if(!j.ok){ info.textContent=""; res.innerHTML='<div class="card" style="color:var(--alerta)">'+(j.erro||"Erro ao conferir.")+'</div>'; return; }
      const d=new Date(); info.textContent="Conferido às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      let html='<div class="cards-resumo">'
        +'<div class="resumo"><div class="num">'+j.escalados+'</div><div class="lbl">Escalados conferidos</div></div>'
        +'<div class="resumo ok"><div class="num">'+Math.max(0,j.escalados-j.comDivergencia)+'</div><div class="lbl">Sem divergência</div></div>'
        +'<div class="resumo alerta"><div class="num">'+j.comDivergencia+'</div><div class="lbl">Com divergência</div></div>'
        +'</div>';
      const motoristas=Object.keys(j.porMotorista).sort();
      if(motoristas.length===0){
        html+='<div class="em-breve"><div class="ic">✅</div><h3>Tudo batendo!</h3><p>Nenhuma divergência entre o Mapa de Serviço e a Ordem de Serviço neste dia (entre os serviços escalados).</p></div>';
      } else {
        html+='<h3 style="font-size:1rem;color:var(--tinta);margin:4px 0 12px;">Divergências por motorista</h3>';
        for(const mot of motoristas){
          const lista=j.porMotorista[mot];
          html+='<div class="mot-bloco"><div class="mot-cab">🚐 '+mot+' <span class="mot-count">'+lista.length+'</span></div>';
          for(let i=0;i<lista.length;i++){
            const dv=lista[i];
            const t=TAGS_DIV[dv.tipo]||{txt:dv.tipo,cls:""};
            const id="dv_"+mot.replace(/\W/g,"")+"_"+i;
            html+='<div class="div-item '+t.cls+'" id="'+id+'" onclick="toggleDetalhe(this)">'
              +'<span class="tag">'+t.txt+'</span>'
              +'<div class="corpo"><div class="rec">'+dv.rec+(dv.servico?" · "+dv.servico:"")+'</div>'
              +'<div class="det">'+dv.detalhe+'</div>'
              +(dv.obs && dv.tipo!=="DISPENSADO"?'<div class="det" style="margin-top:4px;color:var(--tinta);">📝 <b>Obs.:</b> '+esc(dv.obs)+'</div>':'')
              +'<div class="detalhe-extra">'
                +(dv.cliente?'<div><b>Cliente:</b> '+dv.cliente+'</div>':'')
                +(dv.guia?'<div><b>Guia:</b> '+dv.guia+'</div>':'')
                +(dv.extra?'<div><b>Info:</b> '+dv.extra+'</div>':'')
              +'</div></div>'
              +'<button class="btn-check" onclick="event.stopPropagation();marcarVerificado(this)" title="Marcar como verificado">✓</button>'
              +'</div>';
          }
          html+='</div>';
        }
      }
      res.innerHTML=html;
    }catch(e){
      btn.disabled=false; btn.textContent="🔄 Conferir agora"; info.textContent="";
      res.innerHTML='<div class="card" style="color:var(--alerta)">Erro de conexão. Tente de novo.</div>';
    }
  }

      +'<div style="display:flex;gap:8px"><input id="mnNovo" list="mnLista" placeholder="Nome do motorista (como no Phoenix)" style="flex:1;padding:8px 10px;border:1px solid var(--linha);border-radius:9px;font:inherit">'

  async function carregarEscala(forcar){
    const data=ESC.data, info=document.getElementById("escInfo"), box=document.getElementById("escConteudo");
    if(!box) return;
    // escala da noite: lê também o dia seguinte (madrugada)
    if(ESC.modo==="guias"&&ESC.turno==="noite"){
      const prox=somaDia(data,1);
      if(forcar||!ESC.cache[prox]){
        try{ const r=await fetch(API_ESCALA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:prox, token:USUARIO.token})});

      }

    if(!forcar && ESC.cache[data]){ desenharEscala(); return; }
    box.innerHTML='<div class="card" style="color:var(--muted)">Lendo a escala no Phoenix, um momento...</div>'; info.textContent="";

  function desenharEscala(){
    const box=document.getElementById("escConteudo"), info=document.getElementById("escInfo");

    let h='<div style="display:flex;justify-content:flex-end;margin:-6px 0 10px"><span class="chip" style="cursor:pointer" onclick="ESC.abertos={};ESC.todosAbertos=!ESC.todosAbertos;desenharEscala()">'+(ESC.todosAbertos?"Recolher todos":"Abrir todos")+'</span></div>';

  // ---- Planejamento dos passeios (carros por passeio + guia) ----
  const TIPOS_CARRO=["Bus","Micrão","Mini","Van","Carro"];

  const tipoCarro=(t)=>({"Ônibus":"Bus","Micro":"Mini"}[t]||t);
  const idiomaCarro=(c)=>c.idioma||(c.bilingue?"Bilíngue":"");

  // Lê a mensagem do WhatsApp que Porto já manda hoje, ex.:
  //  "Carneiros: 3 Bus + 1 Mini" · "City : 1 Bus + 1 Van (ESPANHOL)" · "Maragogi Extra: 4 Bus"
  //  "Maragogi PVT: 933679 - 13 PAX'S" · "São Jose HORÁRIO ESPECIAL: 1 Bus + 1 Mini"
  function lerMensagem(txt, saida){
    const TIPO={BUS:"Bus",ONIBUS:"Bus",MINI:"Mini",MICRO:"Mini",MICRAO:"Micrão",VAN:"Van",CARRO:"Carro",SUV:"Carro",SEDAN:"Carro"};
    const semAcento=(s)=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
    const idiomaDe=(s)=>{ s=semAcento(s); return /ESP/.test(s)?"Espanhol":/ING|ENG/.test(s)?"Inglês":/BIL/.test(s)?"Bilíngue":""; };
    const mapa={}, ordem=[], naoEntendi=[];
    const pegar=(nome,obs)=>{ const k=nome+"|"+obs; if(!mapa[k]){ mapa[k]={nome,obs,saida,carros:[]}; ordem.push(k); } return mapa[k]; };
    for(let linha of String(txt||"").split(/\r?\n/)){
      linha=linha.replace(/^\[[^\]]*\]\s*[^:]{1,40}:\s*/,"").replace(/[*_~]/g,"").replace(/\s+\d{1,2}:\d{2}\s*$/,"").trim();
      if(!linha) continue;
      const i=linha.indexOf(":"); if(i<1){ naoEntendi.push(linha); continue; }
      const cab=linha.slice(0,i).trim().toUpperCase(), cabS=semAcento(cab), resto=linha.slice(i+1).trim();
      const pvt=/\bPVT\b|PRIVATIV/.test(cabS);
      let obs=""; if(/\bEXTRA\b/.test(cabS)) obs="EXTRA"; if(/HORARIO\s+ESPECIAL/.test(cabS)) obs="HORÁRIO ESPECIAL";
      const nome=cab.replace(/\bPVT\b|PRIVATIV[OA]S?|\bEXTRA\b|HOR[ÁA]RIO\s+ESPECIAL/g," ").replace(/\s+/g," ").trim();
      if(!nome){ naoEntendi.push(linha); continue; }
      if(pvt){
        const res=(resto.match(/\d{4,8}(?:\.\d+)?/)||[])[0]||"";
        const pax=parseInt((resto.match(/(\d+)\s*pax/i)||[])[1],10)||0;
        pegar(nome,obs).carros.push({tipo:tipoPorPax(pax||10),idioma:idiomaDe(resto),privativo:{reserva:res,pax}});
        continue;
      }
      let achou=false;
      for(const parte of resto.split("+")){
        const m=parte.trim().match(/^(\d+)\s*([A-Za-zÀ-ú]+)\s*(?:\(([^)]*)\))?/);
        if(!m) continue;
        const tipo=TIPO[semAcento(m[2])];
        if(!tipo) continue;
        achou=true;
        for(let k=0;k<Math.min(30,+m[1]);k++) pegar(nome,obs).carros.push({tipo,idioma:idiomaDe(m[3]),privativo:null});
      }
      if(!achou) naoEntendi.push(linha);
    }
    return { passeios:ordem.map(k=>mapa[k]), naoEntendi };
  }

  // listinha do campo "guia": nomes como estão no Phoenix + os da lista de contatos
  function preencherGuias(){
    const d=document.getElementById("listaGuias"); if(!d) return;
    // base: nomes como estão no Phoenix. Da lista de contatos só entra quem não está lá —
    // e um nome curto ("FABIO") que é o começo de um nome do Phoenix ("FABIO GOMES") não entra,
    // para não aparecer o mesmo guia duas vezes.
    const phx=[...new Set((PLANO.catalogoGuias||[]).map(n=>String(n).trim().toUpperCase()).filter(Boolean))];
    const NP=phx.map(n=>normP(n));
    const extra=(ENV.contatos||[]).map(c=>String(c.nome||"").trim().toUpperCase()).filter(Boolean).filter(n=>{
      const k=normP(n); return !NP.some(p=>p===k||p.startsWith(k+" "));
    });
    // contato com nome completo ("FABIO GOMES") de um guia que no Phoenix está só com o primeiro
    // nome ("FABIO"): vira uma opção só, com o nome do Phoenix e o nome completo de legenda
    const legenda={}, fora=new Set();
    for(const n of extra){
      const k=normP(n); const base=phx.filter(p=>k.startsWith(normP(p)+" "));
      if(base.length===1){ const outros=extra.filter(x=>normP(x).startsWith(normP(base[0])+" ")); if(outros.length===1){ legenda[base[0]]=n; fora.add(n); } }
    }
    const nomes=[...new Set([...phx,...extra.filter(n=>!fora.has(n))])].sort();
    d.innerHTML=nomes.map(n=>'<option value="'+esc(n)+'"'+(legenda[n]?' label="'+esc(titulo(legenda[n]))+'"':'')+'>').join("");
  }
