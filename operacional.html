  // ======================= OPERACIONAL RECIFE: OBSERVAÇÕES ESPECIAIS =======================
  // Do dia: observações que o box não pode esquecer (criança/cadeirinha, cadeirante, idoso...), por tipo.
  // Relatório: observações digitadas de forma errada, por quem digitou, no período.
  const OBS={ aba:"dia", dia:null, cat:"todas", dados:{}, mes:null, rel:{}, busca:"" };
  // as observações com problema ficam fora da tela por enquanto (regras em ajuste); mude para true para voltar
  const OBS_MOSTRAR_ERROS=false;
  const OBS_COR={crianca:["#fde7d3","#8a3b0b"],mobilidade:["#dbe7fb","#1e3a8a"],idoso:["#ece3fb","#5b2a9c"],gestante:["#fbd9e3","#8a1538"],celebracao:["#fff1b8","#7a5600"],alergia:["#fde0dc","#9a2a1c"],bagagem:["#e8ecea","#3c4a46"],vip:["#dcefe9","#0b4f44"]};
  function renderObs(m){
    if(!OBS.dia) OBS.dia=consHoje();
    if(!OBS.mes) OBS.mes=OBS.dia.slice(0,7);
    if(!OBS_MOSTRAR_ERROS) OBS.aba="dia";
    cab(OBS_MOSTRAR_ERROS?"Lembretes para o box e observações digitadas com erro":"Lembretes para o box: reservas com observação especial","");
    m.innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'
      +'<span class="chip '+(OBS.aba==="dia"?"on":"")+'" onclick="OBS.aba=\'dia\';renderObs(document.getElementById(\'mainConteudo\'))">Do dia</span>'
      +(OBS_MOSTRAR_ERROS?'<span class="chip '+(OBS.aba==="rel"?"on":"")+'" onclick="OBS.aba=\'rel\';renderObs(document.getElementById(\'mainConteudo\'))">Relatório de observações erradas</span>':'')+'</div>'
      +(OBS.aba==="dia"
        ?'<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn sec mini" onclick="obsMudaDia(-1)">‹</button><input type="date" value="'+OBS.dia+'" onchange="OBS.dia=this.value;obsCarregar()" style="padding:8px 10px;border:1px solid var(--linha);border-radius:9px;font:inherit"><button class="btn sec mini" onclick="obsMudaDia(1)">›</button><button class="btn" onclick="obsCarregar(true)">Atualizar do Phoenix</button><span id="obsInfo" style="font-size:.8rem;color:var(--muted)"></span></div>'
        :'<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:.9rem">Mês</b><input type="month" value="'+OBS.mes+'" onchange="OBS.mes=this.value;obsCarregarRel()" style="padding:8px 10px;border:1px solid var(--linha);border-radius:9px;font:inherit"><button class="btn sec" onclick="delete OBS.rel[OBS.mes];obsCarregarRel()">Atualizar</button><span id="obsInfo" style="font-size:.8rem;color:var(--muted)"></span></div>')
      +'<div id="obsCorpo"></div>';
    if(OBS.aba==="dia") obsCarregar(); else obsCarregarRel();
  }
  function obsMudaDia(n){ const d=new Date(OBS.dia+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); OBS.dia=d.toISOString().slice(0,10); renderObs(document.getElementById("mainConteudo")); }
  async function obsCarregar(forcar){
    const dia=OBS.dia, box=document.getElementById("obsCorpo"); if(!box) return;
    if(OBS.dados[dia]&&!forcar){ obsDesenhar(); return; }
    box.innerHTML='<div class="card" style="color:var(--muted)">Lendo as observações das reservas no Phoenix... pode levar 1 a 2 minutos.</div>';
    try{ const j=await chamarConsulta("obsDia",{data:dia}); OBS.dados[dia]=j; OBS.cats=j.categorias; if(OBS.dia===dia) obsDesenhar(); }
    catch(e){ if(OBS.dia===dia) box.innerHTML='<div class="card" style="color:var(--alerta)">Não consegui ler: '+esc(e.message)+'</div>'; }
  }
  function obsLinha(x,extra){
    const hora=x.hApr&&x.hApr!=="00:00"?x.hApr:(x.hVoo||"");
    return '<div style="padding:10px 0;border-top:1px solid var(--linha)">'
      +'<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><b style="min-width:46px;color:var(--verde-esc)">'+esc(hora||"--:--")+'</b>'
      +'<b>'+esc(x.servico||"")+'</b><span style="font-size:.8rem;color:var(--muted)">'+esc(x.rec)+' · '+esc(x.cliente||"")+(x.pax?' · '+esc(x.pax):'')+(x.voo?' · voo '+esc(x.voo):'')+'</span></div>'
      +'<div style="font-size:.86rem;margin:4px 0 0 56px">“'+esc(x.obs)+'”</div>'
      +'<div style="font-size:.76rem;color:var(--muted);margin:3px 0 0 56px">'+[x.hotel,x.veiculo?("🚐 "+x.veiculo+(x.motorista?" · "+x.motorista:"")):"",x.guia?("🧭 "+x.guia):""].filter(Boolean).map(esc).join(" · ")+'</div>'
      +(extra||"")+'</div>';
  }
  function obsDesenhar(){
    const box=document.getElementById("obsCorpo"), info=document.getElementById("obsInfo"); const d=OBS.dados[OBS.dia]; if(!box||!d) return;
    if(info) info.textContent="lido às "+new Date(d.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    const cats=OBS.cats||d.categorias||[]; const nomeCat=(id)=>(cats.find(c=>c.id===id)||{}).nome||id;
    const cont={}; d.especiais.forEach(x=>x.cats.forEach(c=>cont[c]=(cont[c]||0)+1));
    let h='<div class="cards-resumo"><div class="resumo"><div class="num">'+d.especiais.length+'</div><div class="lbl">Serviços com observação especial</div></div>'
      +(OBS_MOSTRAR_ERROS?'<div class="resumo'+(d.erros.length?' alerta':'')+'"><div class="num">'+d.erros.length+'</div><div class="lbl">Observações com problema</div></div>':'')+'</div>';
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><span class="chip '+(OBS.cat==="todas"?"on":"")+'" onclick="OBS.cat=\'todas\';obsDesenhar()">Todas ('+d.especiais.length+')</span>'
      +cats.filter(c=>cont[c.id]).map(c=>'<span class="chip '+(OBS.cat===c.id?"on":"")+'" onclick="OBS.cat=\''+c.id+'\';obsDesenhar()">'+esc(c.nome)+' ('+cont[c.id]+')</span>').join("")+'</div>';
    const lista=d.especiais.filter(x=>OBS.cat==="todas"||x.cats.includes(OBS.cat)).slice().sort((a,b)=>String(a.hApr||a.hVoo||"99").localeCompare(String(b.hApr||b.hVoo||"99")));
    if(!lista.length) h+='<div class="card" style="color:var(--muted)">Nenhuma observação especial neste dia.</div>';
    else h+='<div class="card" style="padding:6px 18px 10px">'+lista.map(x=>obsLinha(x,'<div style="display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 0 56px">'+x.cats.map(c=>{ const k=OBS_COR[c]||["#eef1f0","#3c524d"]; return '<span style="font-size:.7rem;font-weight:800;background:'+k[0]+';color:'+k[1]+';border-radius:6px;padding:2px 7px">'+esc(nomeCat(c))+'</span>'; }).join("")+'</div>')).join("")+'</div>';
    if(OBS_MOSTRAR_ERROS&&d.erros.length){
      h+='<h3 style="font-size:1rem;margin:18px 0 8px">Observações digitadas com problema ('+d.erros.length+')</h3>';
      h+='<div class="card" style="padding:6px 18px 10px">'+d.erros.map(x=>obsLinha(x,'<div style="margin:6px 0 0 56px;font-size:.8rem"><b style="color:#8a4a0c">'+x.motivos.map(esc).join(" · ")+'</b><br><span style="color:var(--muted)">Digitado por: '+esc(x.criadoPor||x.quem||"não identificado")+'</span></div>')).join("")+'</div>';
    }
    box.innerHTML=h;
  }
  async function obsCarregarRel(){
    const mes=OBS.mes, box=document.getElementById("obsCorpo"); if(!box) return;
    if(OBS.rel[mes]){ obsDesenharRel(); return; }
    box.innerHTML='<div class="card" style="color:var(--muted)">Carregando o mês...</div>';
    const ult=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();
    try{ const j=await chamarConsulta("obsRelatorio",{ini:mes+"-01",fim:mes+"-"+String(ult).padStart(2,"0")}); OBS.rel[mes]=j; if(OBS.mes===mes) obsDesenharRel(); }
    catch(e){ box.innerHTML='<div class="card" style="color:var(--alerta)">Não consegui carregar: '+esc(e.message)+'</div>'; }
  }
  function obsDesenharRel(){
    const box=document.getElementById("obsCorpo"), info=document.getElementById("obsInfo"); const r=OBS.rel[OBS.mes]; if(!box||!r) return;
    if(info) info.textContent=r.dias+" dia(s) analisado(s) no mês";
    const quem=(e)=>e.criadoPor||e.quem||"Não identificado";
    const por={}; r.erros.forEach(e=>{ const k=quem(e); const x=por[k]=por[k]||{nome:k,total:0,motivos:{},itens:[]}; x.total++; x.itens.push(e); e.motivos.forEach(m=>{ const t=m.replace(/\s*\(.*\)\s*$/,""); x.motivos[t]=(x.motivos[t]||0)+1; }); });
    const lista=Object.values(por).sort((a,b)=>b.total-a.total);
    let h='<div class="cards-resumo"><div class="resumo'+(r.erros.length?' alerta':'')+'"><div class="num">'+r.erros.length+'</div><div class="lbl">Observações com problema no mês</div></div><div class="resumo"><div class="num">'+lista.length+'</div><div class="lbl">Pessoas / origens</div></div></div>';
    if(!lista.length) h+='<div class="card" style="color:var(--muted)">Nenhuma observação com problema registrada neste mês.</div>';
    else{
      h+='<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn sec mini" onclick="obsBaixarRel()">Baixar planilha</button></div>';
      h+=lista.map(x=>'<details class="card" style="padding:12px 18px"><summary style="cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b style="min-width:200px">'+esc(x.nome)+'</b><span style="font-size:.8rem;font-weight:800;color:#8a4a0c">'+x.total+' observação(ões)</span><span style="font-size:.76rem;color:var(--muted)">'+Object.entries(x.motivos).map(([m,n])=>esc(m)+": "+n).join(" · ")+'</span></summary>'
        +x.itens.map(e=>obsLinha(e,'<div style="margin:6px 0 0 56px;font-size:.8rem;color:#8a4a0c;font-weight:700">'+esc(dataBR(e.data).slice(0,5))+' · '+e.motivos.map(esc).join(" · ")+'</div>')).join("")+'</details>').join("");
    }
    box.innerHTML=h;
  }
  function obsBaixarRel(){
    const r=OBS.rel[OBS.mes]; if(!r) return;
    const L=[["Data","REC","Cliente","Serviço","Observação","Problema","Digitado por","Vendedor/Origem"]];
    r.erros.forEach(e=>L.push([dataBR(e.data),e.rec,e.cliente,e.servico,e.obs,e.motivos.join(" | "),e.criadoPor||"",e.quem||""]));
    const csv="\ufeff"+L.map(l=>l.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";")).join("\n");
    baixarArquivo("observacoes_erradas_"+OBS.mes+".csv",new Blob([csv],{type:"text/csv"}));
  }


  // ======================= APOIO AO BOX =======================
  // O Box cria os apoios do dia (quantos, início, Full/Half, idioma); a Central coloca o guia e avisa.
  // Com guia, o apoio entra sozinho no histórico e no pagamento do guia.
  const API_APOIOBOX="https://us-central1-operacional-luck.cloudfunctions.net/apoiobox";
  const ABX={ dia:null, apoios:[], valores:null, carregando:false };
  const ehCentral=()=>USUARIO.admin||(USUARIO.areas||[]).includes("central");
  const abxCentral=()=>!!ABX.naCentral&&ehCentral(); // guia e valor só na aba Solicitações da Central
  async function chamarApoioBox(acao,dados){
    const r=await fetch(API_APOIOBOX,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,data:ABX.dia,...dados})});
    const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro||"erro"); return j;
  }
  // ---- selos vermelhos do Apoio ao Box (hoje + 3 dias) ----
  // Central (Solicitações): apoios pedidos pelo Box ainda sem guia. Box (Apoio ao Box): apoios em que a Central já colocou o guia e o Box ainda não viu.
  const SELO={timer:null,apoios:[]};
  const seloVistos=()=>{ try{ return JSON.parse(localStorage.getItem("abxVistos")||"[]"); }catch(e){ return []; } };
  const seloChave=(a)=>a.data+"|"+a.id+"|"+normP(a.guia||"");
  function seloMostrar(id,n){ const e=document.getElementById("selo-"+id); if(e){ e.textContent=n; e.style.display=n?"inline-block":"none"; } }
  async function selosApoio(){
    const hj=consHoje(); const dias=[0,1,2,3].map(n=>{ const d=new Date(hj+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); });
    const todos=[];
    await Promise.all(dias.map(async d=>{ try{
      const r=await fetch(API_APOIOBOX,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao:"ler",token:USUARIO.token,data:d})});
      const j=await r.json(); if(j&&j.ok) todos.push(...(j.apoios||[]).map(a=>({...a,data:d}))); }catch(e){} }));
    SELO.apoios=todos;
    seloMostrar("cen-solic",todos.filter(a=>!a.guia).length);
    const vistos=seloVistos(); seloMostrar("box-apoio",todos.filter(a=>a.guia&&!vistos.includes(seloChave(a))).length);
  }
  // o Box abriu "Apoio ao Box": o que já tem guia passa a contar como visto
  function selosBoxVistos(){
    const ja=new Set(seloVistos()); SELO.apoios.filter(a=>a.guia).forEach(a=>ja.add(seloChave(a)));
    try{ localStorage.setItem("abxVistos",JSON.stringify([...ja].slice(-300))); }catch(e){}
    seloMostrar("box-apoio",0);
  }
  function renderApoioBox(m){
    ABX.naCentral=false;
    selosApoio().then(selosBoxVistos);
    if(!ABX.dia){ const d=new Date(consHoje()+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+1); ABX.dia=d.toISOString().slice(0,10); }
    cab("Peça aqui os apoios do dia; a Central coloca o guia","");
    const inp='style="height:42px;border:1px solid var(--linha);border-radius:10px;padding:0 10px;font:inherit"';
    m.innerHTML='<datalist id="listaGuias"></datalist>'
      +'<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn sec mini" onclick="abxDia(-1)">‹</button><input type="date" value="'+ABX.dia+'" onchange="ABX.dia=this.value;abxCarregar()" '+inp+'><button class="btn sec mini" onclick="abxDia(1)">›</button><span id="abxInfo" style="font-size:.8rem;color:var(--muted)"></span></div>'
      +'<div class="card"><b style="font-size:.95rem">＋ Novo apoio</b><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px">'
      +'<label style="display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)">Quantidade<input id="abxQtd" type="number" min="1" max="20" value="1" '+inp.replace('style="','style="width:90px;')+'></label>'
      +'<label style="display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)">Início<input id="abxIni" type="time" '+inp+'></label>'
      +'<div style="display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)">Período<div id="abxTipo">'+segmento([["full","Full day"],["half","Half day"]],ABX.tipo||"full","abxTipo('$v')")+'</div></div>'
      +'<label style="display:flex;gap:6px;align-items:center;font-size:.85rem;font-weight:700;height:42px"><input id="abxIdi" type="checkbox"> Com idioma</label>'
      +'<label style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)">Observação<input id="abxObs" placeholder="ex.: navio, voo atrasado..." '+inp+'></label>'
      +'<button class="btn" onclick="abxCriar()">Incluir</button></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:.82rem"><b style="color:var(--muted)">Repetir também em:</b><span id="abxMais">'+abxMaisHtml()+'</span>'
      +'<input id="abxMaisDia" type="date" '+inp+'><button class="btn sec mini" onclick="abxAddDia()">+ dia</button></div></div>'
      +'<div id="abxLista"></div>';
    abxCarregar();
    if(abxCentral()){ if(!PLANO.catalogoGuias) carregarCatalogo().catch(()=>{}); else preencherGuias(); if(typeof envCarregar==="function"&&!ENV.contatos) envCarregar(ABX.dia).then(()=>preencherGuias()).catch(()=>{}); }
  }
  function abxTipo(v){ ABX.tipo=v; const e=document.getElementById("abxTipo"); if(e) e.innerHTML=segmento([["full","Full day"],["half","Half day"]],v,"abxTipo('$v')"); }
  function abxDia(n){ const d=new Date(ABX.dia+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); ABX.dia=d.toISOString().slice(0,10); renderApoioBox(document.getElementById("mainConteudo")); }
  async function abxCarregar(){
    const box=document.getElementById("abxLista"); if(!box) return; const dia=ABX.dia;
    box.innerHTML='<div class="card" style="color:var(--muted)">Carregando...</div>';
    try{ const j=await chamarApoioBox("ler",{}); if(ABX.dia!==dia) return; ABX.apoios=j.apoios; ABX.valores=j.valores; abxDesenhar(); }
    catch(e){ box.innerHTML='<div class="card" style="color:var(--alerta)">'+esc(e.message)+'</div>'; }
  }
  const abxValor=(a)=>{ const v=(ABX.valores||{})[a.tipo]||{v:0,vi:0}; return a.idioma?v.vi:v.v; };
  function abxDesenhar(){
    const box=document.getElementById("abxLista"); if(!box) return; const A=ABX.apoios, cen=abxCentral();
    const sem=A.filter(a=>!a.guia).length, total=A.reduce((s,a)=>s+abxValor(a),0);

      +(cen?'<input class="plano-guia" list="listaGuias" value="'+esc(a.guia||"")+'" placeholder="Guia" style="height:40px;border:1px solid '+(a.guia?'var(--linha)':'#e5a07f')+';border-radius:10px;padding:0 10px;font:inherit;min-width:200px" onchange="abxGuia(\''+a.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()">'
           +(a.guia?'<button class="btn mini sec" title="Avisar '+esc(a.guia)+'" onclick="abxAvisar(\''+a.id+'\')">📲</button>'+(a.avisadoEm?'<span class="tag st-ok">✓ avisado</span>':''):'')
           +'<b style="min-width:70px;text-align:right">R$ '+abxValor(a)+'</b>'

  // dias a mais para repetir o mesmo pedido (ex.: sábado e domingo)
  function abxMaisHtml(){ return (ABX.mais||[]).slice().sort().map(d=>'<span class="chip on">'+esc(["dom","seg","ter","qua","qui","sex","sáb"][new Date(d+"T12:00:00").getDay()])+' '+esc(dataBR(d).slice(0,5))+' <a href="#" onclick="ABX.mais=ABX.mais.filter(x=>x!==\''+d+'\');document.getElementById(\'abxMais\').innerHTML=abxMaisHtml();return false">✕</a></span>').join(" "); }
  function abxAddDia(){ const e=document.getElementById("abxMaisDia"); const d=e&&e.value; if(!d) return; if(d===ABX.dia){ alert("Esse já é o dia escolhido no topo."); return; }
    ABX.mais=ABX.mais||[]; if(!ABX.mais.includes(d)) ABX.mais.push(d); document.getElementById("abxMais").innerHTML=abxMaisHtml(); }
  async function abxCriar(){
    const v=(id)=>document.getElementById(id); const ini=v("abxIni").value;
    if(!ini){ alert("Informe o horário de início."); return; }
    const corpo={quantidade:v("abxQtd").value,inicio:ini,tipo:ABX.tipo||"full",idioma:v("abxIdi").checked,obs:v("abxObs").value};
    const dias=[ABX.dia,...(ABX.mais||[])], erros=[];
    for(const d of dias){ try{ const j=await chamarApoioBox("criar",{...corpo,data:d}); if(d===ABX.dia) ABX.apoios=j.apoios; }catch(e){ erros.push(dataBR(d).slice(0,5)+": "+e.message); } }
    if(erros.length) alert("Alguns dias não foram salvos:\n"+erros.join("\n"));
    else if(dias.length>1) alert("Pedido incluído em "+dias.length+" dias: "+dias.map(d=>dataBR(d).slice(0,5)).join(", ")+".");
    selosApoio(); v("abxObs").value=""; v("abxQtd").value=1; ABX.mais=[]; const m=document.getElementById("abxMais"); if(m) m.innerHTML=""; abxDesenhar();

  // ======================= SOLICITAÇÕES (evento, famtour, navio) =======================
  // O setor Solicitações pede; a Central coloca o guia e o valor de cada vaga e avisa pelo WhatsApp.
  const API_SOL="https://us-central1-operacional-luck.cloudfunctions.net/solicitacoes";

  const SOL={ dia:null, pedidos:[], central:false, tipo:"evento", mais:[] };
  async function chamarSol(acao,dados){
    const r=await fetch(API_SOL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,data:SOL.dia,...dados})});
    const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro||"erro"); return j;
  }

      +'<details class="card" '+(cen?'':'open')+'><summary style="cursor:pointer;font-weight:800">＋ Novo pedido</summary><div style="margin-top:12px">'

      +lb("REC",'<input id="solRec" inputmode="numeric" placeholder="ex.: 981234" '+inp+'>')
      +lb("Contato no local",'<input id="solCont" placeholder="ex.: Ana, 81 99999-9999" '+inp+'>')
      +lb("Observação",'<input id="solObs" placeholder="ex.: traje social, levar placa" '+inp+'>',true)
      +'</div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:.82rem"><b style="color:var(--muted)">Repetir também em:</b><span id="solMais">'+solMaisHtml()+'</span><input id="solMaisDia" type="date" style="height:38px;border:1px solid var(--linha);border-radius:10px;padding:0 8px;font:inherit"><button class="btn sec mini" onclick="solAddDia()">+ dia</button></div>'
      +'<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" onclick="solCriar()">Enviar pedido</button></div></div></details>'

  function solTipo(v){ SOL.tipo=v; const e=document.getElementById("solTipo"); if(e) e.innerHTML=segmento(Object.entries(SOL_TIPOS),v,"solTipo('$v')"); }
  function solDia(n){ const d=new Date(SOL.dia+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); SOL.dia=d.toISOString().slice(0,10); renderSol(document.getElementById("mainConteudo")); }
  function solMaisHtml(){ return (SOL.mais||[]).slice().sort().map(d=>'<span class="chip on">'+esc(["dom","seg","ter","qua","qui","sex","sáb"][new Date(d+"T12:00:00").getDay()])+' '+esc(dataBR(d).slice(0,5))+' <a href="#" onclick="SOL.mais=SOL.mais.filter(x=>x!==\''+d+'\');document.getElementById(\'solMais\').innerHTML=solMaisHtml();return false">✕</a></span>').join(" "); }

  async function solCarregar(){
    const box=document.getElementById("solLista"); if(!box) return; const dia=SOL.dia;
    box.innerHTML='<div class="card" style="color:var(--muted)">Carregando...</div>';
    try{ const j=await chamarSol("ler",{}); if(SOL.dia!==dia) return; SOL.pedidos=j.pedidos; SOL.central=j.central; solDesenhar(); }
    catch(e){ box.innerHTML='<div class="card" style="color:var(--alerta)">'+esc(e.message)+'</div>'; }

  function solDesenhar(){
    const box=document.getElementById("solLista"); if(!box) return; const P=SOL.pedidos, cen=!!SOL.naCentral&&SOL.central;

      +'<div style="font-size:.84rem;color:var(--muted);margin-top:6px">'+[p.local?'📍 '+p.local:'',p.rec?'REC-'+p.rec:'',p.contato?'Contato: '+p.contato:'',p.obs?'📝 '+p.obs:''].filter(Boolean).map(esc).join(' · ')+'</div>'
      +'<div style="font-size:.74rem;color:var(--muted);margin-top:2px">Pedido por '+esc(p.criadoPor||"")+'</div>'
      +'<div style="margin-top:8px">'+p.vagas.map((v,k)=>'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--linha)"><span style="font-size:.8rem;font-weight:700;color:var(--muted);min-width:56px">Guia '+(k+1)+'</span>'
        +(cen?'<input list="listaGuias" value="'+esc(v.guia||"")+'" placeholder="Guia" style="height:40px;border:1px solid '+(v.guia?'var(--linha)':'#e5a07f')+';border-radius:10px;padding:0 10px;font:inherit;min-width:200px;flex:1;max-width:320px" onchange="solGuia(\''+p.id+'\',\''+v.id+'\',{guia:this.value})" onkeydown="if(event.key===\'Enter\')this.blur()">'
             +'<label style="display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700">R$ <input type="number" min="0" step="0.01" value="'+(v.valor!=null?esc(v.valor):'')+'" placeholder="valor" style="width:100px;height:40px;border:1px solid '+(v.guia&&v.valor==null?'#e5a07f':'var(--linha)')+';border-radius:10px;padding:0 8px;font:inherit" onchange="solGuia(\''+p.id+'\',\''+v.id+'\',{valor:this.value})"></label>'
             +(v.guia?'<button class="btn mini sec" title="Avisar '+esc(v.guia)+'" onclick="solAvisar(\''+p.id+'\',\''+v.id+'\')">📲</button>'+(v.avisadoEm?'<span class="tag st-ok">✓ avisado</span>':''):'')
           :'<span style="font-weight:700;color:'+(v.guia?'var(--tinta)':'#b45309')+'">'+(v.guia?esc(titulo(v.guia)):'aguardando guia')+'</span>')+'</div>').join("")+'</div></div>').join("");
    box.innerHTML=h;

  async function solCriar(){
    const v=(id)=>{ const e=document.getElementById(id); return e?e.value.trim():""; };
    if(!v("solDesc")){ alert("Descreva o pedido (ex.: nome do navio ou do evento)."); return; }
    if(!v("solIni")){ alert("Informe o horário de início."); return; }
    const corpo={tipo:SOL.tipo,descricao:v("solDesc"),inicio:v("solIni"),fim:v("solFim"),quantidade:v("solQtd"),idioma:v("solIdi"),local:v("solLocal"),rec:v("solRec"),contato:v("solCont"),obs:v("solObs")};
    const dias=[SOL.dia,...SOL.mais], erros=[];
    for(const d of dias){ try{ const j=await chamarSol("criar",{...corpo,data:d}); if(d===SOL.dia){ SOL.pedidos=j.pedidos; SOL.central=j.central; } }catch(e){ erros.push(dataBR(d).slice(0,5)+": "+e.message); } }
    if(erros.length) alert("Alguns dias não foram salvos:\n"+erros.join("\n"));
    else if(dias.length>1) alert("Pedido enviado para "+dias.length+" dias: "+dias.map(d=>dataBR(d).slice(0,5)).join(", ")+".");
    SOL.mais=[]; renderSol(document.getElementById("mainConteudo"));
  }
  async function solGuia(id,vaga,d){ try{ const j=await chamarSol("guia",{id,vaga,...d}); SOL.pedidos=j.pedidos; solDesenhar(); }catch(e){ alert(e.message); } }
  async function solVagas(id,n){ if(n<1) return; try{ const j=await chamarSol("vagas",{id,quantidade:n}); SOL.pedidos=j.pedidos; solDesenhar(); }catch(e){ alert(e.message); } }
  async function solRemover(id){ if(!confirm("Remover este pedido?")) return; try{ const j=await chamarSol("remover",{id}); SOL.pedidos=j.pedidos; solDesenhar(); }catch(e){ alert(e.message); } }
  function solMsg(p,v){
    const hj=consHoje(), am=(()=>{ const d=new Date(hj+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); })();
    const quando=SOL.dia===am?"Amanhã ("+dataBR(SOL.dia).slice(0,5)+")":SOL.dia===hj?"Hoje ("+dataBR(SOL.dia).slice(0,5)+")":"No dia "+dataBR(SOL.dia).slice(0,5);
    return '🧭 *'+(SOL_TIPOS[p.tipo]||"Serviço")+' – '+p.descricao+'*\n\nOi, '+titulo(v.guia).split(" ")[0]+'! '+quando+' você vai estar no *'+(SOL_TIPOS[p.tipo]||"serviço").toLowerCase()+' '+p.descricao+'*, '+(p.fim?'das *'+p.inicio+'* às *'+p.fim+'*':'às *'+p.inicio+'*')+'.'
      +(p.local?'\n📍 '+p.local:'')+(p.idioma?'\n🗣️ '+p.idioma:'')+(p.rec?'\n📋 REC-'+p.rec:'')+(p.contato?'\n👤 Contato: '+p.contato:'')+(p.obs?'\n📝 '+p.obs:'')+'\n\nQualquer dúvida, fale com a Central.';
  }
  function solAvisar(pid,vid){ const p=SOL.pedidos.find(x=>x.id===pid), v=p&&p.vagas.find(x=>x.id===vid); if(!v||!v.guia) return;
    abrirEnvio("passeio",SOL.dia,[{guia:v.guia,mensagem:solMsg(p,v)}],async()=>{ try{ const j=await chamarSol("avisado",{pares:[[pid,vid]]}); SOL.pedidos=j.pedidos; }catch(e){} solDesenhar(); }); }
  function solAvisarTodos(){ const L=[]; SOL.pedidos.forEach(p=>p.vagas.forEach(v=>{ if(v.guia) L.push([p,v]); })); if(!L.length){ alert("Nenhum guia colocado para avisar."); return; }
    abrirEnvio("passeio",SOL.dia,L.map(([p,v])=>({guia:v.guia,mensagem:solMsg(p,v)})),async()=>{ try{ const j=await chamarSol("avisado",{pares:L.map(([p,v])=>[p.id,v.id])}); SOL.pedidos=j.pedidos; }catch(e){} solDesenhar(); }); }


  // ======================= CENTRAL: SOLICITAÇÕES (Apoio ao Box + eventos, famtour, navio) =======================
  // Os setores pedem nas áreas deles; aqui a Central vê tudo do dia, coloca guia (e valor) e avisa.
  const CSL={ dia:null, faixa:{} };
  function renderCenSolic(m){
    if(!CSL.dia){ const d=new Date(consHoje()+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+1); CSL.dia=d.toISOString().slice(0,10); }

      +'<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn sec mini" onclick="cenSolDia(-1)">‹</button><input type="date" value="'+CSL.dia+'" onchange="cenSolIr(this.value)" style="height:42px;border:1px solid var(--linha);border-radius:10px;padding:0 10px;font:inherit"><button class="btn sec mini" onclick="cenSolDia(1)">›</button></div>'
      +'<div id="cslFaixa" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px"></div>'
      +'<h3 style="font-size:1rem;margin:4px 0 10px">Apoio ao Box</h3><div id="abxLista"></div>'
      +'<h3 style="font-size:1rem;margin:22px 0 10px">Eventos, famtour e navio</h3><div id="solLista"></div>';
    abxCarregar(); solCarregar(); cenSolPeriodo();

    if(typeof envCarregar==="function"&&!ENV.contatos) envCarregar(CSL.dia).then(()=>preencherGuias()).catch(()=>{});

  async function rmjMarcar(sel,i,rec){
    const v=sel.value; if(!v) return;

    sel.disabled=true;
    try{ const j=await chamarReman("marcar",{rec,cliente:r.cliente||"",pax:r.pax||"",ro,sk:s.sk||"",servico:(String(s.inicio||"").slice(0,5)+" "+(s.servico||"")).trim(),de:s.guia||"",para,motivo}); RMJ.d.recs=j.recs; rmjDesenhar(); }

  // robô do Phoenix (por enquanto só NO SHOW: observação + desalocar)

    return x.motivo==="no show"?'<button class="btn mini" style="background:#a3271a" onclick="rmjRoboEnviar(\''+k+'\')">🤖 Desalocar no Phoenix</button> ':'<button class="btn mini" style="background:#1f5fbf" onclick="rmjRoboEnviar(\''+k+'\')">🤖 Passar no Phoenix</button> ';

  // ================= VOOS E ATRASOS (Box): atraso informado à mão → conflitos e sugestão de guia/motorista livre =================
  const VOO={ data:null, d:null, folga:30, linha:"motorista" };
  // deslocamento aproximado entre as bases (min) — AJUSTAR com o Box
  const VOO_DESLOC={ "RE|PT":70, "RE|CB":40, "RE|MG":130, "PT|CB":35, "PT|MG":80, "CB|MG":110 };
  const VOO_ICAO={G3:"GLO",AD:"AZU",LA:"TAM",JJ:"TAM","2Z":"PTB",TP:"TAP",AR:"ARG",CM:"CMP",AA:"AAL",UA:"UAL",AF:"AFR",KL:"KLM",IB:"IBE",UX:"AEA",LH:"DLH"};
  function vooLink(v){ const m=String(v||"").toUpperCase().replace(/[\s-]/g,"").match(/^([A-Z0-9]{2})(\d{1,4})$/); return m&&VOO_ICAO[m[1]]?"https://flightaware.com/live/flight/"+VOO_ICAO[m[1]]+m[2]:"https://www.google.com/search?q=voo+"+encodeURIComponent(v||""); }
  const vMin=(h)=>{ const m=String(h||"").match(/(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null; };
  const vHora=(n)=>{ n=((n%1440)+1440)%1440; return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0"); };
  function vRegiao(s){ const S=String(s||"").toUpperCase();
    if(/MARAGOGI|MILAGRES|PATACHO/.test(S)) return "MG";
    if(/PORTO DE GALINHAS|\(PORTO\)|CARNEIROS|MURO ALTO|CUP[EÉ]|SERRAMBI|IPOJUCA|TAMANDAR|MARACA[IÍ]PE/.test(S)) return "PT";
    if(/\bCABO\b|GAIBU|CALHETAS|PAIVA|ITAPUAMA/.test(S)) return "CB";
    return "RE"; }
  function vDesloc(a,b){ if(!a||!b||a===b) return 0; return VOO_DESLOC[a+"|"+b]||VOO_DESLOC[b+"|"+a]||60; }
  const vNomeReg={RE:"Recife",PT:"Porto",CB:"Cabo",MG:"Maragogi"};
  // monta os serviços do dia com início/fim (já com atraso e trocas aplicados)
  function vServicos(){
    const D=VOO.d, at=D.atrasos||{}, tr=D.trocas||{};
    return (D.todos||[]).filter(s=>!/GARAGEM/i.test(s.servico)).map(s=>{
      const reg=vRegiao(s.servico), t=s.tipo;
      const ini=vMin(s.inicio), fim=vMin(s.fim);
      let a=ini==null?null:ini, f=fim!=null&&fim>=(a||0)?fim:(a!=null?a+90:null);
      const iniMot=vMin(s.aprPhoenix)!=null&&vMin(s.aprPhoenix)<=(a||9999)?vMin(s.aprPhoenix):a;
      const iniGuia=vMin(s.apresentacao)!=null&&vMin(s.apresentacao)<=(a||9999)?vMin(s.apresentacao):a;
      // atraso: voo do serviço com hora nova informada
      let delta=0, vooAt=null;
      for(const v of s.voos||[]){ const [cod,h]=v.split("|"); const x=at[String(cod).toUpperCase().replace(/\s+/g,"")]; if(x&&vMin(h)!=null){ const dd=vMin(x.hora)-vMin(h); if(Math.abs(dd)>Math.abs(delta)){ delta=dd; vooAt={voo:cod,previsto:h,hora:x.hora}; } } }
      const desloca=t==="IN"&&delta;
      const o={...s, reg, regIni:t==="IN"?"RE":reg, regFim:t==="OUT"?"RE":reg,
        a:a!=null&&desloca?a+delta:a, f:f!=null&&desloca?f+delta:f,
        aMot:iniMot!=null&&desloca?iniMot+delta:iniMot, aGuia:iniGuia!=null&&desloca?iniGuia+delta:iniGuia, delta:desloca?delta:0, vooAt,
        f0:f, aMot0:iniMot, aGuia0:iniGuia};
      const tm=tr["motorista_"+s.ro], tg=tr["guia_"+s.ro];
      if(tm) o.motorista=tm.para; if(tg) o.guia=tg.para;
      return o;

  const chgMin=(h)=>{ const m=String(h||"").match(/(\d{1,2}):(\d{2})/); if(!m) return null; const v=+m[1]*60+ +m[2]; return v<300?v+1440:v; };
  function chgAmanha(){ const d=new Date(consHoje()+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); }

  function chgLerVendasDia(wb){

  async function chgSubirVendasDia(wb,nome){

  // ---------- leitura dos arquivos ----------
  function chgArquivo(tipo,inp){
    const f=inp.files&&inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=async(e)=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:false});
        if(tipo==="previa"){ CHG.previaTour=chgLerTour(wb); CHG.previa=chgLerPrevia(wb); CHG.nomeP=f.name; CHG.modo=null; CHG.feitas={}; if(!CHG.previa.length) throw new Error("Não achei carros de IN nesse arquivo. É a Prévia de Escala (aba Dia)?"); }
        else if(tipo==="utopia"){ CHG.utopia=chgLerUtopia(wb); CHG.nomeU=f.name; if(!CHG.utopia.length) throw new Error("Não achei reservas nesse arquivo. É o relatório de oportunidade do Utopia (aba Reservas)?");
          const d=String(f.name).match(/(\d{4}-\d{2}-\d{2})/); if(d&&d[1]!==CHG.data){ CHG.data=d[1]; await chgCarregarDia(); } }
        else if(tipo==="vendasDia"){ await chgSubirVendasDia(wb,f.name); CHG.verRes=true; }
        else if(tipo==="vendas"){ const v=chgLerVendas(wb); if(!Object.keys(v).length) throw new Error("Não achei a aba Vendas por Vendedor nesse arquivo.");
          const p=String(f.name).match(/(\d{4})-(\d{2})-(\d{2})_a_(\d{4})-(\d{2})-(\d{2})/);
          await chgSalvarCfg({vend:v,vendAte:p?(p[3]+"/"+p[2]+" a "+p[6]+"/"+p[5]+"/"+p[4]):f.name}); }
        chgDesenhar();
      }catch(err){ alert(err.message); }
      inp.value="";
    };
    r.readAsArrayBuffer(f);
  }
  function chgLerPrevia(wb){
    const carros=[];
    wb.SheetNames.filter(n=>/^PREVIA ESCALA \(DIA\)/.test(chgHN(n))) /* só a aba Dia: a Noite é de outra escala */.forEach(sn=>{
      const L=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:""});
      const h=(L[0]||[]).map(chgHN), col=(n)=>h.indexOf(n);
      const cH=col("HORARIO IN"), cHot=col("HOTEL IN"), cV=col("VEICULO"), cM=col("MOTORISTA"), cG=col("GUIA"), cIN=col("IN"), cP=col("PAXS IN");
      if(cIN<0||cHot<0) return;
      L.slice(1).forEach((r,i)=>{
        const txt=String(r[cIN]||""); if(!/TRF IN/i.test(txt)) return;
        const voos=[...txt.matchAll(/\b([A-Z0-9]{2}) - (\d{3,4})\b/g)].map(x=>x[1]+"-"+x[2]);
        const dest=(txt.match(/TRF IN \(?([A-ZÀ-Ú]+)/i)||[])[1]||"";
        let pax=parseFloat(String(r[cP]).replace(",","."))||0;
        if(!pax) pax=[...txt.matchAll(/\|\s*(\d+)\s+[A-Z]/g)].reduce((s,x)=>s+(+x[1]),0);
        const g=String(r[cG]||"").trim();
        carros.push({id:sn.slice(-5,-1)+i, h:(String(r[cH]).match(/\d{1,2}:\d{2}/)||[""])[0].padStart(5,"0"), min:chgMin(r[cH]),
          hot:String(r[cHot]||""), hoteis:String(r[cHot]||"").split(" + ").map(s=>s.trim()).filter(Boolean),
          vei:String(r[cV]||"").trim(), mot:titulo(String(r[cM]||"").trim()), guia:g?normP(g):"", voos, dest:chgHN(dest), txt, pax, res:[]});
      });
    });
    // serviços juntados no mesmo carro (mesmo veículo, horários a até 30 min e mesmo guia) viram um carro só
    const juntos=[];
    carros.forEach(c=>{
      const j=c.vei&&juntos.find(x=>x.vei===c.vei&&x.min!=null&&c.min!=null&&Math.abs(x.min-c.min)<=30&&(!x.guia||!c.guia||x.guia===c.guia));
      if(!j){ juntos.push(c); return; }
      j.hoteis=[...j.hoteis,...c.hoteis.filter(h=>!j.hoteis.includes(h))]; j.hot=j.hoteis.join(" + ");
      j.voos=[...new Set([...j.voos,...c.voos])]; j.txt+="\n"+c.txt; j.pax+=c.pax; j.guia=j.guia||c.guia; j.mot=j.mot||c.mot;
      if(c.min<j.min){ j.min=c.min; j.h=c.h; } j.juntos=(j.juntos||1)+1;
    });
    return juntos;
  }
  function chgLerTour(wb){
    const out=[];
    wb.SheetNames.filter(n=>/^PREVIA ESCALA TOUR/.test(chgHN(n))).forEach(sn=>{
      const L=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:""}); const h=(L[0]||[]).map(chgHN), cG=h.indexOf("GUIA"), cP=h.indexOf("PASSEIOS | OUT");
      if(cG<0) return; L.slice(1).forEach(r=>{ const g=String(r[cG]||"").trim(); if(g) out.push({guia:normP(g),passeio:nomeServ(String(r[cP]||"").split("\n")[0].replace(/^Apoio \| /i,""))}); });
    });
    return out;
  }
  function chgLerUtopia(wb){
    const sn=wb.SheetNames.find(n=>chgHN(n)==="RESERVAS")||wb.SheetNames[0];
    const L=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});
    const h=(L[0]||[]).map(chgHN), col=(n)=>h.indexOf(n);
    const c={rec:col("RESERVA MAE"),id:col("IDIOMA"),nome:col("NOME DO PASSAGEIRO"),tel:col("TELEFONE"),hot:col("HOTEL"),voo:col("VOO IN"),pax:col("PAXS"),serv:col("QTD. SERVICOS"),livres:col("DIAS LIVRES"),serv2:col("SERVICO")};
    if(c.voo<0||c.hot<0) return [];
    return L.slice(1).filter(r=>r[c.voo]).map(r=>({rec:String(r[c.rec]||""), idioma:String(r[c.id]||"pt-br").toLowerCase(), nome:String(r[c.nome]||""), tel:String(r[c.tel]||""),
      hotel:String(r[c.hot]||""), voo:String(r[c.voo]).replace(/\s+/g,""), pax:+r[c.pax]||0, serv:+r[c.serv]||0, livres:+r[c.livres]||0, servico:String(r[c.serv2]||"")}));
  }
  function chgLerVendas(wb){
    const sn=wb.SheetNames.find(n=>chgHN(n)==="VENDAS POR VENDEDOR"); if(!sn) return {};
    const L=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});
    const h=(L[0]||[]).map(chgHN), cN=h.indexOf("VENDEDOR"), cV=h.indexOf("VENDAS (LIQUIDAS)"), cP=h.indexOf("PAXS IN INDIVIDUAL");
    const v={}; if(cN<0||cV<0||cP<0) return v;
    L.slice(1).forEach(r=>{ const p=+r[cP]||0, n=normP(r[cN]); if(n&&p>0) v[n]=[Math.round((+r[cV]||0)/p),Math.round(p)]; });
    return v;
  }

  // ---------- regras ----------
  function chgEhAI(hotel){ const h=chgHN(hotel); return (CHG.cfg.ai||[]).some(a=>a&&h.includes(chgHN(a))); }
  function chgRegiao(tel){
    let d=String(tel||"").replace(/\D/g,""); if(d.startsWith("55")&&d.length>=12) d=d.slice(2);
    if(d.length<10||/^(\d)\1+$/.test(d.slice(2))) return [1,"?"];
    const ddd=+d.slice(0,2);
    if(ddd>=11&&ddd<=19) return [3,"SP"];
    if(ddd===31) return [2,"BH"];
    if(ddd>=21&&ddd<=28) return [2,"RJ/ES"];
    if(ddd>=41&&ddd<=55) return [2,"Sul"];
    if(ddd>=32&&ddd<=38) return [0,"Int. MG"];
    return [1,"DDD "+ddd];
  }
  function chgNota(x){
    const ai=chgEhAI(x.hotel), hosp=ai?0:2, reg=chgRegiao(x.tel); // "Resort" no nome não conta: só os all inclusive da lista perdem ponto
    const liv=x.livres<=0?0:x.livres<=2?1:x.livres<=4?2:3, pas=x.serv===0?2:x.serv===1?1:0;
    const n=hosp+reg[0]+liv+pas;
    return {n, faixa:ai?"C":n>=9?"A":n>=7?"B":"C", ai, reg:reg[1]};
  }
  function chgAnalisar(){
    const P=CHG.previa||[], U=CHG.utopia||[]; let casadas=0, paxU=0, paxC=0;
    P.forEach(c=>{ c.res=[]; c.tok=c.tok||c.hoteis.map(chgTok); });
    U.forEach(x=>{
      paxU+=x.pax; const t=chgTok(x.hotel); if(!t.size) return;
      for(const c of P){
        if(!c.voos.includes(x.voo)) continue;
        if(c.tok.some(k=>{ let n=0; t.forEach(w=>{ if(k.has(w)) n++; }); return n/t.size>=0.6; })){ c.res.push({...x,...chgNota(x)}); casadas++; paxC+=x.pax; return; }
      }
    });
    P.forEach(c=>{
      const conh=c.res.reduce((s,x)=>s+x.pax,0);
      c.cob=c.pax?Math.min(1,conh/c.pax):0;
      c.aiPax=c.res.filter(x=>x.ai).reduce((s,x)=>s+x.pax,0);
      c.potBruto=c.res.filter(x=>x.faixa!=="C").reduce((s,x)=>s+x.pax*x.livres,0);
      c.aiFatia=conh?c.aiPax/conh:0;
      c.pot=Math.round(c.potBruto*(1-c.aiFatia/2));
      const lg={}; let est=0; c.res.forEach(x=>{ const l=x.idioma.slice(0,2); if(l&&l!=="pt"){ lg[l]=(lg[l]||0)+x.pax; est+=x.pax; } });
      c.lang=est>conh/2?Object.keys(lg).sort((a,b)=>lg[b]-lg[a])[0]:"";
      c.cls=!c.res.length?"-":c.pot>=CHG.cfg.corteA?"A":c.pot>=CHG.cfg.corteB?"B":"C";
    });
    return {casadas,total:U.length,paxU,paxC};
  }
  // o grupo da aba Transferistas é o que está nos passeios (Maragogi etc.); o outro grupo é o que faz os transfers
  const chgGrupoTransfer=()=>CHG.trf?(CHG.trf.grupo==="A"?"B":"A"):"";
  function chgTransfSemana(){ const t=CHG.trf; return t?((t.grupos||{})[chgGrupoTransfer()]||[]):[]; }
  // base do guia pelas listas da Disponibilidade: guia de Recife não faz serviço de Porto
  function chgBase(g){ const k=chgCanon(g), L=(n)=>((DSP_GRUPOS.find(x=>x[0]===n)||[])[1]||[]);
    if(L("Guias Porto").some(x=>chgCanon(x)===k)) return "PORTO"; if(L("Guias Recife").some(x=>chgCanon(x)===k)) return "RECIFE";
    if(L("Guias Porto").some(x=>chgBate(x,g))) return "PORTO"; if(L("Guias Recife").some(x=>chgBate(x,g))) return "RECIFE"; return ""; }
  const chgBaseOk=(g,car)=>!(car.dest==="PGA"&&chgBase(g)==="RECIFE");
  function chgTodosTransf(){ const t=CHG.trf; return t?[...((t.grupos||{}).A||[]),...((t.grupos||{}).B||[])]:[]; }
  function chgBusca(V,k){ if(V[k]) return V[k]; const ks=Object.keys(V).filter(x=>x.startsWith(k+" ")||k.startsWith(x+" ")); return ks.length===1?V[ks[0]]:null; }
  // R$ por pax: últimos 90 dias (relatórios diários) misturados com o ranking base; quanto mais pax recentes, mais pesa o recente
  function chgVend(g){ const k=chgCanon(g), b=chgBusca(CHG.cfg.vendC||{},k), v=chgBusca(CHG.vivo||{},k), K=300;
    if(!b&&!v) return null;
    if(!b) return v.p>0?[Math.round(v.v/v.p),Math.round(v.p)]:null;
    if(!v||!v.p) return b;
    return [Math.round((v.v+b[0]*K)/(v.p+K)), Math.round(b[1]+v.p)]; }
  const chgVendDet=(g)=>{ const k=chgCanon(g), b=chgBusca(CHG.cfg.vendC||{},k), v=chgBusca(CHG.vivo||{},k);
    return (v&&v.p?"90 dias: R$ "+Math.round(v.v/v.p)+"/pax ("+Math.round(v.p)+" pax)":"")+(b?(v&&v.p?" · ":"")+"base: R$ "+b[0]+"/pax":""); };
  function chgTier(g){
    if(!g) return "-";
    if(chgTransfSemana().some(n=>chgBate(n,g))) return "A";
    const v=chgVend(g); return v&&v[1]>=300&&v[0]>=CHG.cfg.corteVend?"B":"C";
  }
  function chgFala(g,lang){ return !lang||((CHG.cfg.idiomas||{})[lang]||[]).some(n=>chgBate(n,g)); }
  function chgFalaMais(g,lang){ return ((CHG.cfg.idiomas||{})[lang]||[]).some(n=>n.includes("~")&&chgBate(n,g)); }
  // guia já escalado em passeio no dia: pela aba Passeios (Central/Porto) ou pelas abas TOUR da prévia
  function chgEmPasseio(g){
    if(!g) return ""; const of=CHG.disp&&CHG.disp.of?CHG.disp.of:(x=>x), alvo=normP(of(g)), k=chgCanon(g);
    const fontes=[...Object.entries(CHG.passeioPlano||{}),...(CHG.previaTour||[]).map(x=>[x.guia,x.passeio])];
    for(const [n,p] of fontes){ if(normP(of(n))===alvo||chgCanon(n)===k) return p; }
    return "";

  // prévia preenchida: trocas de 2 em 2, cada guia mantém o nº de carros
  function chgTrocas(P){
    const R={A:0,B:1,C:2,"-":3}, gapMin=(+CHG.cfg.gap||5)*60;
    const cars=P.filter(c=>c.guia), at=new Map(cars.map(c=>[c,c.guia])), mexido=new Set(), tr=[];
    const gapOk=(g,car,sai)=>cars.every(o=>at.get(o)!==g||o===sai||o.min==null||car.min==null||Math.abs(o.min-car.min)>=gapMin);
    [...cars].filter(c=>c.cls==="A"||c.cls==="B").sort((a,b)=>b.pot-a.pot).forEach(c=>{
      if(mexido.has(c)) return;
      const g=at.get(c); if(R[chgTier(g)]<=R[c.cls]) return;
      if(c.lang&&chgFala(g,c.lang)) return; // voo estrangeiro já com guia que fala a língua
      const cand=cars.filter(o=>{ if(o===c||mexido.has(o)||o.cls==="-") return false; const g2=at.get(o);
        if(g2===g||R[chgTier(g2)]>=R[chgTier(g)]||R[o.cls]<=R[c.cls]) return false;
        if(!chgFala(g2,c.lang)||!chgFala(g,o.lang)||!chgBaseOk(g2,c)||!chgBaseOk(g,o)) return false;
        if(chgIndisp(g2)||chgEmPasseio(g2)) return false;
        return gapOk(g2,c,o)&&gapOk(g,o,c); });

      const g2=at.get(o); at.set(c,g2); at.set(o,g); mexido.add(c); mexido.add(o);

    const sug=new Map();
    P.filter(c=>c.cls==="A"||c.cls==="B").sort((a,b)=>(a.cls<b.cls?-1:a.cls>b.cls?1:0)||b.pot-a.pot).forEach(c=>{

  async function pilotoValores(){
    const f=document.getElementById("pilPgg").files[0]; if(!f){ alert("Selecione a PGG."); return; }
    await libsPagamentos(); let pgg; try{ pgg=await lerPGG(f,PIL.qid); }catch(e){ alert(e.message); return; } const valores={}; const fora=[], duplos=[], somar=[];
    for(const g of (PIL.dados?PIL.dados.guias:[])){
      let c=pgg.rows.filter(r=>normP(r.nome)===normP(g.nome)); if(!c.length) c=pgg.rows.filter(r=>nomeBate(r.nome,g.nome)||nomeBate(g.nome,r.nome));
      const comValor=c.filter(r=>(r.com||0)>0||(r.serv||0)>0||(r.liq||0)>0); if(comValor.length) c=comValor;
      if(!c.length){ fora.push(g); continue; }
      if(c.length>1&&new Set(c.map(r=>normP(r.nome))).size===1){ somar.push({g,c}); continue; } // mesmo nome em várias linhas: soma (com confirmação)
      if(c.length>1){ duplos.push(g.nome+" ("+c.map(r=>r.nome).join(" / ")+")"); continue; }
      const r=c[0]; valores[g.gid]={serv:r.serv||0,com:r.com||0,reemb:r.reemb||0,maq:r.maq||0,liq:r.liq||0,nomePgg:r.nome};
    }
    if(somar.length){
      const sm=(c,k)=>Math.round(c.reduce((t,r)=>t+(r[k]||0),0)*100)/100;
      const txt=somar.map(({g,c})=>g.nome+" ("+c.length+" linhas): comissão "+c.map(r=>brlP(r.com||0)).join(" + ")+" = "+brlP(sm(c,"com"))+(sm(c,"reemb")?" · reembolso "+brlP(sm(c,"reemb")):"")+(sm(c,"maq")?" · maquineta "+brlP(sm(c,"maq")):"")).join("\n");
      if(confirm("Estes guias aparecem em mais de uma linha da PGG, com o mesmo nome:\n\n"+txt+"\n\nOK = somar as linhas de cada um.\nCancelar = deixar sem valor para conferir a planilha."))
        somar.forEach(({g,c})=>{ valores[g.gid]={serv:sm(c,"serv"),com:sm(c,"com"),reemb:sm(c,"reemb"),maq:sm(c,"maq"),liq:sm(c,"liq"),nomePgg:c[0].nome+" ("+c.length+" linhas somadas)"}; });
      else somar.forEach(({g})=>duplos.push(g.nome));
    }
    // quem não está na PGG normalmente não vendeu: entra sem comissão, reembolso e maquineta (a Central confirma)
    if(fora.length&&confirm("Estes guias não estão na PGG:\n\n"+fora.map(g=>g.nome).join(", ")+"\n\nSe é porque não tiveram vendas, clique OK para lançar SEM comissão (R$ 0,00). O valor da nota deles fica só com os serviços.\n\nCancelar = deixar sem valor (confira se o nome não está diferente na PGG)."))
      fora.forEach(g=>{ valores[g.gid]={serv:0,com:0,reemb:0,maq:0,liq:0,nomePgg:"(fora da PGG · sem comissão)"}; });
    // só manda quem mudou; quem já enviou nota e teria o valor alterado precisa de confirmação
    const porGid=Object.fromEntries((PIL.dados?PIL.dados.guias:[]).map(g=>[g.gid,g]));
    const igual=(a,b)=>Math.abs((a||0)-(b||0))<0.01;
    const mudou=(g,v)=>{ const a=g.valores; return !a||!igual(a.com,v.com)||!igual(a.reemb,v.reemb)||!igual(a.maq,v.maq); };
    for(const gid of Object.keys(valores)) if(porGid[gid]&&!mudou(porGid[gid],valores[gid])) delete valores[gid];
    const comNota=Object.keys(valores).filter(gid=>porGid[gid]&&porGid[gid].nota);
    if(comNota.length){
      const txt=comNota.map(gid=>{ const g=porGid[gid], a=g.valores||{}, v=valores[gid]; return g.nome+": comissão "+brlP(a.com||0)+" → "+brlP(v.com||0)+(igual(a.reemb,v.reemb)?"":" · reembolso "+brlP(a.reemb||0)+" → "+brlP(v.reemb||0))+(igual(a.maq,v.maq)?"":" · maquineta "+brlP(a.maq||0)+" → "+brlP(v.maq||0)); }).join("\n");
      if(!confirm("Estes guias JÁ ENVIARAM A NOTA e o valor deles mudaria com esta PGG:\n\n"+txt+"\n\nOK = atualizar mesmo assim (eles vão precisar emitir a nota de novo).\nCancelar = manter o valor deles como está e atualizar só os outros."))
        comNota.forEach(gid=>delete valores[gid]);
    }
    if(!Object.keys(valores).length){ alert("Nenhum valor mudou em relação ao que já estava lançado. Nada foi alterado."); return; }
    const j=await chamarPiloto("valores",{valores}); if(!j.ok){ alert(j.erro); return; }
    alert("Valores atualizados para "+Object.keys(valores).length+" guia(s): "+Object.keys(valores).map(gid=>porGid[gid]?porGid[gid].nome:gid).join(", ")+".");
    if(duplos.length) alert("Achei mais de um nome na PGG para: "+duplos.join(", ")+". Confira a planilha.");
    // resumo: aba usada, total da PGG × total lançado e quem tem comissão na PGG mas não tem serviço no mapa
    const usados=new Set(Object.values(valores).map(v=>normP(String(v.nomePgg||"").replace(/\s*\(.*$/,""))));
    const lancado=Object.values(valores).reduce((t,v)=>t+(v.com||0),0);
    const sobra=pgg.rows.filter(r=>(r.com||0)>0&&!usados.has(normP(r.nome)));
    alert("PGG lida da aba \""+pgg.aba+"\".\n\nTotal de comissão na PGG: "+(pgg.totalCom!=null?brlP(pgg.totalCom):"(sem linha TOTAL)")+"\nLançado para os guias: "+brlP(lancado)
      +(sobra.length?"\n\nNa PGG com comissão, mas sem serviço no mapa desta quinzena:\n"+sobra.map(r=>r.nome+" · "+brlP(r.com)).join("\n"):""));
    atualizarPiloto();
  }

  // atualizar o mapa de um guia: não deixa rodar duas vezes e não trava a tela se o servidor demorar ou falhar
  let ATUALIZANDO_GUIA=false;
  async function atualizarMapaGuia(g,dias){
    if(ATUALIZANDO_GUIA){ alert("Já estou atualizando um mapa. Espere terminar."); return {ok:false,erro:"ocupado",silencio:true}; }
    ATUALIZANDO_GUIA=true; const info=document.getElementById("pilPhxInfo");

    // espera no máximo 3 minutos; depois disso libera a tela (o servidor pode terminar sozinho)
    const limite=new Promise((_,erro)=>setTimeout(()=>erro(new Error("tempo")),180000));
    try{ return await Promise.race([chamarPiloto("atualizarGuia",{gid:g.gid,...(dias?{dias}:{})}),limite]); }
    catch(e){ return {ok:false,erro:"o servidor demorou mais de 3 minutos ou caiu. Recarregue a página em 1 minuto e confira o mapa: às vezes a atualização termina mesmo assim."}; }
    finally{ ATUALIZANDO_GUIA=false; if(info) info.textContent=""; }
  }

  // ======================= MAPA PELO PHOENIX (sem o Utopia) =======================
  // Lê as escalas do Phoenix no período, aplica o tarifário dos guias e as regras combinadas:
  // idioma quando o guia informou a REC de idioma no relatório; motoguia 262 (idioma 300) uma vez
  // por turno (dia e noite); apoio de manhã paga 1 (2 com Maragogi + outro passeio); apoio da tarde (VOLTA) paga 1;
  // passeio privativo tem o mesmo valor do regular.
  const MOTOGUIA=262, MOTOGUIA_IDIOMA=300, APOIO=40;
  async function salvarTarifario(){
    const f=document.getElementById("pilTarif").files[0]; if(!f){ alert("Selecione a planilha do tarifário."); return; }
    await libsPagamentos(); const wb=XLSX.read(await f.arrayBuffer());
    const aba=wb.SheetNames.find(n=>/^tarif[aá]rio guias$/i.test(n.trim())); if(!aba){ alert('Não achei a aba "Tarifário Guias".'); return; }
    const servicos={};
    for(const r of XLSX.utils.sheet_to_json(wb.Sheets[aba],{header:1,raw:true}).slice(1)){
      const nome=normP(r[0]); if(!nome) continue;
      const v=typeof r[1]==="number"?r[1]:null, vi=typeof r[2]==="number"?r[2]:v;
      if(v!=null) servicos[nome]={v,vi};
    }
    const j=await chamarPiloto("tarifario",{dados:{servicos,qtd:Object.keys(servicos).length,arquivo:f.name}});
    if(!j.ok){ alert(j.erro); return; }
    PIL.tarifario={servicos}; alert("Tarifário salvo: "+Object.keys(servicos).length+" serviços.");
  }
  function tarifaDe(servico,idioma){
    const t=(PIL.tarifario||{}).servicos||{}; const n=normP(servico);
    const x=t[n]||t[n.replace(/ - NOVOTEL MARINA$/,"")];
    return x?(idioma?x.vi:x.v):null;
  }
  // nome do passeio sem buggy, sem o "(Boa Viagem | Piedade)", sem "Praias do" e com STO = SANTO, para achar o mesmo passeio
  // vale para qualquer saída: Boa Viagem/Piedade e Porto de Galinhas (cada saída é comparada com ela mesma)
  function chavePasseio(s){
    s=String(s||""); const saida=/PORTO/i.test((s.match(/\(.*?\)/g)||[]).join(" "))?"PORTO":"RECIFE";
    return normP(s.replace(/\(.*?\)/g," ")).replace(/\bCOM BUGGY( INCLUSO)?\b/g," ").replace(/\bBUGGY\b/g," ")
      .replace(/^PRAIAS? (DO|DA|DOS|DAS|DE) /,"").replace(/\bSTO\b/g,"SANTO").replace(/\bSTA\b/g,"SANTA").replace(/\s+/g," ").trim()+"|"+saida;
  }
  function montarMapaPhoenix(linhas,nomes,relatorios){
    const porGuiaDia={};
    for(const r of relatorios){ const k=normP(r.guia)+"|"+r.data; (porGuiaDia[k]=porGuiaDia[k]||[]).push(...r.itens.map(i=>({...i}))); }
    const nomesRel=[...new Set(relatorios.map(r=>normP(r.guia)))];
    return nomes.map(nome=>{
      const N=normP(nome);
      const chaveRel=nomesRel.includes(N)?N:(nomesRel.find(x=>nomeBate(nome,x)||nomeBate(x,nome))||N);
      const minhas=linhas.filter(l=>normP(l.guia)===N||(normP(l.guia)&&nomeBate(nome,l.guia)&&nomeBate(l.guia,nome)));
      const out=[];
      for(const d of [...new Set(minhas.map(l=>l.data))].sort()){
        const L=minhas.filter(l=>l.data===d).sort((a,b)=>String(a.apresentacao||a.inicio).localeCompare(String(b.apresentacao||b.inicio)));
        const itens=porGuiaDia[chaveRel+"|"+d]||[];
        const usaIdioma=(cat)=>{ const i=itens.find(x=>!x._usado&&x.recIdioma&&String(catRel(x.servico)).startsWith(cat)); if(i){ i._usado=true; return i.recIdioma; } return ""; };
        const ehMoto=(l)=>normP(l.motorista)&&(normP(l.motorista)===N||nomeBate(nome,l.motorista));
        const motoIdioma=L.some(ehMoto)&&itens.some(i=>i.recIdioma);
        // motoguia: 1 tarifa por turno (Dia e Noite), independente de quantos serviços fez; Noite = 18h em diante + madrugada
        const turnoMoto=(l)=>{ const h=String(l.apresentacao||l.inicio||"").slice(0,5); return (h&&(h>="18:00"||h<"06:00"))?"noite":"dia"; };
        const motoPagos={}; const idas=[], voltas=[];
        for(const l of L){
          const ap=l.auxiliar||/APOIO/i.test(l.servico);
          const cat=ap?(/VOLTA/i.test(l.servico)?"apoio-volta":"apoio-ida"):catMapa(l.servico);
          const linha={data:d,hora:String(l.apresentacao||l.inicio||"").slice(0,5),ro:l.escala,servico:l.auxiliar?("APOIO · "+l.servico):l.servico,veiculo:l.veiculo,motorista:l.motorista,valor:0,obs:""};
          if(ehMoto(l)){ const t=turnoMoto(l); linha.valor=motoPagos[t]?0:(motoIdioma?MOTOGUIA_IDIOMA:MOTOGUIA); linha.obs=motoPagos[t]?"motoguia (já pago no turno "+t+")":"motoguia "+t+(motoIdioma?" com idioma":""); motoPagos[t]=true; }
          else if(ap){ linha.valor=APOIO; (cat==="apoio-volta"?voltas:idas).push({linha,passeio:String(l.servico).toUpperCase()}); }
          else {
            const rec=cat==="passeio"?usaIdioma("passeio"):usaIdioma(cat==="chegada"?"chegada":cat==="saida"?"saida":"trf");
            const v=tarifaDe(l.servico,!!rec);
            if(v==null){ linha.valor=0; linha.obs="sem tarifa no tarifário: conferir"; } else { linha.valor=v; if(rec) linha.obs="idioma · REC "+rec; }
          }
          out.push(linha);
        }
        const mar=idas.some(a=>/MARAGOGI/.test(a.passeio)), outros=idas.some(a=>!/MARAGOGI/.test(a.passeio));
        const pagos=idas.length?((mar&&outros)?2:1):0;
        idas.slice(pagos).forEach(a=>{ a.linha.valor=0; a.linha.obs="apoio além do permitido no dia"; });
        voltas.slice(1).forEach(a=>{ a.linha.valor=0; a.linha.obs="apoio de volta já pago no dia"; });
        // mesmo passeio no mesmo dia, um com buggy e outro sem (ex.: Cabo de Santo Agostinho): paga só 1
        const grupos={};
        out.filter(x=>x.data===d&&x.valor>0&&!/^APOIO/.test(x.servico)&&!/^motoguia/.test(x.obs)&&catMapa(x.servico)==="passeio")
          .forEach(x=>{ const k=chavePasseio(x.servico); (grupos[k]=grupos[k]||[]).push(x); });
        for(const g of Object.values(grupos)){
          const comB=g.filter(x=>/BUGGY/i.test(x.servico)), semB=g.filter(x=>!/BUGGY/i.test(x.servico));
          if(!comB.length||!semB.length) continue;
          const pago=g.reduce((m,x)=>x.valor>m.valor?x:m,g[0]);
          g.forEach(x=>{ if(x!==pago){ x.valor=0; x.obs="mesmo passeio com/sem buggy: pago 1 vez"; } });
        }
      }
      return {nome,linhas:out,total:out.reduce((s,l)=>s+l.valor,0)};
    });
  }
  async function pilotoGerarPhoenix(){
    const nomes=document.getElementById("pilNomes").value.split(",").map(s=>s.trim()).filter(Boolean);
    const [ini,fim]=PIL.qid.split("_"); const info=document.getElementById("pilPhxInfo");
    try{
      if(!PIL.tarifario){ const t=await chamarPiloto("tarifario",{}); if(t.ok&&t.tarifario) PIL.tarifario=t.tarifario; }
      if(!PIL.tarifario){ alert("Salve o tarifário primeiro."); return; }
      const chamarC=async(acao)=>{ const r=await fetch(API_CONFERENCIA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,inicio:ini,fim})}); const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro); return j; };
      info.textContent="Lendo as escalas do Phoenix de "+dataBR(ini)+" a "+dataBR(fim)+" (pode levar até 2 minutos na primeira vez)...";
      const linhas=(await chamarC("linhas")).linhas;
      let rel=[]; try{ info.textContent="Lendo os relatórios dos guias (para o idioma)..."; rel=(await chamarC("relatorios")).relatorios; }catch(e){ console.log("sem relatórios:",e.message); }
      const mapas=montarMapaPhoenix(linhas,nomes,rel);

  async function carregarDisp(){

      const sl=await chamarSol("periodo",{ini:somaDias(hojeISO(),-60),fim:somaDias(DSP.data,30)}).catch(()=>null);

  // situação de um guia num dia: registros internos > bloqueios do painel > o que o guia marcou no app
  const oficialDe=(n)=>DSP.ofic?DSP.ofic(n):String(n||"").trim().toUpperCase();
  // nome oficial de um guia: o do contato, pelos apelidos ("também aparece como") e, para nome de 2 palavras ou mais
  // que não é contato, o único contato que começa por ele ("LUIZ FELIPE" = "LUIZ FELIPE DA SILVA SANTOS"),
  // desde que esse contato não seja outro nome das listas ("BRUNO" não vira "BRUNO MICHELOTI")
  function montarOficial(contatos){
    const m={}, nomes=[], cache=new Map();
    contatos.forEach(x=>{ const o=String(x.nome||"").toUpperCase(); m[normP(x.nome)]=o; nomes.push(normP(x.nome)); (x.apelidos||[]).forEach(a=>{ m[normP(a)]=o; }); });
    const dasListas=new Set(DSP_GRUPOS.flatMap(g=>g[1]).map(normP));
    return (n)=>{ const k=normP(n); if(cache.has(k)) return cache.get(k);
      let r=m[k];
      if(!r&&k.split(" ").length>=2){ const c=nomes.filter(x=>x.startsWith(k+" ")&&!dasListas.has(x)); if(c.length===1) r=m[c[0]]; }
      r=r||String(n||"").trim().toUpperCase(); cache.set(k,r); return r; };
  }
  function situacaoDisp(guia,dia){
    const r=situacaoBase(guia,dia);
    if(r.s==="p"||r.s==="b"){ const G=normP(oficialDe(guia)); const ds=(DSP.dados.disp||[]).find(x=>x.data===dia&&normP(oficialDe(x.guia))===G);
      if(ds&&(ds.status==="nao"||ds.status==="restricao")) r.conf={tipo:ds.status==="nao"?"Indisponível":"Restrição",obs:ds.obs||"",em:ds.em}; }
    return r;
  }
  function situacaoBase(guia,dia){
    const G=normP(oficialDe(guia)), cobre=(x)=>x.inicio<=dia&&dia<=x.fim&&normP(oficialDe(x.guia))===G;
    const nc=DSP.internos.find(x=>x.tipo==="naoConvidar"&&cobre(x)); if(nc) return {s:"n",det:"Não convidar até "+dataBR(nc.fim).slice(0,5)+(nc.motivo?" · "+nc.motivo:""),x:nc};
    const sv=DSP.internos.find(x=>x.tipo==="servico"&&cobre(x)); if(sv) return {s:"b",det:(sv.descricao||"Serviço")+(sv.rec?" · REC-"+sv.rec:"")+(sv.horario?" · "+sv.horario:""),x:sv};
    const ab=(DSP.abx||[]).find(x=>x.data===dia&&normP(oficialDe(x.guia))===G);
    if(ab) return {s:"b",det:ab.rotulo||("Apoio ao Box "+ab.inicio+" ("+(ab.tipo==="half"?"Half":"Full")+")")};
    const pa=(DSP.passeios||{})[dia+"|"+G]; if(pa) return {s:"p",det:pa};
    const bl=(DSP.dados.bloqueios||[]).find(cobre); if(bl) return bl.tipo==="passeio"?{s:"p",det:"Escalado em passeio"+(bl.motivo?": "+bl.motivo:"")}:{s:"b",det:"Bloqueio do painel"+(bl.motivo?": "+bl.motivo:"")};
    const ds=(DSP.dados.disp||[]).find(x=>x.data===dia&&normP(oficialDe(x.guia))===G);
    if(ds&&ds.status==="nao") return {s:"i",det:ds.obs||"Indisponível",em:ds.em};
    if(ds&&(ds.status==="restricao"||ds.status==="passeio")) return {s:"r",det:ds.obs||(ds.status==="passeio"?"Só passeio":"Com restrição"),em:ds.em};
    return {s:"d",det:"Disponível o dia todo"};

  // última escala (até hoje) e próxima, juntando os nomes/apelidos do mesmo guia
  function ultimaDe(nome){
    if(!DSP.ultOficial){ DSP.ultOficial={}; for(const [k,v] of Object.entries((DSP.dados&&DSP.dados.ultimas)||{})){ const o=normP(oficialDe(k)), x=DSP.ultOficial[o]=DSP.ultOficial[o]||{};
      if(v.ultima&&(!x.ultima||v.ultima>x.ultima)) x.ultima=v.ultima; if(v.proxima&&(!x.proxima||v.proxima<x.proxima)) x.proxima=v.proxima; }
      const hj=hojeISO();
      for(const a of (DSP.abx||[])){ const o=normP(oficialDe(a.guia)), x=DSP.ultOficial[o]=DSP.ultOficial[o]||{};
        if(a.data<=hj){ if(!x.ultima||a.data>x.ultima) x.ultima=a.data; } else if(!x.proxima||a.data<x.proxima) x.proxima=a.data; }
      // carros montados na aba Passeios
      for(const k of Object.keys(DSP.passeios||{})){ const [dd,o]=k.split("|"), x=DSP.ultOficial[o]=DSP.ultOficial[o]||{};
        if(dd<=hj){ if(!x.ultima||dd>x.ultima) x.ultima=dd; } else if(!x.proxima||dd<x.proxima) x.proxima=dd; } }
    return DSP.ultOficial[normP(oficialDe(nome))]||{};

  function dspFecharForm(){ DSP.editId=null; DSP.form=null; DSP.fGuias=[]; DSP.fDias=[]; DSP.fv={}; desenharDisp(); }
  function dspAddGuia(){ const e=document.getElementById("dfGuia"); const v=e?e.value.trim():""; if(!v) return;
    if(!DSP.fGuias.some(g=>g.toUpperCase()===v.toUpperCase())) DSP.fGuias.push(v); desenharDisp(); setTimeout(()=>{ const n=document.getElementById("dfGuia"); if(n) n.focus(); },0); }
  function dspAddDia(){ const e=document.getElementById("dfDia"); const v=e?e.value:""; if(!v) return; if(!DSP.fDias.includes(v)) DSP.fDias.push(v); desenharDisp(); }
  // dias separados viram blocos: dias seguidos ficam num registro só (07, 08 e 09 = 07 a 09)
  function dspBlocos(dias){
    const d=[...new Set(dias)].sort(), out=[];
    for(const x of d){ const u=out[out.length-1]; if(u&&somaDias(u[1],1)===x) u[1]=x; else out.push([x,x]); }
    return out;
  }
  async function salvarInternoDisp(){
    const v=(id)=>{ const e=document.getElementById(id); return e?e.value.trim():""; };
    const solto=v("dfGuia"); if(solto&&!DSP.fGuias.some(g=>g.toUpperCase()===solto.toUpperCase())) DSP.fGuias.push(solto);
    const guias=DSP.fGuias.slice();
    const base={tipo:DSP.form,horario:v("dfHor"),rec:v("dfRec").replace(/^REC-?/i,""),descricao:v("dfDesc"),quemPediu:v("dfQuem"),motivo:v("dfMot")};
    if(!guias.length){ alert("Informe pelo menos um guia."); return; }
    if(base.tipo==="servico"&&!base.descricao&&!base.rec&&!base.horario){ alert("Para bloquear para um serviço, informe a descrição, a REC ou o horário. Se a ideia é só não convidar, escolha \"Não convidar\" no topo do formulário."); return; }
    let blocos;
    if(DSP.fModo==="dias"){ const solta=v("dfDia"); const dias=DSP.fDias.length?DSP.fDias:(solta?[solta]:[]); if(!dias.length){ alert("Inclua pelo menos um dia."); return; } blocos=dspBlocos(dias); }
    else { const ini=v("dfIni"), fim=v("dfFim")||ini; if(!ini){ alert("Informe o dia."); return; } if(fim<ini){ alert("A data final é antes da inicial."); return; } blocos=[[ini,fim]]; }
    if(DSP.editId){ // editando um registro: um guia e um período
      if(guias.length!==1||blocos.length!==1){ alert("Ao editar, deixe um guia e um período só."); return; }
      try{ await chamarDisp("editarInterno",{...base,id:DSP.editId,guia:guias[0],inicio:blocos[0][0],fim:blocos[0][1]}); }catch(e){ alert(e.message); return; }
      DSP.editId=null; DSP.form=null; DSP.fGuias=[]; DSP.fDias=[]; DSP.fv={}; await carregarDisp(); return;
    }
    const total=guias.length*blocos.length;
    if(total>1&&!confirm("Salvar "+total+" registro(s): "+guias.length+" guia(s) × "+blocos.length+" período(s)?")) return;
    const bt=document.getElementById("dfSalvar"), pr=document.getElementById("dfProg"); if(bt) bt.disabled=true;
    const erros=[]; let k=0;
    for(const g of guias) for(const [ini,fim] of blocos){
      k++; if(pr) pr.textContent="Salvando "+k+" de "+total+"...";
      try{ await chamarDisp("salvarInterno",{...base,guia:g,inicio:ini,fim}); }catch(e){ erros.push(g+" ("+dataBR(ini).slice(0,5)+"): "+e.message); }
    }
    if(erros.length){ alert("Alguns não foram salvos:\n"+erros.join("\n")); if(bt) bt.disabled=false; if(pr) pr.textContent=""; await carregarDisp(); return; }
    DSP.form=null; DSP.fGuias=[]; DSP.fDias=[]; DSP.fv={}; await carregarDisp();
  }

  async function importarUtopia(inp){
    const f=inp.files[0]; if(!f) return;
    try{ await libsPagamentos(); const wb=XLSX.read(await f.arrayBuffer());
      const linhas=(n)=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true}):[];
      const resumo=linhas("Resumo (cards)"), filt=linhas("Filtros aplicados");
      const tot=(resumo.find(r=>/valor total vendido/i.test(String(r[0])))||[])[1];
      if(tot==null) throw new Error('não achei "Valor Total Vendido" (aba Resumo). É o Excel do Utopia → Vendas Gerais?');
      const ini=String((filt.find(r=>/data in/i.test(String(r[0])))||[])[1]||""), fim=String((filt.find(r=>/data fim/i.test(String(r[0])))||[])[1]||"");
      const setor=String((filt.find(r=>/setor/i.test(String(r[0])))||[])[1]||"");
      if(ini&&ini.slice(0,7)!==INI.meta.mes&&!confirm("O arquivo é de "+ini+" a "+fim+", e a meta é de "+nomeMes(INI.meta.mes)+". Importar mesmo assim?")) return;
      if(setor&&!/guia/i.test(setor)&&!confirm("O arquivo está com o setor \""+setor+"\". A meta é só dos guias. Importar mesmo assim?")) return;
      const porVendedor=linhas("Vendas por Vendedor").slice(1).filter(r=>r[0]).map(r=>({nome:String(r[0]),vendas:Number(r[1])||0})).sort((a,b)=>b.vendas-a.vendas);
      await carregarMeta("salvar",{mes:INI.meta.mes,realizado:Math.round(Number(tot)*100)/100,fonte:"utopia",ate:fim,porVendedor});
    }catch(e){ alert("Não consegui importar: "+e.message); } finally{ inp.value=""; }
  }

    cab("Registro interno da Central · o guia não vê",'<button class="btn sec" aria-label="Mês anterior" onclick="REC.mes=\''+mesAnt+'\';renderReclamacoes(document.getElementById(\'mainConteudo\'))">‹</button><span class="btn sec" style="cursor:default">'+nomeMes(REC.mes)+'</span><button class="btn sec" aria-label="Próximo mês" onclick="REC.mes=\''+mesProx+'\';renderReclamacoes(document.getElementById(\'mainConteudo\'))">›</button><button class="btn sec" onclick="relatorioReclam()">Relatório do mês</button><button class="btn" onclick="REC.edit={data:hojeISO(),status:\'aberta\'};desenharReclam()">＋ Nova reclamação</button>');

  function lerEmailReclam(t){
    const rec=(t.match(/REC[-\s]?(\d{5,7})/i)||t.match(/\b(\d{6})(?:\.\d)?\b/)||[])[1]; if(rec&&!document.getElementById("rcRec").value) document.getElementById("rcRec").value=rec;
    const T=normP(t); const c=(REC.contatos||[]).find(c=>[c.nome,...(c.apelidos||[])].some(n=>n&&n.length>3&&new RegExp("\\b"+normP(n)+"\\b").test(T)));

  async function removerReclam(id){ if(!confirm("Remover esta reclamação?")) return; try{ await chamarReclam("remover",{id}); REC.edit=null; carregarReclam(); }catch(e){ alert(e.message); } }
  function relatorioReclam(){
    const rk=rankingReclam(); const linhas=[["Ranking de reclamações · "+nomeMes(REC.mes)],[],["Posição","Guia","Reclamações"],...rk.map(([g,n],k)=>[k+1,g,n]),[],["Data","Guia","REC","Cliente","Origem","Categoria","Situação","Reembolso","Valor reembolso","Mimo","Qual mimo","O que aconteceu","Resolução"],
      ...REC.itens.map(x=>[dataBR(x.data),x.guia,x.rec,x.cliente,x.origem,x.categoria,(ST_REC[x.status]||[x.status])[0],x.reembolso?"Sim":"Não",x.valorReembolso||"",x.mimo?"Sim":"Não",x.qualMimo||"",x.descricao||"",x.resolucao||""])];
    const csv="\ufeff"+linhas.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="reclamacoes_"+REC.mes+".csv"; a.click();
  }

  // ---- Usuários (admin) ----
  async function renderUsuarios(m){
    m.innerHTML='<div class="card"><h3>Usuários do sistema</h3><div id="listaUsuarios">Carregando...</div></div>';
    const r=await chamar("usuarios",{});
    const lista=document.getElementById("listaUsuarios");
    if(!r.ok){ lista.textContent="Erro ao carregar."; return; }
    const pendentes=r.usuarios.filter(u=>u.status==="pendente");
    const aprovados=r.usuarios.filter(u=>u.status==="aprovado");
    let html="";
    if(pendentes.length){ html+='<div style="font-size:.8rem;font-weight:700;color:var(--aviso);margin:4px 0 10px;">AGUARDANDO APROVAÇÃO</div>';
      html+=pendentes.map(u=>linhaUsuario(u,true)).join(""); }
    html+='<div style="font-size:.8rem;font-weight:700;color:var(--verde);margin:18px 0 10px;">COM ACESSO</div>';
    html+=aprovados.map(u=>linhaUsuario(u,false)).join("");
    lista.innerHTML=html;
  }
  function linhaUsuario(u, pendente){
    const areas=["recife","porto","central","box","solic","financeiro"];
    const nomes={recife:"Recife",porto:"Porto",central:"Central",box:"Box",solic:"Solicitações",financeiro:"Financeiro"};
    const chips=areas.map(a=>'<span class="chip '+(u.areas&&u.areas.includes(a)?"on":"")+'" onclick="toggleArea(this)" data-area="'+a+'">'+nomes[a]+'</span>').join("");
    const acao = pendente
      ? '<button class="btn mini" onclick="aprovarUsuario(\''+u.email+'\',this)">Aprovar</button> <button class="btn mini danger" onclick="recusarUsuario(\''+u.email+'\')">Recusar</button>'
      : '<button class="btn mini sec" onclick="redefinirSenha(\''+u.email+'\',\''+String(u.nome||u.email).replace(/'/g,"")+'\')" title="Gerar senha provisória">🔑 Redefinir senha</button> <button class="btn mini sec" onclick="aprovarUsuario(\''+u.email+'\',this)">Salvar áreas</button>';
    return '<div class="u-linha" data-email="'+u.email+'">'
      +'<div style="min-width:160px"><div class="un">'+(u.nome||"—")+'</div><div class="ue">'+u.email+'</div></div>'
      +'<div class="areas-sel">'+chips+'</div>'
      +'<div style="margin-left:auto;display:flex;gap:6px;align-items:center;">'+acao+'</div></div>';
  }

  function toggleSidebar(){
    const sb=document.getElementById("sidebar");
    sb.classList.toggle("mini");
    try{ localStorage.setItem("sidebarMini", sb.classList.contains("mini")?"1":"0"); }catch(e){}
  }
  function aplicarPrefSidebar(){ document.getElementById("sidebar").classList.add("mini"); }

  function toggleArea(el){ el.classList.toggle("on"); }
  async function aprovarUsuario(email, btn){
    const linha=btn.closest(".u-linha");
    const areas=[...linha.querySelectorAll(".chip.on")].map(c=>c.dataset.area);
    if(areas.length===0){ alert("Marque ao menos uma área."); return; }
    btn.disabled=true; btn.textContent="...";
    const r=await chamar("aprovar",{email, areas});
    if(r.ok){ renderUsuarios(document.getElementById("mainConteudo")); atualizarPendentes(); }
    else { alert(r.erro||"Erro"); btn.disabled=false; }
  }
  async function recusarUsuario(email){
    if(!confirm("Recusar e apagar este cadastro?")) return;
    const r=await chamar("recusar",{email});
    if(r.ok){ renderUsuarios(document.getElementById("mainConteudo")); atualizarPendentes(); }
  }
  // ---- tema claro / escuro: guarda a escolha neste navegador; sem escolha, segue o celular/computador ----
  function aplicarTema(escuro){
    const app=document.getElementById("app"); if(!app) return;
    app.classList.toggle("escuro",!!escuro);
    const b=document.getElementById("btnTema"); if(b){ b.textContent=escuro?"☀️":"🌙"; b.title=escuro?"Tema claro":"Tema escuro"; }
  }
  function alternarTema(){
    const escuro=!document.getElementById("app").classList.contains("escuro");
    try{ localStorage.setItem("opTema",escuro?"escuro":"claro"); }catch(e){}
    aplicarTema(escuro);
  }
  (function(){
    let t=null; try{ t=localStorage.getItem("opTema"); }catch(e){}
    const sistema=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    const ap=()=>aplicarTema(t?t==="escuro":sistema);
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",ap); else ap();
  })();
</script>
