  // ======================= MAPA PELO PHOENIX (sem o Utopia) =======================
  // Lê as escalas do Phoenix no período, aplica o tarifário dos guias e as regras combinadas:
  // idioma quando o guia informou a REC de idioma no relatório; motoguia 262 (idioma 300) uma vez
  // por dia; apoio de manhã paga 1 (2 com Maragogi + outro passeio); apoio da tarde (VOLTA) paga 1;
  // passeio privativo tem o mesmo valor do regular.
  const MOTOGUIA=262, MOTOGUIA_IDIOMA=300, APOIO=40;
  async function salvarTarifario(){
    const f=document.getElementById("pilTarif").files[0]; if(!f){ alert("Selecione a planilha do tarifário."); return; }
    await libsPagamentos(); const wb=XLSX.read(await f.arrayBuffer());
    const aba=wb.SheetNames.find(n=>/^tarif[aá]rio guias$/i.test(n.trim())); if(!aba){ alert('Não achei a aba "Tarifário Guias".'); return; }
    const servicos={};
    for(const r of XLSX.utils.sheet_to_json(wb.Sheets[aba],{header:1,raw:true}).slice(1)){
      const nome=normP(r[0]); if(!nome) continue;
      const v=typeof r[1]==="number"?r[1]:null, vi=typeof r[2]==="number"?r[2]:v;
      if(v!=null) servicos[nome]={v,vi};
    }
    const j=await chamarPiloto("tarifario",{dados:{servicos,qtd:Object.keys(servicos).length,arquivo:f.name}});
    if(!j.ok){ alert(j.erro); return; }
    PIL.tarifario={servicos}; alert("Tarifário salvo: "+Object.keys(servicos).length+" serviços.");
  }
  function tarifaDe(servico,idioma){
    const t=(PIL.tarifario||{}).servicos||{}; const n=normP(servico);
    const x=t[n]||t[n.replace(/ - NOVOTEL MARINA$/,"")];
    return x?(idioma?x.vi:x.v):null;
  }
  function montarMapaPhoenix(linhas,nomes,relatorios){
    const porGuiaDia={};
    for(const r of relatorios){ const k=normP(r.guia)+"|"+r.data; (porGuiaDia[k]=porGuiaDia[k]||[]).push(...r.itens.map(i=>({...i}))); }
    const nomesRel=[...new Set(relatorios.map(r=>normP(r.guia)))];
    return nomes.map(nome=>{
      const N=normP(nome);
      const chaveRel=nomesRel.includes(N)?N:(nomesRel.find(x=>nomeBate(nome,x)||nomeBate(x,nome))||N);
      const minhas=linhas.filter(l=>normP(l.guia)===N||(normP(l.guia)&&nomeBate(nome,l.guia)&&nomeBate(l.guia,nome)));
      const out=[];
      for(const d of [...new Set(minhas.map(l=>l.data))].sort()){
        const L=minhas.filter(l=>l.data===d).sort((a,b)=>String(a.apresentacao||a.inicio).localeCompare(String(b.apresentacao||b.inicio)));
        const itens=porGuiaDia[chaveRel+"|"+d]||[];
        const usaIdioma=(cat)=>{ const i=itens.find(x=>!x._usado&&x.recIdioma&&String(catRel(x.servico)).startsWith(cat)); if(i){ i._usado=true; return i.recIdioma; } return ""; };
        const ehMoto=(l)=>normP(l.motorista)&&(normP(l.motorista)===N||nomeBate(nome,l.motorista));
        const motoIdioma=L.some(ehMoto)&&itens.some(i=>i.recIdioma);
        let motoPago=false; const idas=[], voltas=[];
        for(const l of L){
          const ap=l.auxiliar||/APOIO/i.test(l.servico);
          const cat=ap?(/VOLTA/i.test(l.servico)?"apoio-volta":"apoio-ida"):catMapa(l.servico);
          const linha={data:d,hora:String(l.apresentacao||l.inicio||"").slice(0,5),ro:l.escala,servico:l.auxiliar?("APOIO · "+l.servico):l.servico,veiculo:l.veiculo,motorista:l.motorista,valor:0,obs:""};
          if(ehMoto(l)){ linha.valor=motoPago?0:(motoIdioma?MOTOGUIA_IDIOMA:MOTOGUIA); linha.obs=motoPago?"motoguia (já pago no dia)":"motoguia"+(motoIdioma?" com idioma":""); motoPago=true; }
          else if(ap){ linha.valor=APOIO; (cat==="apoio-volta"?voltas:idas).push({linha,passeio:String(l.servico).toUpperCase()}); }
          else {
            const rec=cat==="passeio"?usaIdioma("passeio"):usaIdioma(cat==="chegada"?"chegada":cat==="saida"?"saida":"trf");
            const v=tarifaDe(l.servico,!!rec);
            if(v==null){ linha.valor=0; linha.obs="sem tarifa no tarifário: conferir"; } else { linha.valor=v; if(rec) linha.obs="idioma · REC "+rec; }
          }
          out.push(linha);
        }
        const mar=idas.some(a=>/MARAGOGI/.test(a.passeio)), outros=idas.some(a=>!/MARAGOGI/.test(a.passeio));
        const pagos=idas.length?((mar&&outros)?2:1):0;
        idas.slice(pagos).forEach(a=>{ a.linha.valor=0; a.linha.obs="apoio além do permitido no dia"; });
        voltas.slice(1).forEach(a=>{ a.linha.valor=0; a.linha.obs="apoio de volta já pago no dia"; });
      }
      return {nome,linhas:out,total:out.reduce((s,l)=>s+l.valor,0)};
    });
  }
  async function pilotoGerarPhoenix(){
    const nomes=document.getElementById("pilNomes").value.split(",").map(s=>s.trim()).filter(Boolean);
    const [ini,fim]=PIL.qid.split("_"); const info=document.getElementById("pilPhxInfo");
    try{
      if(!PIL.tarifario){ const t=await chamarPiloto("tarifario",{}); if(t.ok&&t.tarifario) PIL.tarifario=t.tarifario; }
      if(!PIL.tarifario){ alert("Salve o tarifário primeiro."); return; }
      const chamarC=async(acao)=>{ const r=await fetch(API_CONFERENCIA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,inicio:ini,fim})}); const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro); return j; };
      info.textContent="Lendo as escalas do Phoenix de "+dataBR(ini)+" a "+dataBR(fim)+" (pode levar até 2 minutos na primeira vez)...";
      const linhas=(await chamarC("linhas")).linhas;

      const mapas=montarMapaPhoenix(linhas,nomes,rel);
      const vazios=mapas.filter(m=>!m.linhas.length).map(m=>m.nome);
      const j=await chamarPiloto("carregar",{guias:mapas.filter(m=>m.linhas.length).map(m=>({nome:m.nome,linhas:m.linhas}))});
      if(!j.ok) throw new Error(j.erro);
      PIL.mapasPhoenix=mapas;
      info.textContent="Mapa gerado pelo Phoenix: "+mapas.map(m=>m.nome+" "+m.linhas.length+" serviços · "+brlP(m.total)).join(" | ")+(rel.length?"":" · (sem relatórios: idioma não aplicado)");
      if(vazios.length) alert("Nenhum serviço no Phoenix para: "+vazios.join(", ")+". Confira se o nome está igual ao do Phoenix.");
      atualizarPiloto();
    }catch(e){ console.error(e); alert("Erro: "+e.message); info.textContent=""; }
  }

  async function pilotoCompararPaar(){

  async function chamarDisp(acao,dados){ const r=await fetch(API_CONFERENCIA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,...dados})}); const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro); return j; }
  function renderDisponibilidade(m){

  async function carregarDisp(){

      const [d,i,ct]=await Promise.all([chamarDisp("disponibilidade",{inicio:DSP.data,fim:somaDias(DSP.data,6)}),chamarDisp("internos",{}),chamarEnvios("contatos",{}).catch(()=>null)]);

  // situação de um guia num dia: registros internos > bloqueios do painel > o que o guia marcou no app

  function situacaoDisp(guia,dia){
    const G=normP(oficialDe(guia)), cobre=(x)=>x.inicio<=dia&&dia<=x.fim&&normP(oficialDe(x.guia))===G;
    const nc=DSP.internos.find(x=>x.tipo==="naoConvidar"&&cobre(x)); if(nc) return {s:"n",det:"Não convidar até "+dataBR(nc.fim).slice(0,5)+(nc.motivo?" · "+nc.motivo:""),x:nc};

    const bl=(DSP.dados.bloqueios||[]).find(cobre); if(bl) return bl.tipo==="passeio"?{s:"p",det:"Escalado em passeio"+(bl.motivo?": "+bl.motivo:"")}:{s:"b",det:"Bloqueio do painel"+(bl.motivo?": "+bl.motivo:"")};

  // última escala (até hoje) e próxima, juntando os nomes/apelidos do mesmo guia

      if(v.ultima&&(!x.ultima||v.ultima>x.ultima)) x.ultima=v.ultima; if(v.proxima&&(!x.proxima||v.proxima<x.proxima)) x.proxima=v.proxima; } }

  }
  function ultTxt(nome){ const u=ultimaDe(nome); if(!u.ultima&&!u.proxima) return '<span style="font-size:.72rem;color:var(--muted)">sem escala nos últimos 60 dias</span>';

  // o detalhe só aparece quando diz algo além da etiqueta (ex.: "Após as 13hs")

  // coluna "Última escala": data em destaque e há quantos dias (laranja a partir de 15 dias)

  function dspFecharForm(){ DSP.form=null; DSP.fGuias=[]; DSP.fDias=[]; DSP.fv={}; desenharDisp(); }
  function dspAddGuia(){ const e=document.getElementById("dfGuia"); const v=e?e.value.trim():""; if(!v) return;
    if(!DSP.fGuias.some(g=>g.toUpperCase()===v.toUpperCase())) DSP.fGuias.push(v); desenharDisp(); setTimeout(()=>{ const n=document.getElementById("dfGuia"); if(n) n.focus(); },0); }
  function dspAddDia(){ const e=document.getElementById("dfDia"); const v=e?e.value:""; if(!v) return; if(!DSP.fDias.includes(v)) DSP.fDias.push(v); desenharDisp(); }
  // dias separados viram blocos: dias seguidos ficam num registro só (07, 08 e 09 = 07 a 09)
  function dspBlocos(dias){
    const d=[...new Set(dias)].sort(), out=[];
    for(const x of d){ const u=out[out.length-1]; if(u&&somaDias(u[1],1)===x) u[1]=x; else out.push([x,x]); }
    return out;
  }
  async function salvarInternoDisp(){
    const v=(id)=>{ const e=document.getElementById(id); return e?e.value.trim():""; };
    const solto=v("dfGuia"); if(solto&&!DSP.fGuias.some(g=>g.toUpperCase()===solto.toUpperCase())) DSP.fGuias.push(solto);
    const guias=DSP.fGuias.slice();
    const base={tipo:DSP.form,horario:v("dfHor"),rec:v("dfRec").replace(/^REC-?/i,""),descricao:v("dfDesc"),quemPediu:v("dfQuem"),motivo:v("dfMot")};
    if(!guias.length){ alert("Informe pelo menos um guia."); return; }
    if(base.tipo==="servico"&&!base.descricao&&!base.rec&&!base.horario){ alert("Para bloquear para um serviço, informe a descrição, a REC ou o horário. Se a ideia é só não convidar, escolha \"Não convidar\" no topo do formulário."); return; }
    let blocos;
    if(DSP.fModo==="dias"){ const solta=v("dfDia"); const dias=DSP.fDias.length?DSP.fDias:(solta?[solta]:[]); if(!dias.length){ alert("Inclua pelo menos um dia."); return; } blocos=dspBlocos(dias); }
    else { const ini=v("dfIni"), fim=v("dfFim")||ini; if(!ini){ alert("Informe o dia."); return; } if(fim<ini){ alert("A data final é antes da inicial."); return; } blocos=[[ini,fim]]; }
    const total=guias.length*blocos.length;
    if(total>1&&!confirm("Salvar "+total+" registro(s): "+guias.length+" guia(s) × "+blocos.length+" período(s)?")) return;
    const bt=document.getElementById("dfSalvar"), pr=document.getElementById("dfProg"); if(bt) bt.disabled=true;
    const erros=[]; let k=0;
    for(const g of guias) for(const [ini,fim] of blocos){
      k++; if(pr) pr.textContent="Salvando "+k+" de "+total+"...";
      try{ await chamarDisp("salvarInterno",{...base,guia:g,inicio:ini,fim}); }catch(e){ erros.push(g+" ("+dataBR(ini).slice(0,5)+"): "+e.message); }
    }
    if(erros.length){ alert("Alguns não foram salvos:\n"+erros.join("\n")); if(bt) bt.disabled=false; if(pr) pr.textContent=""; await carregarDisp(); return; }
    DSP.form=null; DSP.fGuias=[]; DSP.fDias=[]; DSP.fv={}; await carregarDisp();
  }
  async function removerInternoDisp(id){ if(!confirm("Remover este registro?")) return; try{ await chamarDisp("removerInterno",{id}); await carregarDisp(); }catch(e){ alert(e.message); } }

      +((INI.tipo||"reuniao")==="reuniao"?'<div style="display:flex;gap:8px"><input type="datetime-local" id="muQuando" style="height:42px;flex:1"><input id="muLink" placeholder="Link da reunião (Meet, Zoom...)" style="flex:2;height:42px;border:1px solid #cfdcd8;border-radius:10px;padding:0 10px;font-family:inherit"></div>':'')
      +'<textarea id="muTexto" rows="2" placeholder="Detalhes (opcional)" style="border:1px solid #cfdcd8;border-radius:10px;padding:8px 10px;font-family:inherit"></textarea><button class="btn" onclick="publicarMural()">Publicar para todos</button></div>';
    h+=(INI.mural.length?INI.mural.map(x=>'<div style="padding:12px 0;border-top:1px solid var(--linha);display:flex;gap:12px;align-items:flex-start"><span style="font-size:20px">'+(x.tipo==="reuniao"?"📅":"📢")+'</span><div style="flex:1;min-width:0"><b style="font-size:.92rem">'+esc(x.titulo)+'</b>'+(x.quando?'<div style="font-size:.82rem;color:var(--verde-esc);font-weight:700">'+esc(fmtQ(x.quando))+'</div>':'')+(x.texto?'<div style="font-size:.84rem;color:var(--muted);margin-top:2px">'+esc(x.texto)+'</div>':'')+'<div style="font-size:.74rem;color:var(--muted);margin-top:4px">'+esc(x.por||"")+'</div></div>'
      +(x.link?'<a class="btn mini" style="text-decoration:none;white-space:nowrap" href="'+esc(x.link)+'" target="_blank" rel="noopener">Entrar</a>':'')+(INI.podePublicar?'<button class="btn mini sec" style="padding:3px 9px" title="Remover" onclick="if(confirm(\'Remover do mural?\'))carregarMural(\'del\',{id:\''+x.id+'\'})">✕</button>':'')+'</div>').join(""):'<p style="font-size:.86rem;color:var(--muted)">Nenhuma reunião ou aviso no momento.</p>')+'</div>';
    box.innerHTML=h;
  }
  function publicarMural(){ const v=(id)=>{ const e=document.getElementById(id); return e?e.value.trim():""; };
    carregarMural("add",{tipo:INI.tipo||"reuniao",titulo:v("muTit"),quando:v("muQuando"),link:v("muLink"),texto:v("muTexto")}).then(()=>{ INI.form=false; desenharMural(); }); }


  // ======================= RECLAMAÇÕES (registro interno) =======================
  const API_RECLAM="https://us-central1-operacional-luck.cloudfunctions.net/reclamacoes";
  const REC={mes:null,itens:[],cats:[],edit:null,filtro:"todas",busca:""};
  async function chamarReclam(acao,dados){ const r=await fetch(API_RECLAM,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,...dados})}); const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro); return j; }
  const MESES_N=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const nomeMes=(m)=>MESES_N[+m.slice(5)-1]+" de "+m.slice(0,4);
  function renderReclamacoes(m){
    if(!REC.mes) REC.mes=hojeISO().slice(0,7);
    const mesAnt=(()=>{ const [a,mm]=REC.mes.split("-").map(Number); return mm===1?(a-1)+"-12":a+"-"+String(mm-1).padStart(2,"0"); })();
    const mesProx=(()=>{ const [a,mm]=REC.mes.split("-").map(Number); return mm===12?(a+1)+"-01":a+"-"+String(mm+1).padStart(2,"0"); })();
    cab("Registro interno da Central · o guia não vê",'<button class="btn sec" aria-label="Mês anterior" onclick="REC.mes=\''+mesAnt+'\';renderReclamacoes(document.getElementById(\'mainConteudo\'))">‹</button><span class="btn sec" style="cursor:default">'+nomeMes(REC.mes)+'</span><button class="btn sec" aria-label="Próximo mês" onclick="REC.mes=\''+mesProx+'\';renderReclamacoes(document.getElementById(\'mainConteudo\'))">›</button><button class="btn sec" onclick="relatorioReclam()">Relatório do mês</button><button class="btn" onclick="REC.edit={data:hojeISO(),status:\'aberta\'};desenharReclam()">＋ Nova reclamação</button>');
    m.innerHTML='<div id="recForm"></div><div id="recConteudo"><div class="card" style="color:var(--muted)">Carregando...</div></div><datalist id="recGuias"></datalist>';
    carregarReclam();
    chamarEnvios("contatos",{}).then(j=>{ const d=document.getElementById("recGuias"); if(d&&j&&j.contatos) d.innerHTML=j.contatos.map(c=>'<option value="'+esc(c.nome)+'">').join(""); REC.contatos=(j&&j.contatos)||[]; }).catch(()=>{});
  }
  async function carregarReclam(){ try{ const j=await chamarReclam("listar",{mes:REC.mes}); REC.itens=j.itens; REC.cats=j.categorias; desenharReclam(); }catch(e){ const b=document.getElementById("recConteudo"); if(b) b.innerHTML='<div class="card" style="color:var(--alerta)">'+esc(e.message)+'</div>'; } }
  const ST_REC={aberta:["Aberta","#fde4df","#9f2a15"],andamento:["Em andamento","#fff1e0","#8a4a0c"],resolvida:["Resolvida","#e3f2ee","#0b4f44"]};
  function rankingReclam(){ const r={}; REC.itens.forEach(x=>{ r[x.guia]=(r[x.guia]||0)+1; }); return Object.entries(r).sort((a,b)=>b[1]-a[1]); }
  function desenharReclam(){
    const f=document.getElementById("recForm"); if(f) f.innerHTML=REC.edit?htmlFormReclam():"";
    const box=document.getElementById("recConteudo"); if(!box) return;
    const I=REC.itens, reemb=I.filter(x=>x.reembolso).reduce((s,x)=>s+(x.valorReembolso||0),0);
    let h='<div class="cards-resumo"><div class="resumo"><div class="num">'+I.length+'</div><div class="lbl">Reclamações no mês</div></div><div class="resumo'+(I.filter(x=>x.status!=="resolvida").length?' alerta':'')+'"><div class="num">'+I.filter(x=>x.status!=="resolvida").length+'</div><div class="lbl">Em aberto</div></div><div class="resumo ok"><div class="num">'+I.filter(x=>x.status==="resolvida").length+'</div><div class="lbl">Resolvidas</div></div><div class="resumo"><div class="num">'+brlP(reemb)+'</div><div class="lbl">Reembolsado</div></div><div class="resumo"><div class="num">'+I.filter(x=>x.mimo).length+'</div><div class="lbl">Mimos enviados</div></div></div>';
    const rk=rankingReclam();
    if(rk.length) h+='<div class="card"><h3 style="font-size:1rem;margin-bottom:10px">Guias com mais reclamações em '+nomeMes(REC.mes)+'</h3><div style="display:flex;flex-wrap:wrap;gap:8px">'+rk.slice(0,10).map(([g,n],k)=>'<span class="pill" style="font-size:.8rem;padding:6px 12px;background:'+(k<3&&n>1?'#fde4df':'#eef1f0')+';color:'+(k<3&&n>1?'#9f2a15':'#3c524d')+'">'+(k+1)+'º '+esc(titulo(g))+' · '+n+'</span>').join("")+'</div></div>';
    h+='<div class="filtros">'+campoBusca("recBusca","Buscar guia, REC ou cliente",REC.busca,"REC.busca=this.value;desenharReclam();setTimeout(()=>{const e=document.getElementById(\'recBusca\');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},0)")
      +segmento([["todas","Todas"],["aberta","Abertas"],["andamento","Em andamento"],["resolvida","Resolvidas"]],REC.filtro,"REC.filtro='$v';desenharReclam()")+'</div>';
    const b=normP(REC.busca); let vis=I.filter(x=>REC.filtro==="todas"||x.status===REC.filtro); if(b) vis=vis.filter(x=>normP(x.guia+" "+x.rec+" "+x.cliente).includes(b));
    h+=vis.length?vis.map(x=>{ const s=ST_REC[x.status]||ST_REC.aberta;
      return '<div class="card" style="padding:14px 18px;cursor:pointer" onclick="REC.edit=JSON.parse(JSON.stringify(REC.itens.find(y=>y.id===\''+x.id+'\')));desenharReclam();window.scrollTo(0,0)"><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><b style="font-size:1rem">'+esc(titulo(x.guia))+'</b><span class="pill" style="background:'+s[1]+';color:'+s[2]+'">'+s[0]+'</span><span style="font-size:.82rem;color:var(--muted)">'+dataBR(x.data)+' · '+esc(x.categoria)+(x.origem?' · '+esc(x.origem):'')+'</span>'+(x.rec?'<span style="font-size:.82rem;font-weight:700;color:#1e3a8a">REC-'+esc(x.rec)+'</span>':'')
        +'<span style="margin-left:auto;display:flex;gap:6px">'+(x.reembolso?'<span class="pill" style="background:#e6ecfb;color:#1e3a8a">Reembolso '+brlP(x.valorReembolso)+'</span>':'')+(x.mimo?'<span class="pill" style="background:#efe7fb;color:#5b21b6">Mimo</span>':'')+'</span></div>'
        +'<div style="font-size:.86rem;margin-top:6px;color:var(--tinta)">'+esc((x.cliente?x.cliente+': ':'')+String(x.descricao||"").slice(0,180))+(String(x.descricao||"").length>180?'…':'')+'</div>'+(x.resolucao?'<div style="font-size:.82rem;margin-top:4px;color:var(--muted)">Resolução: '+esc(String(x.resolucao).slice(0,160))+'</div>':'')+'</div>'; }).join(""):'<div class="em-breve"><div class="ic">✅</div><h3>Nenhuma reclamação</h3><p>Nada registrado nesse filtro em '+nomeMes(REC.mes)+'.</p></div>';
    box.innerHTML=h;
  }
  function htmlFormReclam(){
    const x=REC.edit, lb='display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:700;color:var(--muted)', inp='style="height:44px;border:1px solid #cfdcd8;border-radius:12px;padding:0 12px;font-family:inherit;font-size:.92rem"';
    const v=(k)=>esc(x[k]==null?"":x[k]);
    return '<div class="card" style="border:2px solid var(--verde)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><h3 style="margin:0;flex:1">'+(x.id?'Editar reclamação':'Nova reclamação')+'</h3>'+(x.id&&USUARIO.admin?'<button class="btn mini danger" onclick="removerReclam(\''+x.id+'\')">Remover</button>':'')+'</div>'
      +(x.id?'':'<label style="'+lb+';margin-bottom:12px">Colar o e-mail (opcional: o sistema tenta achar a REC e o guia)<textarea id="rcEmail" rows="3" style="border:1px solid #cfdcd8;border-radius:12px;padding:10px 12px;font-family:inherit" oninput="lerEmailReclam(this.value)"></textarea></label>')
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">'
      +'<label style="'+lb+'">Data<input type="date" id="rcData" value="'+v("data")+'" '+inp+'></label>'
      +'<label style="'+lb+'">Guia<input id="rcGuia" list="recGuias" value="'+v("guia")+'" '+inp+'></label>'
      +'<label style="'+lb+'">REC<input id="rcRec" value="'+v("rec")+'" inputmode="numeric" '+inp+'></label>'
      +'<label style="'+lb+'">Cliente<input id="rcCliente" value="'+v("cliente")+'" '+inp+'></label>'
      +'<label style="'+lb+'">Origem<select id="rcOrigem" '+inp+'>'+["E-mail","WhatsApp","Telefone","Avaliação online","Pessoalmente"].map(o=>'<option'+(x.origem===o?' selected':'')+'>'+o+'</option>').join("")+'</select></label>'
      +'<label style="'+lb+'">Categoria<select id="rcCat" '+inp+'>'+(REC.cats.length?REC.cats:["Outro"]).map(o=>'<option'+(x.categoria===o?' selected':'')+'>'+o+'</option>').join("")+'</select></label>'
      +'<label style="'+lb+';grid-column:1/-1">O que aconteceu<textarea id="rcDesc" rows="3" style="border:1px solid #cfdcd8;border-radius:12px;padding:10px 12px;font-family:inherit">'+v("descricao")+'</textarea></label>'
      +'<label style="'+lb+'">Situação<select id="rcStatus" '+inp+'>'+[["aberta","Aberta"],["andamento","Em andamento"],["resolvida","Resolvida"]].map(([k,t])=>'<option value="'+k+'"'+(x.status===k?' selected':'')+'>'+t+'</option>').join("")+'</select></label>'
      +'<label style="'+lb+'">Reembolso<span style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rcReemb" '+(x.reembolso?'checked':'')+' style="width:20px;height:20px"><input id="rcValor" placeholder="R$ valor" value="'+(x.valorReembolso?String(x.valorReembolso).replace(".",","):"")+'" '+inp.replace('style="','style="flex:1;')+'></span></label>'
      +'<label style="'+lb+'">Mimo para o pax<span style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rcMimo" '+(x.mimo?'checked':'')+' style="width:20px;height:20px"><input id="rcQualMimo" placeholder="Qual? (ex.: passeio cortesia)" value="'+v("qualMimo")+'" '+inp.replace('style="','style="flex:1;')+'></span></label>'
      +'<label style="'+lb+';grid-column:1/-1">Como foi resolvido<textarea id="rcResol" rows="2" style="border:1px solid #cfdcd8;border-radius:12px;padding:10px 12px;font-family:inherit">'+v("resolucao")+'</textarea></label>'
      +'</div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn sec" onclick="REC.edit=null;desenharReclam()">Cancelar</button><button class="btn" onclick="salvarReclam()">Salvar</button></div></div>';
  }
  function lerEmailReclam(t){
    const rec=(t.match(/REC[-\s]?(\d{5,7})/i)||t.match(/\b(\d{6})(?:\.\d)?\b/)||[])[1]; if(rec&&!document.getElementById("rcRec").value) document.getElementById("rcRec").value=rec;
    const T=normP(t); const c=(REC.contatos||[]).find(c=>[c.nome,...(c.apelidos||[])].some(n=>n&&n.length>3&&new RegExp("\\b"+normP(n)+"\\b").test(T)));
    if(c&&!document.getElementById("rcGuia").value) document.getElementById("rcGuia").value=c.nome;
    if(!document.getElementById("rcDesc").value) document.getElementById("rcDesc").value=t.trim().slice(0,3000);
  }
  async function salvarReclam(){
    const g=(id)=>document.getElementById(id), num=(s)=>parseFloat(String(s||"").replace(/[R$\s.]/g,"").replace(",","."))||0;
    const dados={id:REC.edit.id,data:g("rcData").value,guia:g("rcGuia").value,rec:g("rcRec").value,cliente:g("rcCliente").value,origem:g("rcOrigem").value,categoria:g("rcCat").value,descricao:g("rcDesc").value,status:g("rcStatus").value,reembolso:g("rcReemb").checked,valorReembolso:num(g("rcValor").value),mimo:g("rcMimo").checked,qualMimo:g("rcQualMimo").value,resolucao:g("rcResol").value};
    try{ await chamarReclam("salvar",{dados}); REC.edit=null; if(dados.data.slice(0,7)!==REC.mes) REC.mes=dados.data.slice(0,7); await carregarReclam(); }catch(e){ alert(e.message); }
  }
  async function removerReclam(id){ if(!confirm("Remover esta reclamação?")) return; try{ await chamarReclam("remover",{id}); REC.edit=null; carregarReclam(); }catch(e){ alert(e.message); } }
  function relatorioReclam(){
    const rk=rankingReclam(); const linhas=[["Ranking de reclamações · "+nomeMes(REC.mes)],[],["Posição","Guia","Reclamações"],...rk.map(([g,n],k)=>[k+1,g,n]),[],["Data","Guia","REC","Cliente","Origem","Categoria","Situação","Reembolso","Valor reembolso","Mimo","Qual mimo","O que aconteceu","Resolução"],
      ...REC.itens.map(x=>[dataBR(x.data),x.guia,x.rec,x.cliente,x.origem,x.categoria,(ST_REC[x.status]||[x.status])[0],x.reembolso?"Sim":"Não",x.valorReembolso||"",x.mimo?"Sim":"Não",x.qualMimo||"",x.descricao||"",x.resolucao||""])];
    const csv="\ufeff"+linhas.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="reclamacoes_"+REC.mes+".csv"; a.click();
  }

  // ---- Usuários (admin) ----
  async function renderUsuarios(m){
    m.innerHTML='<div class="card"><h3>Usuários do sistema</h3><div id="listaUsuarios">Carregando...</div></div>';
    const r=await chamar("usuarios",{});
    const lista=document.getElementById("listaUsuarios");
    if(!r.ok){ lista.textContent="Erro ao carregar."; return; }
    const pendentes=r.usuarios.filter(u=>u.status==="pendente");
    const aprovados=r.usuarios.filter(u=>u.status==="aprovado");
    let html="";
    if(pendentes.length){ html+='<div style="font-size:.8rem;font-weight:700;color:var(--aviso);margin:4px 0 10px;">AGUARDANDO APROVAÇÃO</div>';
      html+=pendentes.map(u=>linhaUsuario(u,true)).join(""); }
    html+='<div style="font-size:.8rem;font-weight:700;color:var(--verde);margin:18px 0 10px;">COM ACESSO</div>';
    html+=aprovados.map(u=>linhaUsuario(u,false)).join("");
    lista.innerHTML=html;
  }
  function linhaUsuario(u, pendente){
    const areas=["recife","porto","central","box"];
    const nomes={recife:"Recife",porto:"Porto",central:"Central",box:"Box"};
    const chips=areas.map(a=>'<span class="chip '+(u.areas&&u.areas.includes(a)?"on":"")+'" onclick="toggleArea(this)" data-area="'+a+'">'+nomes[a]+'</span>').join("");
    const acao = pendente
      ? '<button class="btn mini" onclick="aprovarUsuario(\''+u.email+'\',this)">Aprovar</button> <button class="btn mini danger" onclick="recusarUsuario(\''+u.email+'\')">Recusar</button>'
      : '<button class="btn mini sec" onclick="redefinirSenha(\''+u.email+'\',\''+String(u.nome||u.email).replace(/'/g,"")+'\')" title="Gerar senha provisória">🔑 Redefinir senha</button> <button class="btn mini sec" onclick="aprovarUsuario(\''+u.email+'\',this)">Salvar áreas</button>';
    return '<div class="u-linha" data-email="'+u.email+'">'
      +'<div style="min-width:160px"><div class="un">'+(u.nome||"—")+'</div><div class="ue">'+u.email+'</div></div>'
      +'<div class="areas-sel">'+chips+'</div>'
      +'<div style="margin-left:auto;display:flex;gap:6px;align-items:center;">'+acao+'</div></div>';
  }

  function toggleSidebar(){
    const sb=document.getElementById("sidebar");
    sb.classList.toggle("mini");
    try{ localStorage.setItem("sidebarMini", sb.classList.contains("mini")?"1":"0"); }catch(e){}
  }
  function aplicarPrefSidebar(){ document.getElementById("sidebar").classList.add("mini"); }

  function toggleArea(el){ el.classList.toggle("on"); }
  async function aprovarUsuario(email, btn){
    const linha=btn.closest(".u-linha");
    const areas=[...linha.querySelectorAll(".chip.on")].map(c=>c.dataset.area);
    if(areas.length===0){ alert("Marque ao menos uma área."); return; }
    btn.disabled=true; btn.textContent="...";
    const r=await chamar("aprovar",{email, areas});
    if(r.ok){ renderUsuarios(document.getElementById("mainConteudo")); atualizarPendentes(); }
    else { alert(r.erro||"Erro"); btn.disabled=false; }
  }
  async function recusarUsuario(email){
    if(!confirm("Recusar e apagar este cadastro?")) return;
    const r=await chamar("recusar",{email});
    if(r.ok){ renderUsuarios(document.getElementById("mainConteudo")); atualizarPendentes(); }
  }
  // ---- tema claro / escuro: guarda a escolha neste navegador; sem escolha, segue o celular/computador ----
  function aplicarTema(escuro){
    const app=document.getElementById("app"); if(!app) return;
    app.classList.toggle("escuro",!!escuro);
    const b=document.getElementById("btnTema"); if(b){ b.textContent=escuro?"☀️":"🌙"; b.title=escuro?"Tema claro":"Tema escuro"; }
  }
  function alternarTema(){
    const escuro=!document.getElementById("app").classList.contains("escuro");
    try{ localStorage.setItem("opTema",escuro?"escuro":"claro"); }catch(e){}
    aplicarTema(escuro);
  }
  (function(){
    let t=null; try{ t=localStorage.getItem("opTema"); }catch(e){}
    const sistema=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    const ap=()=>aplicarTema(t?t==="escuro":sistema);
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",ap); else ap();
  })();
</script>
