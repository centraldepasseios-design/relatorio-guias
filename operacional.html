<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operacional Luck</title>
<style>
  :root{--verde:#1f7a6d;--verde-esc:#15524a;--verde-claro:#e8f3f1;--tinta:#12332e;--texto:#1f2a28;--muted:#6b7d79;--linha:#e2ebe9;--bg:#f3f7f6;--card:#fff;--alerta:#c0392b;--alerta-bg:#fdecea;--ok:#1f7a6d;--aviso:#b8860b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--texto);-webkit-font-smoothing:antialiased;}
  /* LOGIN */
  .tela-acesso{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1f7a6d,#15524a);padding:20px;}
  .acesso-card{background:#fff;border-radius:16px;padding:38px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .acesso-logo{display:flex;justify-content:center;margin-bottom:8px;} .acesso-logo img{height:50px;}
  .acesso-card h1{font-size:1.15rem;text-align:center;color:var(--tinta);font-weight:700;}
  .acesso-card .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:24px;}
  .campo{margin-bottom:14px;} .campo label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .campo input{width:100%;padding:12px 14px;border:1.5px solid var(--linha);border-radius:10px;font-size:.95rem;}
  .campo input:focus{outline:none;border-color:var(--verde);}
  .btn-full{width:100%;padding:13px;background:var(--verde);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:6px;}
  .btn-full:hover{background:var(--verde-esc);} .btn-full:disabled{opacity:.6;cursor:default;}
  .link-troca{text-align:center;margin-top:16px;font-size:.84rem;color:var(--verde);cursor:pointer;}
  .msg{padding:10px 12px;border-radius:8px;font-size:.84rem;margin-bottom:14px;display:none;}
  .msg.erro{background:var(--alerta-bg);color:var(--alerta);display:block;}
  .msg.ok{background:var(--verde-claro);color:var(--verde);display:block;}
  .acesso-nota{font-size:.72rem;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5;}
  /* APP */
  .app{display:none;min-height:100vh;} .app.ativo{display:flex;}
  .sidebar{width:248px;background:var(--verde-esc);color:#dff0ec;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;}
  .sb-topo{padding:20px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px;}
  .sb-topo img{height:34px;} .sb-topo .nome{font-weight:700;font-size:.95rem;color:#fff;line-height:1.1;} .sb-topo .nome small{display:block;font-weight:400;font-size:.7rem;color:#a9cfc8;}
  .sb-scroll{overflow-y:auto;flex:1;}
  .sb-area{padding:14px 14px 6px;} .sb-area-tit{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#80b3aa;padding:0 8px 6px;font-weight:600;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:.88rem;color:#cfe6e1;margin-bottom:2px;}
  .sb-item:hover{background:rgba(255,255,255,.08);} .sb-item.ativo{background:var(--verde);color:#fff;font-weight:600;}
  .sb-item .ic{width:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;} .sb-item .pend{margin-left:auto;background:var(--alerta);color:#fff;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:20px;display:none;}
  .sb-rodape{padding:14px;border-top:1px solid rgba(255,255,255,.12);}
  .sb-user{display:flex;align-items:center;gap:10px;color:#cfe6e1;font-size:.8rem;}
  .sb-user .av{width:32px;height:32px;border-radius:50%;background:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;}
  .sb-user .sair{margin-left:auto;color:#9fc9c1;cursor:pointer;font-size:.75rem;}
  .conteudo{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topo{background:#fff;border-bottom:1px solid var(--linha);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
  .topo h2{font-size:1.15rem;color:var(--tinta);font-weight:700;} .area-badge{font-size:.72rem;background:var(--verde-claro);color:var(--verde);padding:4px 10px;border-radius:20px;font-weight:600;}
  .main{padding:24px 28px;flex:1;}
  .btn{padding:9px 16px;border:none;border-radius:9px;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--verde);color:#fff;} .btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde);} .btn.mini{padding:5px 12px;font-size:.78rem;}
  .btn.danger{background:#fff;color:var(--alerta);border:1.5px solid var(--alerta);}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:20px;margin-bottom:16px;}
  .card h3{font-size:1rem;color:var(--tinta);margin-bottom:14px;}
  .em-breve{text-align:center;padding:70px 20px;color:var(--muted);} .em-breve .ic{font-size:2.6rem;margin-bottom:12px;opacity:.5;} .em-breve h3{font-size:1.05rem;color:var(--texto);margin-bottom:6px;font-weight:600;} .em-breve p{font-size:.88rem;max-width:380px;margin:0 auto;line-height:1.5;}

  .cards-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .resumo{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;}
  .resumo .num{font-size:1.8rem;font-weight:700;color:var(--tinta);line-height:1;} .resumo .lbl{font-size:.78rem;color:var(--muted);margin-top:4px;}
  .resumo.alerta .num{color:var(--alerta);} .resumo.ok .num{color:var(--ok);}
  .lista-div{display:flex;flex-direction:column;gap:10px;}
  .div-item{background:var(--card);border:1px solid var(--linha);border-left:4px solid var(--alerta);border-radius:10px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;}
  .div-item .tag{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--alerta-bg);color:var(--alerta);white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;}
  .div-item .corpo{flex:1;min-width:0;} .div-item .rec{font-weight:700;color:var(--tinta);font-size:.92rem;} .div-item .det{font-size:.85rem;color:var(--texto);margin-top:3px;} .div-item .sub{font-size:.78rem;color:var(--muted);margin-top:2px;}
  .div-item.horario{border-left-color:var(--aviso);} .div-item.horario .tag{background:#fdf6e3;color:var(--aviso);}
  .barra-busca{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
  .barra-busca input{padding:10px 14px;border:1.5px solid var(--linha);border-radius:9px;font-size:.9rem;background:#fff;}


  .mot-bloco{margin-bottom:18px;}
  .mot-cab{font-size:.9rem;font-weight:700;color:var(--verde);padding:8px 0;border-bottom:2px solid var(--verde-claro);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .mot-count{background:var(--alerta-bg);color:var(--alerta);font-size:.72rem;padding:1px 9px;border-radius:20px;}
  .div-item{cursor:pointer;position:relative;}
  .detalhe-extra{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--linha);font-size:.82rem;color:var(--texto);}
  .detalhe-extra div{margin-bottom:3px;}
  .div-item.aberto .detalhe-extra{display:block;}
  .btn-check{background:#fff;border:1.5px solid var(--linha);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.9rem;flex-shrink:0;}
  .btn-check:hover{border-color:var(--verde);color:var(--verde);}
  .div-item.verificado{opacity:.5;}
  .div-item.verificado .btn-check{background:var(--verde);color:#fff;border-color:var(--verde);}

  .pg{display:none;} .pg.ativo{display:block;}
  /* usuarios */
  .u-linha{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;margin-bottom:8px;background:#fff;flex-wrap:wrap;}
  .u-linha .un{font-weight:600;color:var(--tinta);font-size:.9rem;} .u-linha .ue{font-size:.8rem;color:var(--muted);}
  .u-linha .areas-sel{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-size:.75rem;padding:4px 10px;border:1.5px solid var(--linha);border-radius:20px;cursor:pointer;color:var(--muted);user-select:none;}
  .chip.on{background:var(--verde-claro);border-color:var(--verde);color:var(--verde);font-weight:600;}
  .u-tag{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:20px;} .u-tag.aprov{background:var(--verde-claro);color:var(--verde);} .u-tag.pend{background:#fdf6e3;color:var(--aviso);}


  /* expande ao passar o mouse quando esta recolhida */
  .sidebar.mini:hover{width:248px;}
  .sidebar.mini:hover .nome, .sidebar.mini:hover .sb-item .rotulo, .sidebar.mini:hover #userInfo, .sidebar.mini:hover .sb-user .sair{display:block;}
  .sidebar.mini:hover .sb-topo{justify-content:flex-start;padding:20px;}
  .sidebar.mini:hover .sb-item{justify-content:flex-start;padding:10px 12px;}
  .sidebar.mini:hover .sb-item .ic{width:20px;font-size:1.05rem;}
  .sidebar.mini:hover .sb-area{padding:14px 14px 6px;}
  .sidebar.mini:hover .sb-area-tit{height:auto;border-top:none;margin:0;padding:0 8px 6px;color:#80b3aa;font-size:.68rem;overflow:visible;}
  .sidebar.mini:hover .sb-user{justify-content:flex-start;}
  .sidebar.mini:hover .sb-item .pend{position:static;transform:none;margin-left:auto;}
  .sidebar{transition:width .18s ease;}

  /* sidebar recolhida */
  .sidebar.mini{width:64px;}
  .sidebar.mini .nome, .sidebar.mini .sb-item .rotulo, .sidebar.mini #userInfo, .sidebar.mini .sb-user .sair{display:none;}
  .sidebar.mini .sb-topo{justify-content:center;padding:18px 0;}
  .sidebar.mini .sb-item{justify-content:center;padding:11px 0;}
  .sidebar.mini .sb-item .ic{width:auto;}
  .sidebar.mini .sb-area{padding:10px 8px 4px;}
  .sidebar.mini .sb-area-tit{height:0;border-top:1px solid rgba(255,255,255,.14);margin:8px 10px;padding:0;overflow:hidden;color:transparent;font-size:0;}
  .sidebar.mini .sb-user{justify-content:center;}
  .sidebar.mini .sb-item .pend{position:absolute;margin:0;transform:translate(14px,-12px);}
  .sidebar.mini .sb-item{position:relative;}
  .btn-toggle{background:rgba(255,255,255,.1);border:none;color:#dff0ec;width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .btn-toggle:hover{background:rgba(255,255,255,.2);}
  .sb-topo{position:relative;}

  @media(max-width:760px){.sidebar{position:fixed;left:-248px;z-index:50;transition:left .2s;}.sidebar.aberta{left:0;}.main{padding:16px;}.topo{padding:14px 16px;}}
</style>
</head>

<script>
  const API = "https://us-central1-operacional-luck.cloudfunctions.net/auth";
  const API_COMPARAR = "https://us-central1-operacional-luck.cloudfunctions.net/comparar";
  const API_FECHAR = "https://us-central1-operacional-luck.cloudfunctions.net/fechar";
  const API_ESCALA = "https://us-central1-operacional-luck.cloudfunctions.net/escala";
  const API_PLANO = "https://us-central1-operacional-luck.cloudfunctions.net/plano";
  let USUARIO = null;

  async function chamar(acao, dados){
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({acao, token: USUARIO&&USUARIO.token, ...dados})});
    const j = await r.json();
    sessaoExpirou(j);
    return j;
  }
  // se a sessão venceu (12h), volta para a tela de login
  function sessaoExpirou(j){
    if(j && j.sair && USUARIO){ sair(); msg("Sua sessão expirou. Entre de novo.","erro"); return true; }
    return false;
  }
  function msg(txt, tipo){ const m=document.getElementById("msgAcesso"); m.textContent=txt; m.className="msg "+tipo; }
  function mostrarCadastro(){ document.getElementById("formLogin").style.display="none"; document.getElementById("formCadastro").style.display="block"; msg("",""); }
  function mostrarLogin(){ document.getElementById("formCadastro").style.display="none"; document.getElementById("formLogin").style.display="block"; msg("",""); }

  async function fazerCadastro(){
    const nome=cadNome.value.trim(), email=cadEmail.value.trim(), senha=cadSenha.value;
    if(!nome||!email||!senha){ msg("Preencha todos os campos.","erro"); return; }
    btnCad.disabled=true; btnCad.textContent="Criando...";
    const r=await chamar("cadastrar",{nome,email,senha});
    btnCad.disabled=false; btnCad.textContent="Criar acesso";
    if(r.ok){ msg("Acesso criado! Aguarde a aprovação da coordenação para entrar.","ok"); mostrarLogin(); }
    else msg(r.erro||"Erro ao criar acesso.","erro");
  }
  async function fazerLogin(){
    const email=loginEmail.value.trim(), senha=loginSenha.value;
    if(!email||!senha){ msg("Informe e-mail e senha.","erro"); return; }
    btnLogin.disabled=true; btnLogin.textContent="Entrando...";
    const r=await chamar("login",{email,senha});
    btnLogin.disabled=false; btnLogin.textContent="Entrar";
    if(r.ok&&r.trocarSenha){ USUARIO=r; abrirTrocaSenha(senha,true); }
    else if(r.ok){ USUARIO=r; iniciarApp(); }
    else msg(r.erro||"Erro ao entrar.","erro");
  }
  function sair(){ if(AVISOS_TIMER){ clearInterval(AVISOS_TIMER); AVISOS_TIMER=null; } PLANO.avisos=[]; pararAcompanhamento(); USUARIO=null; document.getElementById("app").classList.remove("ativo"); document.getElementById("telaAcesso").style.display="flex"; loginSenha.value=""; }

  function iniciarApp(){
    document.getElementById("telaAcesso").style.display="none";
    document.getElementById("app").classList.add("ativo");
    document.getElementById("userAv").textContent=(USUARIO.nome||"?").charAt(0).toUpperCase();
    document.getElementById("userInfo").innerHTML=(USUARIO.nome||USUARIO.email)+"<br><span style='color:#9fc9c1;font-size:.68rem;'>"+(USUARIO.admin?"Admin · vê tudo":"Acesso liberado")+"</span>";
    montarMenu();
    aplicarPrefSidebar();
    if(AVISOS_TIMER) clearInterval(AVISOS_TIMER);
    if(USUARIO.admin||(USUARIO.areas||[]).includes("central")){ atualizarAvisosPlano(); AVISOS_TIMER=setInterval(atualizarAvisosPlano,60000); }
  }

  function montarMenu(){
    const sb=document.getElementById("sbScroll"); sb.innerHTML="";
    for(const chave of USUARIO.areas){
      const area=ABAS[chave]; if(!area) continue;
      const bloco=document.createElement("div"); bloco.className="sb-area";
      bloco.innerHTML='<div class="sb-area-tit">'+area.nome+'</div>';
      for(const it of area.itens){
        const d=document.createElement("div"); d.className="sb-item";
        d.innerHTML='<span class="ic">'+it.ic+'</span> <span class="rotulo">'+it.nome+'</span> <span class="pend" id="selo-'+it.id+'" style="display:none"></span>';
        d.onclick=()=>abrir(it.id, it.nome, area.nome, d);
        bloco.appendChild(d);
      }
      sb.appendChild(bloco);
    }
    // aba Usuários só para admin
    if(USUARIO.admin){
      const bloco=document.createElement("div"); bloco.className="sb-area";
      bloco.innerHTML='<div class="sb-area-tit">Administração</div>';
      const d=document.createElement("div"); d.className="sb-item";
      d.innerHTML='<span class="ic"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"/></svg></span> <span class="rotulo">Usuários</span> <span class="pend" id="pendBadge"></span>';
      d.onclick=()=>abrir("admin-usuarios","Usuários","Administração",d);
      bloco.appendChild(d); sb.appendChild(bloco);
      atualizarPendentes();
    }
    // abre a primeira aba
    const primeiro=sb.querySelector(".sb-item"); if(primeiro) primeiro.click();
  }

  async function atualizarPendentes(){
    try{ const r=await chamar("contar",{}); const b=document.getElementById("pendBadge");
      if(b && r.ok && r.pendentes>0){ b.textContent=r.pendentes; b.style.display="inline-block"; }
      else if(b){ b.style.display="none"; }
    }catch(e){}
  }

  function abrir(id, nome, area, el){
    document.querySelectorAll(".sb-item").forEach(i=>i.classList.remove("ativo"));
    if(el) el.classList.add("ativo");
    document.getElementById("tituloPg").textContent=nome;
    document.getElementById("areaBadge").textContent=area;
    const m=document.getElementById("mainConteudo");
    pararAcompanhamento(); FECHAR_AREA=null;
    if(id==="admin-usuarios"){ renderUsuarios(m); return; }
    if(id==="rec-comparador"){ renderComparador(m); return; }
    if(id.endsWith("-fechar")){ renderFechar(m, id.replace("-fechar","")); return; }
    if(id==="cen-contatos"){ renderContatos(m); return; }
    if(id==="cen-pagamentos"){ renderPagamentos(m); return; }
    if(id==="porto-escala"||id==="cen-escala"){ renderEscala(m,"guias"); return; }
    if(id==="porto-passeios"||id==="cen-passeios"){ renderPlano(m, id==="cen-passeios"?"central":"porto"); return; }
    // demais abas: em breve (preencheremos uma a uma)
    m.innerHTML='<div class="em-breve"><div class="ic">🛠️</div><h3>'+nome+'</h3><p>Esta função será ativada em breve. Estamos construindo o sistema por partes.</p></div>';
  }


  // ---- Comparador de escalas ----
  function hojeISO(){ const d=new Date(Date.now()-3*3600*1000); return d.toISOString().slice(0,10); }
  function renderComparador(m){
    m.innerHTML=`
      <div class="barra-busca">
        <input type="date" id="compData" value="${hojeISO()}" style="flex:0;">
        <button class="btn" id="btnConferir" onclick="rodarComparador()">🔄 Conferir agora</button>
        <span id="compInfo" style="font-size:.8rem;color:var(--muted);"></span>
      </div>
      <div id="compResultado"></div>`;
  }
  const TAGS_DIV = {
    HORARIO:{txt:"Horário",cls:"horario"}, APR_INI_FINAL:{txt:"Apr. ini ≠ final",cls:"horario"},
    CANCELADO:{txt:"Cancelado?",cls:""}, DISPENSADO:{txt:"Dispensou",cls:"horario"}, SO_NA_ORDEM:{txt:"Só na ordem",cls:""}, SO_NO_MAPA:{txt:"Só no Mapa",cls:""},
  };
  async function rodarComparador(){
    const data=document.getElementById("compData").value;
    const btn=document.getElementById("btnConferir");
    const info=document.getElementById("compInfo");
    const res=document.getElementById("compResultado");
    if(!data) return;
    btn.disabled=true; btn.textContent="Conferindo..."; info.textContent="Lendo o Phoenix, um momento..."; res.innerHTML="";
    try{
      const r=await fetch(API_COMPARAR,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data, token:USUARIO.token})});
      const j=await r.json();
      if(sessaoExpirou(j)) return;
      btn.disabled=false; btn.textContent="🔄 Conferir agora";
      if(!j.ok){ info.textContent=""; res.innerHTML='<div class="card" style="color:var(--alerta)">'+(j.erro||"Erro ao conferir.")+'</div>'; return; }
      const d=new Date(); info.textContent="Conferido às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      let html='<div class="cards-resumo">'
        +'<div class="resumo"><div class="num">'+j.escalados+'</div><div class="lbl">Escalados conferidos</div></div>'
        +'<div class="resumo ok"><div class="num">'+Math.max(0,j.escalados-j.comDivergencia)+'</div><div class="lbl">Sem divergência</div></div>'
        +'<div class="resumo alerta"><div class="num">'+j.comDivergencia+'</div><div class="lbl">Com divergência</div></div>'
        +'</div>';
      const motoristas=Object.keys(j.porMotorista).sort();
      if(motoristas.length===0){
        html+='<div class="em-breve"><div class="ic">✅</div><h3>Tudo batendo!</h3><p>Nenhuma divergência entre o Mapa de Serviço e a Ordem de Serviço neste dia (entre os serviços escalados).</p></div>';
      } else {
        html+='<h3 style="font-size:1rem;color:var(--tinta);margin:4px 0 12px;">Divergências por motorista</h3>';
        for(const mot of motoristas){
          const lista=j.porMotorista[mot];
          html+='<div class="mot-bloco"><div class="mot-cab">🚐 '+mot+' <span class="mot-count">'+lista.length+'</span></div>';
          for(let i=0;i<lista.length;i++){
            const dv=lista[i];
            const t=TAGS_DIV[dv.tipo]||{txt:dv.tipo,cls:""};
            const id="dv_"+mot.replace(/\W/g,"")+"_"+i;
            html+='<div class="div-item '+t.cls+'" id="'+id+'" onclick="toggleDetalhe(this)">'
              +'<span class="tag">'+t.txt+'</span>'
              +'<div class="corpo"><div class="rec">'+dv.rec+(dv.servico?" · "+dv.servico:"")+'</div>'
              +'<div class="det">'+dv.detalhe+'</div>'
              +(dv.obs && dv.tipo!=="DISPENSADO"?'<div class="det" style="margin-top:4px;color:var(--tinta);">📝 <b>Obs.:</b> '+esc(dv.obs)+'</div>':'')
              +'<div class="detalhe-extra">'
                +(dv.cliente?'<div><b>Cliente:</b> '+dv.cliente+'</div>':'')
                +(dv.guia?'<div><b>Guia:</b> '+dv.guia+'</div>':'')
                +(dv.extra?'<div><b>Info:</b> '+dv.extra+'</div>':'')
              +'</div></div>'
              +'<button class="btn-check" onclick="event.stopPropagation();marcarVerificado(this)" title="Marcar como verificado">✓</button>'
              +'</div>';
          }
          html+='</div>';
        }
      }
      res.innerHTML=html;
    }catch(e){
      btn.disabled=false; btn.textContent="🔄 Conferir agora"; info.textContent="";
      res.innerHTML='<div class="card" style="color:var(--alerta)">Erro de conexão. Tente de novo.</div>';
    }
  }
  function toggleDetalhe(el){ el.classList.toggle("aberto"); }
  function marcarVerificado(btn){ const item=btn.closest(".div-item"); item.classList.toggle("verificado"); }


  // ---- Fechar escalas (aciona o robô do Phoenix) ----
  let FECHAR_TIMER=null, FECHAR_AREA=null;
  function pararAcompanhamento(){ if(FECHAR_TIMER){ clearInterval(FECHAR_TIMER); FECHAR_TIMER=null; } if(typeof PLANO!=="undefined"&&PLANO.timer){ clearInterval(PLANO.timer); PLANO.timer=null; } }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function dataBR(iso){ const [a,m,d]=String(iso).split("-"); return d+"/"+m+"/"+a; }
  function horaBR(ms){ return ms? new Date(ms).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—"; }
  async function chamarFechar(acao, dados){
    const r=await fetch(API_FECHAR,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao, token:USUARIO.token, ...dados})});
    const j=await r.json(); sessaoExpirou(j); return j;
  }
  function renderFechar(m, area){
    FECHAR_AREA=area;
    m.innerHTML=`
      <div class="card">
        <h3 style="margin-bottom:6px;">Fechar escalas no Phoenix</h3>
        <p style="font-size:.85rem;color:var(--muted);margin-bottom:14px;" id="fecharRotulo">Carregando...</p>
        <div class="barra-busca">
          <input type="date" id="fecharData" style="flex:0;">
          <button class="btn" id="btnFechar" onclick="pedirFechamento()">🔒 Fechar escalas</button>
          <span id="fecharInfo" style="font-size:.8rem;color:var(--muted);"></span>
        </div>
        <p style="font-size:.78rem;color:var(--muted);margin-top:10px;">O robô clica em Iniciar e Executar em cada serviço dessa área. Com muitos serviços leva de 10 a 30 minutos; pode fechar esta tela que ele continua.</p>
      </div>
      <div id="fecharLista"></div>`;
    atualizarFechar(true);
  }
  async function atualizarFechar(primeira){
    const area=FECHAR_AREA; if(!area) return;
    let j; try{ j=await chamarFechar("status",{area}); }catch(e){ return; }
    if(area!==FECHAR_AREA) return;
    const lista=document.getElementById("fecharLista"); if(!lista) { pararAcompanhamento(); return; }
    if(!j.ok){ lista.innerHTML='<div class="card" style="color:var(--alerta)">'+esc(j.erro||"Erro ao carregar.")+'</div>'; return; }
    document.getElementById("fecharRotulo").textContent="Esta área fecha: "+j.rotulo+".";
    const inp=document.getElementById("fecharData");
    if(primeira){ inp.value=j.ontem; inp.max=j.ontem; }
    const rodando=j.lista.some(x=>(x.status==="enviado"||x.status==="rodando") && Date.now()-x.criadoEm<2*3600e3);
    const btn=document.getElementById("btnFechar");
    btn.disabled=rodando; btn.textContent=rodando?"⏳ Fechando...":"🔒 Fechar escalas";
    if(!j.lista.length){ lista.innerHTML='<div class="em-breve"><div class="ic">🔒</div><h3>Nenhum fechamento ainda</h3><p>Escolha a data e clique em Fechar escalas.</p></div>'; }
    else lista.innerHTML='<h3 style="font-size:1rem;color:var(--tinta);margin:4px 0 12px;">Últimos fechamentos</h3>'+j.lista.map(cardFechamento).join("");
    pararAcompanhamento();
    if(rodando) FECHAR_TIMER=setInterval(()=>atualizarFechar(false),20000);
  }
  function cardFechamento(x){
    const parado=(x.status==="enviado"||x.status==="rodando") && Date.now()-x.criadoEm>=2*3600e3;
    const ST={enviado:["⏳ Na fila","var(--muted)"], rodando:["🔄 Fechando","var(--verde)"], concluido:["✅ Concluído","var(--ok)"], erro:["⚠️ Com erro","var(--alerta)"]};
    const [txt,cor]=parado?["❓ Sem resposta","var(--alerta)"]:(ST[x.status]||[x.status,"var(--muted)"]);
    let corpo='';
    if(x.status==="concluido"||x.status==="erro"){
      if(x.pendentesAntes!=null) corpo+='<div style="font-size:.85rem;margin-top:8px;"><b>'+x.executados+'</b> de <b>'+x.pendentesAntes+'</b> serviços fechados'+(x.sobraram?' · <span style="color:var(--alerta)"><b>'+x.sobraram+'</b> ainda com botão</span>':' · nada pendente')+'</div>';
      if(x.erro) corpo+='<div style="font-size:.82rem;color:var(--alerta);margin-top:6px;">'+esc(x.erro)+'</div>';
      const det=[...(x.sobrou||[]).map(s=>"Pendente: "+s), ...(x.erros||[]).map(s=>"Erro: "+s)];
      if(det.length) corpo+='<details style="margin-top:8px;font-size:.8rem;"><summary style="cursor:pointer;color:var(--verde);">Ver detalhes ('+det.length+')</summary><div style="margin-top:6px;line-height:1.6;">'+det.map(esc).join("<br>")+'</div></details>';
    } else if(x.status==="rodando"){
      corpo='<div style="font-size:.82rem;color:var(--muted);margin-top:8px;">O robô está clicando nos serviços. Esta tela atualiza sozinha.</div>';
    } else if(x.status==="enviado" && !parado){
      corpo='<div style="font-size:.82rem;color:var(--muted);margin-top:8px;">Aguardando o robô começar (costuma levar até 1 minuto).</div>';
    }
    const link=x.linkExecucao && USUARIO.admin ? ' · <a href="'+esc(x.linkExecucao)+'" target="_blank" style="color:var(--verde);">ver no GitHub</a>' : '';
    return '<div class="card" style="padding:14px 18px;"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">'
      +'<b>'+dataBR(x.data)+'</b><span style="font-size:.78rem;font-weight:700;color:'+cor+';">'+txt+'</span>'
      +'<span style="margin-left:auto;font-size:.75rem;color:var(--muted);">por '+esc(x.solicitante)+' em '+horaBR(x.criadoEm)+link+'</span></div>'+corpo+'</div>';
  }
  async function pedirFechamento(){
    const data=document.getElementById("fecharData").value;
    if(!data) return;
    if(!confirm("Fechar as escalas de "+dataBR(data)+" desta área no Phoenix?\n\nO robô vai clicar em Iniciar e Executar em todos os serviços pendentes.")) return;
    const btn=document.getElementById("btnFechar"), info=document.getElementById("fecharInfo");
    btn.disabled=true; btn.textContent="Enviando...";
    try{
      const j=await chamarFechar("pedir",{area:FECHAR_AREA, data});
      if(!j.ok){ info.textContent=""; alert(j.erro||"Erro ao enviar."); btn.disabled=false; btn.textContent="🔒 Fechar escalas"; return; }
      info.textContent="Pedido enviado!";
      setTimeout(()=>{ if(info) info.textContent=""; },4000);
      atualizarFechar(false);
    }catch(e){ alert("Erro de conexão. Tente de novo."); btn.disabled=false; btn.textContent="🔒 Fechar escalas"; }
  }


  // ---- Escala do dia (Escala dos guias / Passeios) ----
  const ESC = { cache:{}, modo:"guias", data:null, tipo:"todos", regiao:"todas", busca:"" };
  function regiaoServ(nome){
    const n=String(nome||"").toUpperCase(); const p=n.match(/\(([^()]*)\)\s*$/); const o=p?p[1]:n;
    if(o.includes("GALINHAS")) return "porto";
    if(o.includes("BOA VIAGEM")||o.includes("PIEDADE")||o.includes("RECIFE")||o.includes("CABO")||o.includes("CENTRO")) return "recife";
    return "outros";
  }
  const nomePasseio = (s)=>String(s||"PASSEIO").replace(/\*[^*]*\*/g," ").replace(/\s+/g," ").trim();
  const normVeic = (s)=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  function renderEscala(m, modo){
    ESC.modo=modo; if(!ESC.data) ESC.data=hojeISO();
    const chips=(grupo,ops,atual)=>ops.map(([v,t])=>'<span class="chip '+(atual===v?"on":"")+'" onclick="escFiltro(\''+grupo+'\',\''+v+'\')">'+t+'</span>').join("");
    m.innerHTML=`
      <div class="barra-busca" style="flex-wrap:wrap;gap:8px;">
        <input type="date" id="escData" value="${ESC.data}" style="flex:0;" onchange="ESC.data=this.value;carregarEscala(true)">
        <button class="btn sec" onclick="carregarEscala(true)">🔄 Atualizar</button>
        <input type="search" id="escBusca" placeholder="${modo==="guias"?"Buscar guia...":"Buscar passeio ou guia..."}" value="${esc(ESC.busca)}" oninput="ESC.busca=this.value;desenharEscala()" style="max-width:220px;">
        <span id="escInfo" style="font-size:.8rem;color:var(--muted);"></span>
        ${modo==="passeios"&&PLANO.area?'<button class="btn" style="margin-left:auto" onclick="renderPlano(document.getElementById(\'mainConteudo\'),PLANO.area)">📝 Voltar ao planejamento</button>':''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;">
        ${chips("regiao",[["todas","Todas as saídas"],["porto","Porto de Galinhas"],["recife","Recife / Cabo"]],ESC.regiao)}

  // ---- Planejamento dos passeios (carros por passeio + guia) ----
  const TIPOS_CARRO=["Bus","Micrão","Mini","Van","Carro"];
  const IDIOMAS_CARRO=["","Espanhol","Inglês","Bilíngue"];
  const tipoCarro=(t)=>({"Ônibus":"Bus","Micro":"Mini"}[t]||t);
  const idiomaCarro=(c)=>c.idioma||(c.bilingue?"Bilíngue":"");
  function tipoPorPax(n){ return n<=4?"Carro":n<=15?"Van":n<=30?"Mini":"Bus"; }
  // Lê a mensagem do WhatsApp que Porto já manda hoje, ex.:
  //  "Carneiros: 3 Bus + 1 Mini" · "City : 1 Bus + 1 Van (ESPANHOL)" · "Maragogi Extra: 4 Bus"
  //  "Maragogi PVT: 933679 - 13 PAX'S" · "São Jose HORÁRIO ESPECIAL: 1 Bus + 1 Mini"
  function lerMensagem(txt, saida){
    const TIPO={BUS:"Bus",ONIBUS:"Bus",MINI:"Mini",MICRO:"Mini",MICRAO:"Micrão",VAN:"Van",CARRO:"Carro",SUV:"Carro",SEDAN:"Carro"};
    const semAcento=(s)=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
    const idiomaDe=(s)=>{ s=semAcento(s); return /ESP/.test(s)?"Espanhol":/ING|ENG/.test(s)?"Inglês":/BIL/.test(s)?"Bilíngue":""; };
    const mapa={}, ordem=[], naoEntendi=[];
    const pegar=(nome,obs)=>{ const k=nome+"|"+obs; if(!mapa[k]){ mapa[k]={nome,obs,saida,carros:[]}; ordem.push(k); } return mapa[k]; };
    for(let linha of String(txt||"").split(/\r?\n/)){
      linha=linha.replace(/^\[[^\]]*\]\s*[^:]{1,40}:\s*/,"").replace(/[*_~]/g,"").replace(/\s+\d{1,2}:\d{2}\s*$/,"").trim();
      if(!linha) continue;
      const i=linha.indexOf(":"); if(i<1){ naoEntendi.push(linha); continue; }
      const cab=linha.slice(0,i).trim().toUpperCase(), cabS=semAcento(cab), resto=linha.slice(i+1).trim();
      const pvt=/\bPVT\b|PRIVATIV/.test(cabS);
      let obs=""; if(/\bEXTRA\b/.test(cabS)) obs="EXTRA"; if(/HORARIO\s+ESPECIAL/.test(cabS)) obs="HORÁRIO ESPECIAL";
      const nome=cab.replace(/\bPVT\b|PRIVATIV[OA]S?|\bEXTRA\b|HOR[ÁA]RIO\s+ESPECIAL/g," ").replace(/\s+/g," ").trim();
      if(!nome){ naoEntendi.push(linha); continue; }
      if(pvt){
        const res=(resto.match(/\d{4,8}(?:\.\d+)?/)||[])[0]||"";
        const pax=parseInt((resto.match(/(\d+)\s*pax/i)||[])[1],10)||0;
        pegar(nome,obs).carros.push({tipo:tipoPorPax(pax||10),idioma:idiomaDe(resto),privativo:{reserva:res,pax}});
        continue;
      }
      let achou=false;
      for(const parte of resto.split("+")){
        const m=parte.trim().match(/^(\d+)\s*([A-Za-zÀ-ú]+)\s*(?:\(([^)]*)\))?/);
        if(!m) continue;
        const tipo=TIPO[semAcento(m[2])];
        if(!tipo) continue;
        achou=true;
        for(let k=0;k<Math.min(30,+m[1]);k++) pegar(nome,obs).carros.push({tipo,idioma:idiomaDe(m[3]),privativo:null});
      }
      if(!achou) naoEntendi.push(linha);
    }
    return { passeios:ordem.map(k=>mapa[k]), naoEntendi };
  }

  // ---- Envio pelo WhatsApp (escala dos guias / aviso dos passeios) + contatos ----
  const API_ENVIOS = "https://us-central1-operacional-luck.cloudfunctions.net/envios";
  const ENV={ contatos:null, enviados:{}, carregando:{} };
  const RODAPE="\n\n_Sujeito a mudanças._";
  const normGuia=(s)=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[-–]?\s*GUIA\s*$/,"").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
  function assinatura(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
  async function chamarEnvios(acao,dados){
    const r=await fetch(API_ENVIOS,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,...dados})});
    const j=await r.json(); sessaoExpirou(j); return j;
  }
  const envPrecisaCarregar=(data)=>(!ENV.contatos||!ENV.enviados[data])&&!ENV.carregando[data];
  async function envCarregar(data){
    ENV.carregando[data]=true;
    try{
      const [c,e]=await Promise.all([ENV.contatos?null:chamarEnvios("contatos",{}), chamarEnvios("enviados",{data})]);
      if(c&&c.ok){ ENV.contatos=c.contatos; preencherGuias(); }
      if(e&&e.ok) ENV.enviados[data]=e.envios;
    }finally{ ENV.carregando[data]=false; }
  }
  function contatoDe(nome){
    const n=normGuia(nome);
    return (ENV.contatos||[]).find(c=>normGuia(c.nome)===n||(c.apelidos||[]).some(a=>normGuia(a)===n))||null;
  }
  function envioDe(data,tipo,guia){ return (ENV.enviados[data]||[]).find(e=>e.tipo===tipo&&normGuia(e.guia)===normGuia(guia))||null; }
  function statusEnvio(data,tipo,guia,mensagem){
    const e=envioDe(data,tipo,guia); if(!e) return '';
    const hora=new Date(e.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    const mudou=mensagem&&e.hash&&e.hash!==assinatura(mensagem);
    return '<span title="Enviado por '+esc(e.por)+'" style="font-size:.72rem;font-weight:600;white-space:nowrap;color:'+(mudou?'var(--aviso)':'var(--ok)')+'">'+(mudou?'⚠️ mudou desde o envio':'✓ enviado '+hora)+'</span>';
  }

  // ---- mensagens ----
  const entraNaEscala=(l)=>l.tipo!=="TOUR"||l.auxiliar;
  function msgEscala(g, data){
    const hora=(l)=>(l.apresentacao||l.inicio||"99:99");
    const itens=g.itens.filter(entraNaEscala).slice().sort((a,b)=>hora(a).localeCompare(hora(b)));
    return '🗓️ *Escala de '+dataBR(data)+' – '+g.nome.toUpperCase()+'*\n\n'
      +itens.map(l=>'*'+(l.tipo==="TOUR"?'Apoio – ':'')+nomePasseio(l.servico)+'*\n'
        +(l.apresentacao?'⏰ Apresentação: *'+l.apresentacao+'*'+(l.inicio&&l.inicio!=="00:00"&&l.inicio!==l.apresentacao?' (início '+l.inicio+')':''):'⏰ Início: *'+horaTxt(l.inicio)+'*')
        +'\n🚐 '+(l.veiculo||"-")+(l.motorista?' · Mot. '+l.motorista:'')+(l.pax!=null?' · '+l.pax+' pax':'')).join('\n\n')
      +RODAPE;
  }
  function msgPasseio(guia, carros, data){
    const quando=data===amanhaISO()?"Amanhã, "+dataBR(data):"Dia "+dataBR(data);
    return '🏖️ *'+quando+'*\n\n'
      +carros.map(x=>'Você está no *'+x.p.nome+'*'+(x.p.obs?' ('+x.p.obs+')':'')+'\nCarro '+x.n+' · '+tipoCarro(x.c.tipo)+(idiomaCarro(x.c)?' · '+idiomaCarro(x.c).toLowerCase():'')+(x.c.privativo?' · PVT '+(x.c.privativo.reserva||'')+(x.c.privativo.pax?' ('+x.c.privativo.pax+' pax)':''):'')).join('\n\n')
      +'\n\nA escala completa segue mais tarde.'+RODAPE;
  }
  function botaoEscalaGuia(g){
    if(!g.itens.some(entraNaEscala)) return '';
    const m=msgEscala(g,ESC.data);
    return statusEnvio(ESC.data,"escala",g.nome,m)+'<button class="btn mini sec" style="padding:3px 9px" title="Enviar escala no WhatsApp" onclick="enviarEscalaGuia(\''+esc(g.nome).replace(/'/g,"\\'")+'\')">📲</button>';

  function enviarEscalaGuia(nome){

  function avisarPasseios(passeioId){
    const ps=(PLANO.plano.passeios||[]).filter(p=>passeioId?p.id===passeioId:(PLANO.saida==="todas"||p.saida===PLANO.saida));
    const por={};

    const itens=Object.values(por).map(x=>({guia:x.guia,mensagem:msgPasseio(x.guia,x.carros,PLANO.data)}));

  // ---- janela de confirmação do envio ----
  async function abrirEnvio(tipo,data,itens,depois){

  function fecharEnvio(){ const f=document.getElementById("envFundo"); if(f) f.remove(); const d=ENV.janela&&ENV.janela.depois; ENV.janela=null; if(d) d(); }
  function desenharEnvio(){
    const J=ENV.janela, f=document.getElementById("envFundo"); if(!J||!f) return;
    const central=USUARIO.admin||(USUARIO.areas||[]).includes("central");
    const opts=(ENV.contatos||[]).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.nome)+' · '+esc(c.telefone)+'</option>').join("");
    const linhas=J.itens.map((it,i)=>{

  async function dispararEnvio(){
    const J=ENV.janela; if(!J) return;
    const fila=J.itens.filter(it=>contatoDe(it.guia)&&!it.fora&&!it.resultado);
    const b=document.getElementById("envBtn"); if(b){ b.disabled=true; b.textContent="Enviando..."; }
    const prog=document.getElementById("envProgresso");
    const TAM=J.tipo==="pdf"?3:10;
    for(let k=0;k<fila.length;k+=TAM){
      const lote=fila.slice(k,k+TAM);
      if(prog) prog.textContent=(J.tipo==="pdf"?"Gerando PDF no Phoenix e enviando ":"Enviando ")+(k+1)+"–"+(k+lote.length)+" de "+fila.length+"...";
      try{
        const j=await chamarEnvios(J.tipo==="pdf"?"enviarPdf":"enviar",{data:J.data,tipo:J.tipo,itens:lote.map(it=>({guia:it.guia,mensagem:it.mensagem,assinatura:assinatura(it.mensagem),aviso:(J.tipo==="pdf"&&J.reenvio&&J.reenvio.usar&&envioDe(J.data,"pdf",it.guia))?J.reenvio.texto:""}))});
        if(!j.ok){ lote.forEach(it=>it.resultado={ok:false,motivo:j.erro}); }
        else j.resultados.forEach((r,x)=>{ lote[x].resultado=r; });
      }catch(e){ lote.forEach(it=>it.resultado={ok:false,motivo:"erro de conexão"}); }
      if(!ENV.janela) return;
      desenharEnvio();
    }
    delete ENV.enviados[J.data]; await envCarregar(J.data);
    const ok=fila.filter(it=>it.resultado&&it.resultado.ok).length;
    const p2=document.getElementById("envProgresso"); if(p2) p2.innerHTML='<b style="color:'+(ok===fila.length?'var(--ok)':'var(--alerta)')+'">'+ok+' de '+fila.length+' enviados.</b>';
  }

  // ======================= PAGAMENTOS: CONFERÊNCIA DAS NOTAS FISCAIS =======================
  // Tudo roda no navegador: lê a PGG (Excel), o mapa do PAAR (Excel, opcional) e os PDFs das notas,
  // identifica o guia de cada nota e compara o valor com o "VALOR LIQUIDO A PAGAR" da PGG.
    // ---- Leitura de nota fiscal de guia (DANFSe padrão nacional v1/v2 e nota avulsa de prefeitura) ----
  // Recebe o texto do PDF (linhas) e devolve os dados que interessam para a conferência.
  const LUCK_CNPJ = "10866549000117";
  function lerNota(texto) {
    const t = String(texto || "");
    const plano = t.replace(/\s+/g, " ");
    const so = (s) => String(s || "").replace(/\D/g, "");
    const dinheiro = (s) => parseFloat(String(s).replace(/\./g, "").replace(",", "."));
    const r = { tipo: "desconhecido", numero: null, chave: null, emissao: null, competencia: null, periodo: null,
      prestadorDoc: null, prestadorNome: null, luck: false, valor: null, comissao: null, servicos: [], somaServicos: 0, avisos: [] };

    if (/DANFSe/i.test(plano) || /Documento Auxiliar da NFS-e/i.test(plano)) r.tipo = "nfse";
    else if (/NOTA FISCAL AVULSA/i.test(plano)) r.tipo = "avulsa";

    // documentos (CNPJ/CPF) na ordem em que aparecem; o 1º que não é da Luck é o do prestador
    const docs = [...plano.matchAll(/\b(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}|\d{3}\.\d{3}\.\d{3}-\d{2})\b/g)].map((m) => so(m[1]));
    r.luck = docs.includes(LUCK_CNPJ);
    r.prestadorDoc = docs.find((d) => d !== LUCK_CNPJ && d !== "10091536000113") || null; // 2º: CNPJ da prefeitura de Caruaru no cabeçalho

    if (r.tipo === "nfse") {
      const ch = plano.match(/CHAVE DE ACESSO DA NFS-e\s*(\d{40,60})/i); if (ch) r.chave = ch[1];
      const nm = plano.match(/N[ÚU]MERO DA NFS-e\s+COMPET[ÊE]NCIA DA NFS-e\s+DATA E HORA DA EMISS[ÃA]O DA NFS-e\s+(\d+)\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}\/\d{2}\/\d{4})/i);
      if (nm) { r.numero = nm[1]; r.competencia = nm[2]; r.emissao = nm[3]; }
      const nome = plano.match(/Nome \/ Nome Empresarial\s+(?:Munic[íi]pio[^\n]*?CEP\s+|E-mail\s+)?\d{2}\.\d{3}\.\d{3}\s+([A-ZÀ-Ú ]+?)\s{1,}(?:[A-ZÀ-Ú][a-zà-ú]|[A-Z]+@|Recife|Igarassu|Olinda|Jaboat|Ipojuca|Paulista|Cabo|Caruaru|\(|$)/);
      if (nome) r.prestadorNome = nome[1].trim();
    } else if (r.tipo === "avulsa") {
      const nm = plano.match(/N[úu]mero:?\s*(?:Data Emiss[ãa]o:?\s*)?(\d{4,})/i) || plano.match(/\b(\d{6})\b(?=.*Imposto Sobre)/);
      if (nm) r.numero = nm[1];
      const pe = plano.match(/(\d{2}\/\d{2}\/\d{4})\s*(?:PRESTA[ÇC][ÃA]O DE SERVI[ÇC]O\s*)?(?:\d{2}\/\d{2}\/\d{4}\s*)?(?:\d+\s*)?(?:[A-Z]\s*)?(?:PE\s*)*-\s*(\d{2}\/\d{2}\/\d{4})/);
      if (pe) r.periodo = [pe[1], pe[2]];
      const nome = t.match(/Nome\/Raz[ãa]o Social:\s*\n\s*([A-ZÀ-Ú ]{5,})/);
      if (nome) r.prestadorNome = nome[1].trim();
    }

    // valor da nota: o maior valor em reais do documento (é sempre o total da nota)
    const valores = [...plano.matchAll(/(?<![\d.,\/])(\d{1,3}(?:\.\d{3})*,\d{2})(?![\d])/g)].map((m) => dinheiro(m[1])).filter((v) => v > 0);
    if (valores.length) r.valor = Math.max(...valores);

    // descrição dos serviços: trecho entre "Descrição do Serviço" e a tributação (NFS-e) ou a tabela (avulsa)
    let desc = "";
    const d1 = plano.match(/Descri[çc][ãa]o do Servi[çc]o\s+(.*?)\s+(?:TRIBUTA[ÇC][ÃA]O MUNICIPAL|Tipo de Tributa[çc][ãa]o|Prefeitura|$)/i);
    if (r.tipo === "nfse" && d1) desc = d1[1];
    if (r.tipo === "avulsa") { const d2 = plano.match(/Total\s+(1\s+UNI?\b.*?)\s+VALOR TOTAL DA NOTA/i); if (d2) desc = d2[1]; }
    r.descricao = desc;
    const com = desc.match(/COMISS[ÃA]?O?\s*(?:VENDAS[^\d]*\d{2}\/\d{2}\/\d{4}\s*A\s*\d{2}\/\d{2}\/\d{4}\s*)?[^\d$]{0,15}(?:R?\$)?\s*([\d.]+[.,]\d{2})/i);
    if (com) r.comissao = dinheiro(com[1].replace(/\.(\d{2})$/, ",$1"));
    // serviços: data dd/mm(/aaaa) seguida do nome e de um valor
    const reServ = /(\d{2}\/\d{2})(?:\/\d{2,4}|\/20\/26)?\s*([A-ZÀ-Úa-zà-ú][^#\/$]*?|[A-Z]+?)\s*(?:R?\$\s*)?(\d{1,4}(?:,\d{2})?)(?=\s|\/|#|$|,|;|\.|[A-Z]|\*)/g;
    if (desc) {
      const semCom = desc.replace(/COMISS.*$/i, "");
      for (const m of semCom.matchAll(reServ)) {
        const v = dinheiro(m[3].includes(",") ? m[3] : m[3] + ",00");
        if (v > 0 && v < 2000) r.servicos.push({ data: m[1], servico: m[2].replace(/\*/g, "").trim(), valor: v });
      }
      // na nota avulsa o valor aparece duas vezes (unitário e total): conta uma
      r.somaServicos = Math.round(r.servicos.reduce((s, x) => s + x.valor, 0) * 100) / 100;
    }
    if (!r.luck) r.avisos.push("CNPJ da Luck não aparece na nota");
    if (!r.valor) r.avisos.push("Não consegui ler o valor da nota");
    return r;
  }


  const PAG={ pgg:null, paar:[], notas:[], arquivos:{} };
  function carregarScript(src){ return new Promise((ok,erro)=>{ if(document.querySelector('script[src="'+src+'"]')) return ok(); const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>erro(new Error("não carregou "+src)); document.head.appendChild(s); }); }
  async function libsPagamentos(){
    await carregarScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    await carregarScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await carregarScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const normP=(s)=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/-?\s*GUIA\s*$/,"").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const brlP=(v)=>v==null||isNaN(v)?"—":"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const soDig=(s)=>String(s||"").replace(/\D/g,"");
  async function textoPdf(arquivo){
    const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await arquivo.arrayBuffer())}).promise;
    const out=[];
    for(let p=1;p<=doc.numPages;p++){
      const tc=await (await doc.getPage(p)).getTextContent(); const linhas={};
      for(const it of tc.items){ const y=Math.round(it.transform[5]); (linhas[y]=linhas[y]||[]).push([it.transform[4],it.str]); }
      Object.keys(linhas).sort((a,b)=>b-a).forEach(y=>out.push(linhas[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ")));
    }
    return out.join("\n");
  }
  async function lerPGG(arquivo){
    const wb=XLSX.read(await arquivo.arrayBuffer());
    const ws=wb.Sheets[wb.SheetNames[0]];
    const linhas=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    const periodo=String((linhas[0]||[])[0]||"");
    const num=(v)=>v==null||v===""?null:(typeof v==="number"?v:parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",",".")));
    const rows=[];
    for(const r of linhas.slice(1)){
      const nome=String(r[0]||"").trim(); if(!nome||/^TOTAL/i.test(nome)) continue;
      rows.push({nome, serv:num(r[1]), com:num(r[2]), reemb:num(r[3]), maq:num(r[4]), liq:num(r[5]), reembCli:num(r[6]), obs:r[7]||""});
    }
    return {periodo, rows};
  }
  async function lerPAAR(arquivo){
    const wb=XLSX.read(await arquivo.arrayBuffer()); const lista=[];
    for(const n of wb.SheetNames){
      const linhas=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true});
      const cab=String((linhas[1]||[])[0]||"");
      const doc=(cab.match(/CNPJ\/CPF:\s*([\d.\/-]+)/)||[])[1]; const razao=(cab.match(/Raz[ãa]o Social:\s*(.+)$/)||[])[1]||"";
      lista.push({nome:String((linhas[0]||[])[0]||n).replace(/^Guia:\s*/,""), doc:soDig(doc), razao:razao.trim()});
    }
    return lista;
  }
  // o nome curto da PGG ("BRUNO M", "H.FARIAS") bate com um nome completo se cada pedaço for o começo de uma palavra dele
  function nomeBate(curto,completo){
    const a=normP(curto).split(" ").filter(Boolean), b=normP(completo).split(" ").filter(Boolean);
    if(!a.length||!b.length) return false;
    const usadas=new Set();
    return a.every(t=>{ const i=b.findIndex((w,k)=>!usadas.has(k)&&w.startsWith(t)); if(i<0) return false; usadas.add(i); return true; });
  }
  // PAAR que corresponde à nota: mesmo CNPJ/CPF ou mesma razão social do prestador
  function paarDaNota(n){
    const nome=normP(n.prestadorNome);
    return PAG.paar.filter(p=>(p.doc&&p.doc===n.prestadorDoc)||(nome&&normP(p.razao).replace(/^\d+\s*/,"")===nome));
  }
  function identificarGuia(n){
    const rows=PAG.pgg?PAG.pgg.rows:[];
    const hits=paarDaNota(n);
    const escolher=(c)=>{
      if(c.length>1){ const comValor=c.filter(r=>(r.liq||0)>0); if(comValor.length) c=comValor; }
      if(c.length>1){ const mais=Math.max(...c.map(r=>normP(r.nome).split(" ").length)); c=c.filter(r=>normP(r.nome).split(" ").length===mais); }
      return c.length===1?c[0].nome:null;
    };
    // 1) nome igual à aba do PAAR; 2) nome curto da PGG bate com a aba do PAAR; 3) bate com o nome da nota
    let c=rows.filter(r=>hits.some(p=>normP(p.nome)===normP(r.nome)));
    if(!c.length) c=rows.filter(r=>hits.some(p=>nomeBate(r.nome,p.nome)));
    if(!c.length) c=rows.filter(r=>n.prestadorNome&&nomeBate(r.nome,n.prestadorNome));
    return escolher(c);
  }
  function conferirNota(n){
    const g=PAG.pgg&&PAG.pgg.rows.find(r=>r.nome===n.guia);
    const ok=[], prob=[], info=[];
    if(!n.valor) prob.push("não consegui ler o valor");
    if(!n.luck) prob.push("CNPJ da Luck não aparece na nota");
    if(!g){ prob.push("guia não identificado: escolha na lista"); return {ok,prob,info,dif:null}; }
    let dif=null;
    if(g.liq==null||g.liq===0) prob.push("PGG sem valor líquido (comissão ainda não lançada?)");
    else { dif=Math.round((n.valor-g.liq)*100)/100; if(Math.abs(dif)<0.01) ok.push("valor bate com a PGG"); else prob.push("valor "+(dif>0?"acima":"abaixo")+" da PGG em "+brlP(Math.abs(dif))); }
    const cad=paarDaNota(n)[0]||PAG.paar.find(p=>normP(p.nome)===normP(g.nome));
    if(cad&&cad.doc&&n.prestadorDoc){
      if(cad.doc===LUCK_CNPJ) info.push("cadastro do PAAR está com o CNPJ da Luck");
      else if(cad.doc===n.prestadorDoc) ok.push("CNPJ igual ao cadastro");
      else if(cad.doc.length===11&&n.prestadorDoc.length===14) info.push("cadastro do PAAR com CPF; nota com CNPJ do MEI");
      else prob.push("CNPJ/CPF da nota diferente do cadastro no PAAR");
    }
    if(n.servicos.length&&g.serv!=null&&Math.abs(n.somaServicos-g.serv)>0.01) info.push("serviços da descrição somam "+brlP(n.somaServicos)+"; PGG: "+brlP(g.serv));
    if(n.comissao!=null&&g.com!=null&&Math.abs(n.comissao-g.com)>0.01) info.push("comissão na nota "+brlP(n.comissao)+"; PGG: "+brlP(g.com));
    if(n.tipo==="avulsa") info.push("nota avulsa da prefeitura (não é MEI)");
    // nota de outro período (ex.: nota antiga enviada por engano)
    const mesPgg=((PAG.pgg.periodo||"").match(/\d{1,2}\s*A\s*\d{1,2}\/(\d{1,2})/i)||[])[1];
    const dataNota=n.competencia||(n.periodo&&n.periodo[0])||n.emissao;
    if(mesPgg&&dataNota){ const [,mm,aa]=dataNota.split("/"); const atual=new Date().getFullYear();
      const distancia=Math.abs((+aa-atual)*12+(+mm-(+mesPgg)));
      if(distancia>1) prob.push("nota de outro período (competência "+mm+"/"+aa+")"); }
    const dup=PAG.notas.filter(x=>x!==n&&x.numero&&x.numero===n.numero&&x.prestadorDoc===n.prestadorDoc);
    if(dup.length) prob.push("nota repetida");
    return {ok,prob,info,dif};
  }

  async function lerMapaPAAR(arquivo){
    const wb=XLSX.read(await arquivo.arrayBuffer()); const guias=[]; let periodo=null;
    for(const n of wb.SheetNames){
      const L=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true});
      const cab=String((L[1]||[])[0]||"");
      const per=cab.match(/(\d{4}-\d{2}-\d{2})\s*a\s*(\d{4}-\d{2}-\d{2})/); if(per&&!periodo) periodo=[per[1],per[2]];
      const linhas=[];
      for(const r of L.slice(4)){
        if(!r||!r[0]||String(r[0]).startsWith("VALOR")) continue;
        linhas.push({data:String(r[0]).slice(0,10),hora:String(r[1]||""),ro:String(r[2]||""),modo:String(r[3]||""),servico:String(r[4]||""),veiculo:String(r[5]||""),motorista:String(r[6]||"").trim(),valor:typeof r[11]==="number"?r[11]:parseFloat(r[11])||0});
      }
      guias.push({nome:String((L[0]||[])[0]||n).replace(/^Guia:\s*/,"").replace(/\s*-\s*GUIA\s*$/i,"").trim(),doc:soDig((cab.match(/CNPJ\/CPF:\s*([\d.\/-]+)/)||[])[1]),linhas});

  function catMapa(s){ const S=String(s).toUpperCase();
    if(/APOIO/.test(S)) return /VOLTA/.test(S)?"apoio-volta":"apoio-ida";
    if(/^IN\b/.test(S)) return "chegada"; if(/^OUT\b/.test(S)) return "saida";
    if(/^(TRF|TRANSFER)\b|TRANSFER/.test(S)) return "trf"; return "passeio"; }
  function catRel(s){ s=String(s||"");
    if(s.startsWith("chegada")) return "chegada"; if(s.startsWith("saida")) return "saida";
    if(s==="apoio-recife-tarde") return "apoio-volta"; if(s.startsWith("apoio")) return "apoio";
    if(s==="passeio") return "passeio"; if(s==="so-vendas"||!s) return null; return "trf"; }
  // regras combinadas com a coordenação: passeio não precisa de relatório; apoio de manhã paga 1
  // (2 se tiver Maragogi + outro passeio); apoio da tarde (VOLTA) paga 1
  function conferirMapa(guias,relatorios,ros){
    const porGuiaDia={};
    for(const r of relatorios){ const k=normP(r.guia)+"|"+r.data; (porGuiaDia[k]=porGuiaDia[k]||[]).push(...r.itens); }
    const nomesRel=[...new Set(relatorios.map(r=>normP(r.guia)))];
    return guias.map(g=>{
      const alertas=[]; const nomeG=normP(g.nome);
      const chaveNome=nomesRel.includes(nomeG)?nomeG:(nomesRel.find(x=>nomeBate(g.nome,x)||nomeBate(x,g.nome))||nomeG);
      const add=(tipo,l,detalhe,valor)=>alertas.push({tipo,data:l?l.data:"",ro:l?l.ro:"",servico:l?l.servico:"",detalhe,valor:valor==null?(l?l.valor:0):valor});
      if(g.doc===LUCK_CNPJ) add("cnpj",null,"O cadastro desse guia no PAAR está com o CNPJ da Luck",0);
      const dias=[...new Set(g.linhas.map(l=>l.data))].sort();
      let precisaRelato=0, temRelato=0;
      for(const d of dias){
        const L=g.linhas.filter(l=>l.data===d); const itens=porGuiaDia[chaveNome+"|"+d]; const temDoc=!!itens;
        L.filter(l=>l.valor===0).forEach(l=>add("zero",l,"Valor R$ 0,00 no mapa",0));
        for(const cat of ["chegada","saida","trf"]){
          const mapaL=L.filter(l=>catMapa(l.servico)===cat); const feitos=(itens||[]).filter(i=>catRel(i.servico)===cat&&!i.naoRealizado); const nao=(itens||[]).filter(i=>catRel(i.servico)===cat&&i.naoRealizado);
          if(!mapaL.length&&!feitos.length) continue;
          precisaRelato+=mapaL.length?1:0; if(temDoc) temRelato++;
          if(!temDoc){ mapaL.forEach(l=>add("pendente",l,"Sem relatório do guia neste dia")); continue; }
          let resto=[...mapaL];
          for(const i of nao){ let k=resto.findIndex(l=>normP(l.motorista)&&normP(l.motorista)===normP(i.motorista)); if(k<0) k=0; if(resto[k]){ add("naofez",resto[k],"Marcado no relatório como não realizado"+(i.motivo?": "+i.motivo:"")); resto.splice(k,1);} }
          if(feitos.length<resto.length){ const sobra=resto.filter(l=>!feitos.some(i=>normP(i.motorista)===normP(l.motorista))); (sobra.length?sobra:resto).slice(0,resto.length-feitos.length).forEach(l=>add("semrelato",l,"Está no mapa, mas o relatório do dia não tem esse serviço")); }
          if(feitos.length>resto.length) add("falta",{data:d,ro:"",servico:cat.toUpperCase().replace("CHEGADA","IN").replace("SAIDA","OUT").replace("TRF","TRANSFER"),valor:0},"O relatório tem "+(feitos.length-resto.length)+" serviço(s) a mais que o mapa neste dia",0);
        }
        // apoio
        const idas=L.filter(l=>catMapa(l.servico)==="apoio-ida"), voltas=L.filter(l=>catMapa(l.servico)==="apoio-volta");
        if(idas.length||voltas.length){
          if(!temDoc) [...idas,...voltas].forEach(l=>add("pendente",l,"Sem relatório do guia neste dia"));
          else if(!(itens||[]).some(i=>String(catRel(i.servico)).startsWith("apoio"))) [...idas,...voltas].forEach(l=>add("semrelato",l,"Está no mapa, mas o relatório do dia não tem apoio"));
          const passeios=idas.map(l=>String((ros[l.ro]||{}).servico||"").toUpperCase());
          const mar=passeios.some(p=>/MARAGOGI/.test(p)), outros=passeios.some(p=>!/MARAGOGI/.test(p));
          const pagos=idas.length?((mar&&outros)?2:1):0;
          if(idas.length>pagos){ const ext=[...idas].sort((a,b)=>b.hora.localeCompare(a.hora)).slice(0,idas.length-pagos);
            ext.forEach(l=>add("apoio",l,idas.length+" apoios de manhã ("+(passeios.filter(Boolean).map(p=>p.split(" (")[0]).join(", ")||"passeio não identificado")+"): paga "+pagos)); }
          if(voltas.length>1) voltas.slice(1).forEach(l=>add("apoio",l,voltas.length+" apoios de volta no dia: paga 1"));
        }
      }
      if(precisaRelato&&!temRelato&&!nomesRel.includes(nomeG)) add("nome",null,"Nenhum relatório com o nome \""+g.nome+"\" na quinzena",0);
      return {nome:g.nome,total:g.linhas.reduce((s,l)=>s+(l.valor||0),0),qtd:g.linhas.length,alertas};
    });
  }

    const j=await chamarPiloto("link",{gid}); if(!j.ok){ alert(j.erro); return; }
    const url=location.href.replace(/[^\/]*([?#].*)?$/,"")+"pagamento.html?t="+j.token;
    try{ await navigator.clipboard.writeText(url); alert("Link copiado:\n"+url+"\n\nMande só para esse guia (é pessoal)."); }catch(e){ prompt("Link do guia (copie):",url); }
  }
  async function pilotoResponder(gid,cid,status){
    const resposta=prompt(status==="aceita"?"Aceitar a contestação. Mensagem para o guia (opcional):":"Negar a contestação. Explique o motivo para o guia:","");
    if(resposta===null) return;
    const j=await chamarPiloto("responder",{gid,cid,status,resposta}); if(!j.ok){ alert(j.erro); return; } atualizarPiloto();
  }
  async function pilotoPdf(gid){
    const j=await chamarPiloto("pdf",{gid}); if(!j.ok){ alert(j.erro); return; }
    const bin=atob(j.base64), arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    baixarArquivo(j.nome||"nota.pdf",new Blob([arr],{type:"application/pdf"}));
  }

  // ---- Usuários (admin) ----
  async function renderUsuarios(m){
    m.innerHTML='<div class="card"><h3>Usuários do sistema</h3><div id="listaUsuarios">Carregando...</div></div>';
    const r=await chamar("usuarios",{});
    const lista=document.getElementById("listaUsuarios");
    if(!r.ok){ lista.textContent="Erro ao carregar."; return; }
    const pendentes=r.usuarios.filter(u=>u.status==="pendente");
    const aprovados=r.usuarios.filter(u=>u.status==="aprovado");
    let html="";
    if(pendentes.length){ html+='<div style="font-size:.8rem;font-weight:700;color:var(--aviso);margin:4px 0 10px;">AGUARDANDO APROVAÇÃO</div>';
      html+=pendentes.map(u=>linhaUsuario(u,true)).join(""); }
    html+='<div style="font-size:.8rem;font-weight:700;color:var(--verde);margin:18px 0 10px;">COM ACESSO</div>';
    html+=aprovados.map(u=>linhaUsuario(u,false)).join("");
    lista.innerHTML=html;
  }
  function linhaUsuario(u, pendente){
    const areas=["recife","porto","central"];
    const nomes={recife:"Recife",porto:"Porto",central:"Central"};
    const chips=areas.map(a=>'<span class="chip '+(u.areas&&u.areas.includes(a)?"on":"")+'" onclick="toggleArea(this)" data-area="'+a+'">'+nomes[a]+'</span>').join("");
    const acao = pendente
      ? '<button class="btn mini" onclick="aprovarUsuario(\''+u.email+'\',this)">Aprovar</button> <button class="btn mini danger" onclick="recusarUsuario(\''+u.email+'\')">Recusar</button>'
      : '<button class="btn mini sec" onclick="redefinirSenha(\''+u.email+'\',\''+String(u.nome||u.email).replace(/'/g,"")+'\')" title="Gerar senha provisória">🔑 Redefinir senha</button> <button class="btn mini sec" onclick="aprovarUsuario(\''+u.email+'\',this)">Salvar áreas</button>';
    return '<div class="u-linha" data-email="'+u.email+'">'
      +'<div style="min-width:160px"><div class="un">'+(u.nome||"—")+'</div><div class="ue">'+u.email+'</div></div>'
      +'<div class="areas-sel">'+chips+'</div>'
      +'<div style="margin-left:auto;display:flex;gap:6px;align-items:center;">'+acao+'</div></div>';
  }

  function toggleSidebar(){
    const sb=document.getElementById("sidebar");
    sb.classList.toggle("mini");
    try{ localStorage.setItem("sidebarMini", sb.classList.contains("mini")?"1":"0"); }catch(e){}
  }
  function aplicarPrefSidebar(){ document.getElementById("sidebar").classList.add("mini"); }

  function toggleArea(el){ el.classList.toggle("on"); }
  async function aprovarUsuario(email, btn){
    const linha=btn.closest(".u-linha");
    const areas=[...linha.querySelectorAll(".chip.on")].map(c=>c.dataset.area);
    if(areas.length===0){ alert("Marque ao menos uma área."); return; }
    btn.disabled=true; btn.textContent="...";
    const r=await chamar("aprovar",{email, areas});
    if(r.ok){ renderUsuarios(document.getElementById("mainConteudo")); atualizarPendentes(); }
    else { alert(r.erro||"Erro"); btn.disabled=false; }
  }
  async function recusarUsuario(email){
    if(!confirm("Recusar e apagar este cadastro?")) return;
    const r=await chamar("recusar",{email});
    if(r.ok){ renderUsuarios(document.getElementById("mainConteudo")); atualizarPendentes(); }
  }
</script>
