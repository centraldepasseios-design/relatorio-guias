  // ---- Envio pelo WhatsApp (escala dos guias / aviso dos passeios) + contatos ----
  const API_ENVIOS = "https://us-central1-operacional-luck.cloudfunctions.net/envios";
  const ENV={ contatos:null, enviados:{}, carregando:{} };
  const RODAPE="\n\n_Sujeito a mudanças._";
  const normGuia=(s)=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[-–]?\s*GUIA\s*$/,"").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
  function assinatura(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
  async function chamarEnvios(acao,dados){
    const r=await fetch(API_ENVIOS,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,...dados})});
    const j=await r.json(); sessaoExpirou(j); return j;
  }
  const envPrecisaCarregar=(data)=>(!ENV.contatos||!ENV.enviados[data])&&!ENV.carregando[data];
  async function envCarregar(data){
    ENV.carregando[data]=true;
    try{
      const [c,e]=await Promise.all([ENV.contatos?null:chamarEnvios("contatos",{}), chamarEnvios("enviados",{data})]);
      if(c&&c.ok){ ENV.contatos=c.contatos; preencherGuias(); }
      if(e&&e.ok) ENV.enviados[data]=e.envios;
    }finally{ ENV.carregando[data]=false; }
  }
  function contatoDe(nome){
    const n=normGuia(nome);
    return (ENV.contatos||[]).find(c=>normGuia(c.nome)===n||(c.apelidos||[]).some(a=>normGuia(a)===n))||null;
  }
  function envioDe(data,tipo,guia){ return (ENV.enviados[data]||[]).find(e=>e.tipo===tipo&&normGuia(e.guia)===normGuia(guia))||null; }
  function statusEnvio(data,tipo,guia,mensagem){
    const e=envioDe(data,tipo,guia); if(!e) return '';
    const hora=new Date(e.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    const mudou=mensagem&&e.hash&&e.hash!==assinatura(mensagem);
    return '<span title="Enviado por '+esc(e.por)+'" style="font-size:.72rem;font-weight:600;white-space:nowrap;color:'+(mudou?'var(--aviso)':'var(--ok)')+'">'+(mudou?'⚠️ mudou desde o envio':'✓ enviado '+hora)+'</span>';
  }

  // ---- mensagens ----
  const entraNaEscala=(l)=>l.tipo!=="TOUR"||l.auxiliar;
  // ordem do dia do guia: o que tem apresentação na véspera (madrugada) vem primeiro
  const vespera=(l)=>!!l.apresentacaoVespera||/dia anterior/i.test(l.apresentacao||"");
  // na noite: 18h-23h59 do dia primeiro; a madrugada do dia seguinte depois (se a apresentação dela for na véspera, entra junto com a noite)
  const ordemServ=(l)=>(l._prox?(vespera(l)?"1":"2"):(vespera(l)?"0":"1"))+String(l.apresentacao||((l.inicio&&l.inicio!=="00:00")?l.inicio:"99:99")).slice(0,5);
  // Mensagem curta: a apresentação só no primeiro serviço (depois ele segue com o motorista)
  // e a lista dos serviços com o horário de início. Veículo, motorista e pax ficam no app.
  // Se o motorista mudar no meio do dia, aparece uma nova apresentação naquele serviço.
  function msgEscala(g, data){
    const itens=g.itens.filter(entraNaEscala).slice().sort((a,b)=>ordemServ(a).localeCompare(ordemServ(b)));
    const nome=(l)=>(l.tipo==="TOUR"?"Apoio – ":"")+nomePasseio(l.servico);
    const horaIni=(l)=>(l.inicio&&l.inicio!=="00:00")?l.inicio:(l.apresentacao||"").slice(0,5);
    const pri=itens[0];
    const noite=ESC.turno==="noite";
    let txt=noite?'🌙 *Escala da noite '+dataBR(data).slice(0,5)+' → '+dataBR(somaDia(data,1)).slice(0,5)+' – '+g.nome.toUpperCase()+'*\n\n'
      :'🗓️ *Escala de '+dataBR(data)+' – '+g.nome.toUpperCase()+'*\n\n';
    const aprTxt=(l)=>noite?String(l.apresentacao||horaTxt(l.inicio)).replace(/\s*\(dia anterior\)/i,""):(l.apresentacao||horaTxt(l.inicio));
    if(pri) txt+='⏰ *APRESENTAÇÃO: '+aprTxt(pri)+'*\n'+(pri.apresentacaoLocal?'📍 No '+pri.apresentacaoLocal+'\n':'')+'\n';
    let motAnt=pri?String(pri.motorista||"").trim().toUpperCase():"";
    itens.forEach((l,k)=>{
      const mot=String(l.motorista||"").trim().toUpperCase();
      if(noite&&l._prox&&k>0&&!(itens[k-1]||{})._prox) txt+='\n— madrugada de '+dataBR(somaDia(data,1)).slice(0,5)+' —\n';
      if(k>0&&mot&&motAnt&&mot!==motAnt&&l.apresentacao) txt+='⏰ *Nova apresentação: '+aprTxt(l)+'*'+(l.apresentacaoLocal?' no '+l.apresentacaoLocal:'')+' (outro motorista)\n';
      if(mot) motAnt=mot;
      txt+=(horaIni(l)?horaIni(l)+' · ':'')+nome(l)+(mot?' · Mot. '+titulo(mot):'')+'\n';
    });
    return txt.trimEnd()+'\n\nVoo, veículo e pax no app.'+RODAPE;
  }
  function msgPasseio(guia, carros, data){
    const quando=data===amanhaISO()?"Amanhã, "+dataBR(data):"Dia "+dataBR(data);
    return '🏖️ *'+quando+'*\n\n'
      +carros.map(x=>'Você está no *'+x.p.nome+'*'+(x.p.obs?' ('+x.p.obs+')':'')+'\nCarro '+x.n+' · '+tipoCarro(x.c.tipo)+(idiomaCarro(x.c)?' · '+idiomaCarro(x.c).toLowerCase():'')+(x.c.privativo?' · PVT '+(x.c.privativo.reserva||'')+(x.c.privativo.pax?' ('+x.c.privativo.pax+' pax)':''):'')).join('\n\n')
      +'\n\nA escala completa segue mais tarde.'+RODAPE;
  }
  // situação do envio da escala (como na prévia): Enviada 07:32 · Mudou desde o envio · Não enviada
  function acoesEscalaGuia(g){
    if(!g.itens.some(entraNaEscala)) return '';

    let pill;

    else pill='<span class="pill" style="background:#e3f2ee;color:#0b4f44">Enviada '+new Date(e.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+'</span>';
    return pill+'<button class="btn mini sec" onclick="enviarEscalaGuia(\''+esc(g.nome).replace(/'/g,"\\'")+'\')">Enviar</button>';
  }
  function botaoEscalaGuia(g){
    if(!g.itens.some(entraNaEscala)) return '';
    const m=msgEscala(g,ESC.data);
    return statusEnvio(ESC.data,tipoEnvioEscala(),g.nome,m)+'<button class="btn mini sec" style="padding:3px 9px" title="Enviar escala no WhatsApp" onclick="enviarEscalaGuia(\''+esc(g.nome).replace(/'/g,"\\'")+'\')">📲</button>';
  }

    abrirEnvio(tipoEnvioEscala(),ESC.data,[{guia:g.nome,mensagem:msgEscala(g,ESC.data)}],()=>desenharEscala());

    abrirEnvio(tipoEnvioEscala(),ESC.data,gs.map(g=>({guia:g.nome,mensagem:msgEscala(g,ESC.data)})),()=>desenharEscala());

  function avisarPasseios(passeioId){
    const ps=(PLANO.plano.passeios||[]).filter(p=>passeioId?p.id===passeioId:(PLANO.saida==="todas"||p.saida===PLANO.saida));
    const por={};
    for(const p of ps) p.carros.forEach((c,i)=>{ if(!c.guia) return; const k=normGuia(c.guia); (por[k]=por[k]||{guia:c.guia,carros:[]}).carros.push({p,c,n:i+1}); });
    const itens=Object.values(por).map(x=>({guia:x.guia,mensagem:msgPasseio(x.guia,x.carros,PLANO.data)}));
    abrirEnvio("passeio",PLANO.data,itens,()=>desenharPlano());
  }

  // avisa um guia só (ex.: carro incluído depois do aviso geral); junta todos os carros dele no dia

    for(const p of (PLANO.plano.passeios||[])) p.carros.forEach((c,i)=>{ if(c.guia&&normGuia(c.guia)===k) carros.push({p,c,n:i+1}); });
    if(!carros.length){ alert("Esse guia não está em nenhum carro."); return; }
    abrirEnvio("passeio",PLANO.data,[{guia:carros[0].c.guia,mensagem:msgPasseio(carros[0].c.guia,carros,PLANO.data)}],()=>desenharPlano());

  async function vincularContato(i,id){
    if(!id) return;
    const it=ENV.janela.itens[i];
    const j=await chamarEnvios("vincular",{id,nomePhoenix:it.guia});

  async function dispararEnvio(){
    const J=ENV.janela; if(!J) return;
    const fila=J.itens.filter(it=>contatoDe(it.guia)&&!it.fora&&!it.resultado);
    const b=document.getElementById("envBtn"); if(b){ b.disabled=true; b.textContent="Enviando..."; }
    const prog=document.getElementById("envProgresso");
    const TAM=J.tipo==="pdf"?3:10;
    for(let k=0;k<fila.length;k+=TAM){
      const lote=fila.slice(k,k+TAM);
      if(prog) prog.textContent=(J.tipo==="pdf"?"Gerando PDF no Phoenix e enviando ":"Enviando ")+(k+1)+"–"+(k+lote.length)+" de "+fila.length+"...";
      try{
        const j=await chamarEnvios(J.tipo==="pdf"?"enviarPdf":"enviar",{data:J.data,tipo:J.tipo,itens:lote.map(it=>({guia:it.guia,mensagem:it.mensagem,assinatura:assinatura(it.mensagem),aviso:(J.tipo==="pdf"&&J.reenvio&&J.reenvio.usar&&envioDe(J.data,"pdf",it.guia))?J.reenvio.texto:""}))});
        if(!j.ok){ lote.forEach(it=>it.resultado={ok:false,motivo:j.erro}); }
        else j.resultados.forEach((r,x)=>{ lote[x].resultado=r; });
      }catch(e){ lote.forEach(it=>it.resultado={ok:false,motivo:"erro de conexão"}); }
      if(!ENV.janela) return;
      desenharEnvio();
    }
    delete ENV.enviados[J.data]; await envCarregar(J.data);
    const ok=fila.filter(it=>it.resultado&&it.resultado.ok).length;
    const p2=document.getElementById("envProgresso"); if(p2) p2.innerHTML='<b style="color:'+(ok===fila.length?'var(--ok)':'var(--alerta)')+'">'+ok+' de '+fila.length+' enviados.</b>';
  }

  async function salvarSenhaNova(senhaAtual,obrigatoria){
    const atual=obrigatoria?senhaAtual:document.getElementById("sAtual").value;
    const nova=document.getElementById("sNova").value, nova2=document.getElementById("sNova2").value, m=document.getElementById("sMsg");
    if(nova.length<8){ m.textContent="A nova senha precisa ter ao menos 8 caracteres."; return; }
    if(nova!==nova2){ m.textContent="As duas senhas novas não são iguais."; return; }
    const b=document.getElementById("sBtn"); b.disabled=true; b.textContent="Salvando...";
    const r=await chamar("trocarSenha",{atual,nova});
    if(!r.ok){ m.textContent=r.erro||"Erro ao salvar."; b.disabled=false; b.textContent="Salvar"; return; }
    // a troca desconecta as sessões antigas: entra de novo com a senha nova
    const email=USUARIO.email;
    const l=await chamar("login",{email,senha:nova});
    document.getElementById("senhaFundo").remove();
    if(l.ok){ USUARIO=l; iniciarApp(); alert("Senha trocada com sucesso."); }
    else { sair(); msg("Senha trocada. Entre de novo com a senha nova.","ok"); }
  }

  // ======================= PAGAMENTOS: CONFERÊNCIA DAS NOTAS FISCAIS =======================
  // Tudo roda no navegador: lê a PGG (Excel), o mapa do PAAR (Excel, opcional) e os PDFs das notas,
  // identifica o guia de cada nota e compara o valor com o "VALOR LIQUIDO A PAGAR" da PGG.
    // ---- Leitura de nota fiscal de guia (DANFSe padrão nacional v1/v2 e nota avulsa de prefeitura) ----
  // Recebe o texto do PDF (linhas) e devolve os dados que interessam para a conferência.
  const LUCK_CNPJ = "10866549000117";
  function lerNota(texto) {
    const t = String(texto || "");
    const plano = t.replace(/\s+/g, " ");
    const so = (s) => String(s || "").replace(/\D/g, "");
    const dinheiro = (s) => parseFloat(String(s).replace(/\./g, "").replace(",", "."));
    const r = { tipo: "desconhecido", numero: null, chave: null, emissao: null, competencia: null, periodo: null,
      prestadorDoc: null, prestadorNome: null, luck: false, valor: null, comissao: null, servicos: [], somaServicos: 0, avisos: [] };

    if (/DANFSe/i.test(plano) || /Documento Auxiliar da NFS-e/i.test(plano)) r.tipo = "nfse";
    else if (/NOTA FISCAL AVULSA/i.test(plano)) r.tipo = "avulsa";

    // documentos (CNPJ/CPF) na ordem em que aparecem; o 1º que não é da Luck é o do prestador
    const docs = [...plano.matchAll(/\b(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}|\d{3}\.\d{3}\.\d{3}-\d{2})\b/g)].map((m) => so(m[1]));
    r.luck = docs.includes(LUCK_CNPJ);
    r.prestadorDoc = docs.find((d) => d !== LUCK_CNPJ && d !== "10091536000113") || null; // 2º: CNPJ da prefeitura de Caruaru no cabeçalho

    if (r.tipo === "nfse") {
      const ch = plano.match(/CHAVE DE ACESSO DA NFS-e\s*(\d{40,60})/i); if (ch) r.chave = ch[1];
      const nm = plano.match(/N[ÚU]MERO DA NFS-e\s+COMPET[ÊE]NCIA DA NFS-e\s+DATA E HORA DA EMISS[ÃA]O DA NFS-e\s+(\d+)\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}\/\d{2}\/\d{4})/i);
      if (nm) { r.numero = nm[1]; r.competencia = nm[2]; r.emissao = nm[3]; }
      const nome = plano.match(/Nome \/ Nome Empresarial\s+(?:Munic[íi]pio[^\n]*?CEP\s+|E-mail\s+)?\d{2}\.\d{3}\.\d{3}\s+([A-ZÀ-Ú ]+?)\s{1,}(?:[A-ZÀ-Ú][a-zà-ú]|[A-Z]+@|Recife|Igarassu|Olinda|Jaboat|Ipojuca|Paulista|Cabo|Caruaru|\(|$)/);
      if (nome) r.prestadorNome = nome[1].trim();
    } else if (r.tipo === "avulsa") {
      const nm = plano.match(/N[úu]mero:?\s*(?:Data Emiss[ãa]o:?\s*)?(\d{4,})/i) || plano.match(/\b(\d{6})\b(?=.*Imposto Sobre)/);
      if (nm) r.numero = nm[1];
      const pe = plano.match(/(\d{2}\/\d{2}\/\d{4})\s*(?:PRESTA[ÇC][ÃA]O DE SERVI[ÇC]O\s*)?(?:\d{2}\/\d{2}\/\d{4}\s*)?(?:\d+\s*)?(?:[A-Z]\s*)?(?:PE\s*)*-\s*(\d{2}\/\d{2}\/\d{4})/);
      if (pe) r.periodo = [pe[1], pe[2]];
      const nome = t.match(/Nome\/Raz[ãa]o Social:\s*\n\s*([A-ZÀ-Ú ]{5,})/);
      if (nome) r.prestadorNome = nome[1].trim();
    }

    // valor da nota: o maior valor em reais do documento (é sempre o total da nota)
    const valores = [...plano.matchAll(/(?<![\d.,\/])(\d{1,3}(?:\.\d{3})*,\d{2})(?![\d])/g)].map((m) => dinheiro(m[1])).filter((v) => v > 0);
    if (valores.length) r.valor = Math.max(...valores);

    // descrição dos serviços: trecho entre "Descrição do Serviço" e a tributação (NFS-e) ou a tabela (avulsa)
    let desc = "";
    const d1 = plano.match(/Descri[çc][ãa]o do Servi[çc]o\s+(.*?)\s+(?:TRIBUTA[ÇC][ÃA]O MUNICIPAL|Tipo de Tributa[çc][ãa]o|Prefeitura|$)/i);
    if (r.tipo === "nfse" && d1) desc = d1[1];
    if (r.tipo === "avulsa") { const d2 = plano.match(/Total\s+(1\s+UNI?\b.*?)\s+VALOR TOTAL DA NOTA/i); if (d2) desc = d2[1]; }
    r.descricao = desc;
    const com = desc.match(/COMISS[ÃA]?O?\s*(?:VENDAS[^\d]*\d{2}\/\d{2}\/\d{4}\s*A\s*\d{2}\/\d{2}\/\d{4}\s*)?[^\d$]{0,15}(?:R?\$)?\s*([\d.]+[.,]\d{2})/i);
    if (com) r.comissao = dinheiro(com[1].replace(/\.(\d{2})$/, ",$1"));
    // serviços: data dd/mm(/aaaa) seguida do nome e de um valor
    const reServ = /(\d{2}\/\d{2})(?:\/\d{2,4}|\/20\/26)?\s*([A-ZÀ-Úa-zà-ú][^#\/$]*?|[A-Z]+?)\s*(?:R?\$\s*)?(\d{1,4}(?:,\d{2})?)(?=\s|\/|#|$|,|;|\.|[A-Z]|\*)/g;
    if (desc) {
      const semCom = desc.replace(/COMISS.*$/i, "");
      for (const m of semCom.matchAll(reServ)) {
        const v = dinheiro(m[3].includes(",") ? m[3] : m[3] + ",00");
        if (v > 0 && v < 2000) r.servicos.push({ data: m[1], servico: m[2].replace(/\*/g, "").trim(), valor: v });
      }
      // na nota avulsa o valor aparece duas vezes (unitário e total): conta uma
      r.somaServicos = Math.round(r.servicos.reduce((s, x) => s + x.valor, 0) * 100) / 100;
    }
    if (!r.luck) r.avisos.push("CNPJ da Luck não aparece na nota");
    if (!r.valor) r.avisos.push("Não consegui ler o valor da nota");
    return r;
  }


  const PAG={ pgg:null, paar:[], notas:[], arquivos:{} };
  function carregarScript(src){ return new Promise((ok,erro)=>{ if(document.querySelector('script[src="'+src+'"]')) return ok(); const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>erro(new Error("não carregou "+src)); document.head.appendChild(s); }); }
  async function libsPagamentos(){
    await carregarScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    await carregarScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await carregarScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const normP=(s)=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/-?\s*GUIA\s*$/,"").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const brlP=(v)=>v==null||isNaN(v)?"—":"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  const soDig=(s)=>String(s||"").replace(/\D/g,"");
  async function textoPdf(arquivo){
    const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await arquivo.arrayBuffer())}).promise;
    const out=[];
    for(let p=1;p<=doc.numPages;p++){
      const tc=await (await doc.getPage(p)).getTextContent(); const linhas={};
      for(const it of tc.items){ const y=Math.round(it.transform[5]); (linhas[y]=linhas[y]||[]).push([it.transform[4],it.str]); }
      Object.keys(linhas).sort((a,b)=>b-a).forEach(y=>out.push(linhas[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ")));
    }
    return out.join("\n");
  }
  async function lerPGG(arquivo){
    const wb=XLSX.read(await arquivo.arrayBuffer());
    const ws=wb.Sheets[wb.SheetNames[0]];
    const linhas=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    const periodo=String((linhas[0]||[])[0]||"");
    const num=(v)=>v==null||v===""?null:(typeof v==="number"?v:parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",",".")));
    const rows=[];
    for(const r of linhas.slice(1)){
      const nome=String(r[0]||"").trim(); if(!nome||/^TOTAL/i.test(nome)) continue;
      rows.push({nome, serv:num(r[1]), com:num(r[2]), reemb:num(r[3]), maq:num(r[4]), liq:num(r[5]), reembCli:num(r[6]), obs:r[7]||""});
    }
    return {periodo, rows};
  }
  async function lerPAAR(arquivo){
    const wb=XLSX.read(await arquivo.arrayBuffer()); const lista=[];
    for(const n of wb.SheetNames){
      const linhas=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true});
      const cab=String((linhas[1]||[])[0]||"");
      const doc=(cab.match(/CNPJ\/CPF:\s*([\d.\/-]+)/)||[])[1]; const razao=(cab.match(/Raz[ãa]o Social:\s*(.+)$/)||[])[1]||"";
      lista.push({nome:String((linhas[0]||[])[0]||n).replace(/^Guia:\s*/,""), doc:soDig(doc), razao:razao.trim()});
    }
    return lista;
  }
  // o nome curto da PGG ("BRUNO M", "H.FARIAS") bate com um nome completo se cada pedaço for o começo de uma palavra dele
  function nomeBate(curto,completo){
    const a=normP(curto).split(" ").filter(Boolean), b=normP(completo).split(" ").filter(Boolean);
    if(!a.length||!b.length) return false;
    const usadas=new Set();
    return a.every(t=>{ const i=b.findIndex((w,k)=>!usadas.has(k)&&w.startsWith(t)); if(i<0) return false; usadas.add(i); return true; });
  }
  // PAAR que corresponde à nota: mesmo CNPJ/CPF ou mesma razão social do prestador
  function paarDaNota(n){
    const nome=normP(n.prestadorNome);
    return PAG.paar.filter(p=>(p.doc&&p.doc===n.prestadorDoc)||(nome&&normP(p.razao).replace(/^\d+\s*/,"")===nome));
  }
  function identificarGuia(n){
    const rows=PAG.pgg?PAG.pgg.rows:[];
    const hits=paarDaNota(n);
    const escolher=(c)=>{
      if(c.length>1){ const comValor=c.filter(r=>(r.liq||0)>0); if(comValor.length) c=comValor; }
      if(c.length>1){ const mais=Math.max(...c.map(r=>normP(r.nome).split(" ").length)); c=c.filter(r=>normP(r.nome).split(" ").length===mais); }
      return c.length===1?c[0].nome:null;
    };
    // 1) nome igual à aba do PAAR; 2) nome curto da PGG bate com a aba do PAAR; 3) bate com o nome da nota
    let c=rows.filter(r=>hits.some(p=>normP(p.nome)===normP(r.nome)));
    if(!c.length) c=rows.filter(r=>hits.some(p=>nomeBate(r.nome,p.nome)));
    if(!c.length) c=rows.filter(r=>n.prestadorNome&&nomeBate(r.nome,n.prestadorNome));
    return escolher(c);
  }
  function conferirNota(n){
    const g=PAG.pgg&&PAG.pgg.rows.find(r=>r.nome===n.guia);
    const ok=[], prob=[], info=[];
    if(!n.valor) prob.push("não consegui ler o valor");
    if(!n.luck) prob.push("CNPJ da Luck não aparece na nota");
    if(!g){ prob.push("guia não identificado: escolha na lista"); return {ok,prob,info,dif:null}; }
    let dif=null;
    if(g.liq==null||g.liq===0) prob.push("PGG sem valor líquido (comissão ainda não lançada?)");
    else { dif=Math.round((n.valor-g.liq)*100)/100; if(Math.abs(dif)<0.01) ok.push("valor bate com a PGG"); else prob.push("valor "+(dif>0?"acima":"abaixo")+" da PGG em "+brlP(Math.abs(dif))); }
    const cad=paarDaNota(n)[0]||PAG.paar.find(p=>normP(p.nome)===normP(g.nome));
    if(cad&&cad.doc&&n.prestadorDoc){
      if(cad.doc===LUCK_CNPJ) info.push("cadastro do PAAR está com o CNPJ da Luck");
      else if(cad.doc===n.prestadorDoc) ok.push("CNPJ igual ao cadastro");
      else if(cad.doc.length===11&&n.prestadorDoc.length===14) info.push("cadastro do PAAR com CPF; nota com CNPJ do MEI");
      else prob.push("CNPJ/CPF da nota diferente do cadastro no PAAR");
    }
    if(n.servicos.length&&g.serv!=null&&Math.abs(n.somaServicos-g.serv)>0.01) info.push("serviços da descrição somam "+brlP(n.somaServicos)+"; PGG: "+brlP(g.serv));
    if(n.comissao!=null&&g.com!=null&&Math.abs(n.comissao-g.com)>0.01) info.push("comissão na nota "+brlP(n.comissao)+"; PGG: "+brlP(g.com));
    if(n.tipo==="avulsa") info.push("nota avulsa da prefeitura (não é MEI)");
    // nota de outro período (ex.: nota antiga enviada por engano)
    const mesPgg=((PAG.pgg.periodo||"").match(/\d{1,2}\s*A\s*\d{1,2}\/(\d{1,2})/i)||[])[1];
    const dataNota=n.competencia||(n.periodo&&n.periodo[0])||n.emissao;
    if(mesPgg&&dataNota){ const [,mm,aa]=dataNota.split("/"); const atual=new Date().getFullYear();
      const distancia=Math.abs((+aa-atual)*12+(+mm-(+mesPgg)));
      if(distancia>1) prob.push("nota de outro período (competência "+mm+"/"+aa+")"); }
    const dup=PAG.notas.filter(x=>x!==n&&x.numero&&x.numero===n.numero&&x.prestadorDoc===n.prestadorDoc);
    if(dup.length) prob.push("nota repetida");
    return {ok,prob,info,dif};
  }
  function renderPagamentos(m){

    const abas=segmento([["quinzena","Quinzena dos guias"],["comissao","Comissão"],["tarifario","Tarifário"],["notas","Notas recebidas por fora"]],aba,"PAG.aba='$v';renderPagamentos(document.getElementById('mainConteudo'))");
    cab("Mapa pelo Phoenix, comissão da PGG e notas fiscais","");
    if(aba==="quinzena"){ m.innerHTML='<div style="margin-bottom:16px">'+abas+'</div>'+htmlQuinzena(); carregarQuinzenas(); atualizarPiloto(); return; }
    if(aba==="comissao"){ m.innerHTML='<div style="margin-bottom:16px">'+abas+'</div><div class="card" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center"><label style="display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:700;color:var(--muted)">Quinzena<select id="qSel" onchange="PIL.qid=this.value;renderPagamentos(document.getElementById(\'mainConteudo\'))" style="height:44px;padding:0 12px;font-weight:700"><option value="'+PIL.qid+'">'+nomeQ(PIL.qid)+'</option></select></label><span id="comInfo" style="flex:1;font-size:.82rem;color:var(--muted)"></span><button class="btn sec" onclick="comissaoAgora().then(carregarComissaoCentral)">Buscar no Phoenix agora</button></div><div id="comBox"><div class="card" style="color:var(--muted)">Carregando...</div></div>'; carregarQuinzenas(); carregarComissaoCentral(); return; }
    if(aba==="tarifario"){ m.innerHTML='<div style="margin-bottom:16px">'+abas+'</div><div id="tarBox"><div class="card" style="color:var(--muted)">Carregando o tarifário...</div></div>'; carregarTarifario(); return; }
    m.innerHTML='<div style="margin-bottom:16px">'+abas+'</div>'+`
      <div class="card">
        <h3 style="margin-bottom:6px;">Notas que chegaram por WhatsApp ou e-mail</h3>
        <p style="font-size:.84rem;color:var(--muted);margin-bottom:14px;">Suba a PGG da quinzena, o mapa do PAAR (ajuda a reconhecer o guia pelo CNPJ) e as notas em PDF. O sistema lê cada nota e compara com o valor líquido a pagar da PGG. Nada sai do seu computador.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600;">1. PGG (.xlsx)<input type="file" id="pagPgg" accept=".xlsx,.xls"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600;">2. Mapa do PAAR (.xlsx, opcional)<input type="file" id="pagPaar" accept=".xlsx,.xls"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:600;">3. Notas fiscais (PDF, pode selecionar várias)<input type="file" id="pagNotas" accept=".pdf" multiple></label>
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;">
          <button class="btn" id="pagBtn" onclick="processarPagamentos()">Conferir</button>
          <span id="pagInfo" style="font-size:.82rem;color:var(--muted);"></span>
        </div>
      </div>
      <div id="pagResultado"></div>`;
  }
  async function processarPagamentos(){
    const info=document.getElementById("pagInfo"), b=document.getElementById("pagBtn");
    const fPgg=document.getElementById("pagPgg").files[0], fPaar=document.getElementById("pagPaar").files[0], fNotas=[...document.getElementById("pagNotas").files];
    if(!fPgg||!fNotas.length){ alert("Selecione a PGG e pelo menos uma nota."); return; }
    b.disabled=true;
    try{
      info.textContent="Carregando leitores..."; await libsPagamentos();
      info.textContent="Lendo a PGG..."; PAG.pgg=await lerPGG(fPgg);
      PAG.paar=fPaar?await lerPAAR(fPaar):[];
      PAG.notas=[]; PAG.arquivos={};
      for(let i=0;i<fNotas.length;i++){
        info.textContent="Lendo nota "+(i+1)+" de "+fNotas.length+"...";
        let n;
        try{ n=lerNota(await textoPdf(fNotas[i])); }catch(e){ n={tipo:"erro",avisos:["não consegui abrir o PDF"],servicos:[],somaServicos:0}; }
        n.arquivo=fNotas[i].name; n.id=i; PAG.arquivos[i]=fNotas[i];
        PAG.notas.push(n);
      }
      PAG.notas.forEach(n=>{ n.guia=identificarGuia(n); });
      info.textContent=fNotas.length+" nota(s) lida(s) · PGG "+(PAG.pgg.periodo||"")+" com "+PAG.pgg.rows.length+" guias";
      desenharPagamentos();
    }catch(e){ console.error(e); alert("Erro: "+e.message); info.textContent=""; }
    finally{ b.disabled=false; }
  }
  function desenharPagamentos(){
    const box=document.getElementById("pagResultado"); if(!box) return;
    const res=PAG.notas.map(n=>({n,c:conferirNota(n)}));
    const bate=res.filter(x=>!x.c.prob.length).length, dif=res.length-bate;
    const comNota=new Set(PAG.notas.map(n=>n.guia).filter(Boolean));
    const semNota=PAG.pgg.rows.filter(r=>!comNota.has(r.nome)&&(r.liq||0)>0);
    const opts=(sel)=>'<option value="">— escolher guia —</option>'+PAG.pgg.rows.map(r=>'<option'+(r.nome===sel?' selected':'')+'>'+esc(r.nome)+'</option>').join("");
    let h='<div class="cards-resumo"><div class="resumo ok"><div class="num">'+bate+'</div><div class="lbl">Notas certas</div></div><div class="resumo '+(dif?"alerta":"")+'"><div class="num">'+dif+'</div><div class="lbl">Com problema</div></div><div class="resumo"><div class="num">'+semNota.length+'</div><div class="lbl">Guias da PGG sem nota</div></div></div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;"><button class="btn sec" onclick="baixarResultadoPag()">Baixar resultado (CSV)</button><button class="btn sec" onclick="baixarNotasRenomeadas()">Baixar notas renomeadas (.zip)</button></div>';
    res.sort((a,b)=>(b.c.prob.length?1:0)-(a.c.prob.length?1:0));
    h+='<div class="card" style="padding:6px 18px;">'+res.map(({n,c})=>{
      const st=c.prob.length?'<span style="color:var(--alerta);font-weight:700">⚠️ '+esc(c.prob.join(" · "))+'</span>':'<span style="color:var(--ok);font-weight:700">✅ '+esc(c.ok.join(" · "))+'</span>';
      return '<div style="display:grid;grid-template-columns:minmax(160px,1.1fr) 110px 110px minmax(240px,2fr);gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--linha);font-size:.84rem;">'
        +'<div style="display:flex;flex-direction:column;gap:4px"><select onchange="PAG.notas['+n.id+'].guia=this.value||null;desenharPagamentos()" style="padding:6px 8px;border:1px solid var(--linha);border-radius:8px;font-weight:700">'+opts(n.guia)+'</select><span style="font-size:.74rem;color:var(--muted)">'+esc(n.prestadorNome||n.arquivo)+'</span></div>'
        +'<div><b>Nota '+esc(n.numero||"?")+'</b><div style="font-size:.74rem;color:var(--muted)">'+esc(n.tipo==="avulsa"?"avulsa":"NFS-e")+'</div></div>'
        +'<div><b>'+brlP(n.valor)+'</b>'+(c.dif!=null&&Math.abs(c.dif)>=0.01?'<div style="font-size:.74rem;color:var(--alerta)">'+(c.dif>0?"+":"−")+brlP(Math.abs(c.dif))+'</div>':'')+'</div>'
        +'<div style="display:flex;flex-direction:column;gap:3px">'+st+(c.info.length?'<span style="font-size:.76rem;color:var(--muted)">ℹ️ '+esc(c.info.join(" · "))+'</span>':'')+'</div></div>';
    }).join("")+'</div>';
    if(semNota.length) h+='<div class="card"><h3 style="font-size:1rem;margin-bottom:8px">Guias da PGG sem nota</h3><div style="font-size:.84rem;line-height:1.9">'+semNota.map(r=>esc(r.nome.trim())+' <span style="color:var(--muted)">('+brlP(r.liq)+')</span>').join(" · ")+'</div></div>';
    box.innerHTML=h;
  }
  function baixarArquivo(nome,blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }

  // ======================= PAGAMENTOS: CONFERÊNCIA DO MAPA (PAAR × RELATÓRIOS) =======================
  const API_CONFERENCIA = "https://us-central1-operacional-luck.cloudfunctions.net/conferencia";
  const MAPA={ guias:[], periodo:null, resultado:null, filtro:"pend", abertos:{} };
  const ALERTA={
    falta:["Falta no mapa","#fde4df","#9f2a15","Colocar o guia nesse serviço no Phoenix"],
    naofez:["Relatório diz que não fez","#fff1e0","#8a4a0c","Tirar o guia desse serviço no Phoenix"],

    apoio:["Apoio a mais","#fde4df","#9f2a15","Paga só o permitido no dia: tirar o excedente"],
    pendente:["Relatório pendente","#eef1f0","#3c524d","Cobrar o relatório do dia"],

  async function lerMapaPAAR(arquivo){
    const wb=XLSX.read(await arquivo.arrayBuffer()); const guias=[]; let periodo=null;
    for(const n of wb.SheetNames){
      const L=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true});
      const cab=String((L[1]||[])[0]||"");
      const per=cab.match(/(\d{4}-\d{2}-\d{2})\s*a\s*(\d{4}-\d{2}-\d{2})/); if(per&&!periodo) periodo=[per[1],per[2]];
      const linhas=[];
      for(const r of L.slice(4)){
        if(!r||!r[0]||String(r[0]).startsWith("VALOR")) continue;
        linhas.push({data:String(r[0]).slice(0,10),hora:String(r[1]||""),ro:String(r[2]||""),modo:String(r[3]||""),servico:String(r[4]||""),veiculo:String(r[5]||""),motorista:String(r[6]||"").trim(),valor:typeof r[11]==="number"?r[11]:parseFloat(r[11])||0});
      }
      guias.push({nome:String((L[0]||[])[0]||n).replace(/^Guia:\s*/,"").replace(/\s*-\s*GUIA\s*$/i,"").trim(),doc:soDig((cab.match(/CNPJ\/CPF:\s*([\d.\/-]+)/)||[])[1]),linhas});
    }
    return {guias,periodo};
  }
  function catMapa(s){ const S=String(s).toUpperCase();
    if(/APOIO/.test(S)) return /VOLTA/.test(S)?"apoio-volta":"apoio-ida";
    if(/^IN\b/.test(S)) return "chegada"; if(/^OUT\b/.test(S)) return "saida";
    if(/^(TRF|TRANSFER)\b|TRANSFER/.test(S)) return "trf"; return "passeio"; }
  function catRel(s){ s=String(s||"");
    if(s.startsWith("chegada")) return "chegada"; if(s.startsWith("saida")) return "saida";
    if(s==="apoio-recife-tarde") return "apoio-volta"; if(s.startsWith("apoio")) return "apoio";
    if(s==="passeio") return "passeio"; if(s==="so-vendas"||!s) return null; return "trf"; }
  // regras combinadas com a coordenação: passeio não precisa de relatório; apoio de manhã paga 1
  // (2 se tiver Maragogi + outro passeio); apoio da tarde (VOLTA) paga 1
  function conferirMapa(guias,relatorios,ros){
    const porGuiaDia={};
    for(const r of relatorios){ const k=normP(r.guia)+"|"+r.data; (porGuiaDia[k]=porGuiaDia[k]||[]).push(...r.itens); }
    const nomesRel=[...new Set(relatorios.map(r=>normP(r.guia)))];
    return guias.map(g=>{
      const alertas=[]; const nomeG=normP(g.nome);
      const chaveNome=nomesRel.includes(nomeG)?nomeG:(nomesRel.find(x=>nomeBate(g.nome,x)||nomeBate(x,g.nome))||nomeG);
      const add=(tipo,l,detalhe,valor)=>alertas.push({tipo,data:l?l.data:"",ro:l?l.ro:"",servico:l?l.servico:"",detalhe,valor:valor==null?(l?l.valor:0):valor});
      if(g.doc===LUCK_CNPJ) add("cnpj",null,"O cadastro desse guia no PAAR está com o CNPJ da Luck",0);
      const dias=[...new Set(g.linhas.map(l=>l.data))].sort();
      let precisaRelato=0, temRelato=0;
      for(const d of dias){
        const L=g.linhas.filter(l=>l.data===d); const itens=porGuiaDia[chaveNome+"|"+d]; const temDoc=!!itens;
        L.filter(l=>l.valor===0).forEach(l=>add("zero",l,"Valor R$ 0,00 no mapa",0));
        for(const cat of ["chegada","saida","trf"]){
          const mapaL=L.filter(l=>catMapa(l.servico)===cat); const feitos=(itens||[]).filter(i=>catRel(i.servico)===cat&&!i.naoRealizado); const nao=(itens||[]).filter(i=>catRel(i.servico)===cat&&i.naoRealizado);
          if(!mapaL.length&&!feitos.length) continue;
          precisaRelato+=mapaL.length?1:0; if(temDoc) temRelato++;
          if(!temDoc){ mapaL.forEach(l=>add("pendente",l,"Sem relatório do guia neste dia")); continue; }
          let resto=[...mapaL];
          for(const i of nao){ let k=resto.findIndex(l=>normP(l.motorista)&&normP(l.motorista)===normP(i.motorista)); if(k<0) k=0; if(resto[k]){ add("naofez",resto[k],"Marcado no relatório como não realizado"+(i.motivo?": "+i.motivo:"")); resto.splice(k,1);} }
          if(feitos.length<resto.length){ const sobra=resto.filter(l=>!feitos.some(i=>normP(i.motorista)===normP(l.motorista))); (sobra.length?sobra:resto).slice(0,resto.length-feitos.length).forEach(l=>add("semrelato",l,"Está no mapa, mas o relatório do dia não tem esse serviço")); }
          if(feitos.length>resto.length) add("falta",{data:d,ro:"",servico:cat.toUpperCase().replace("CHEGADA","IN").replace("SAIDA","OUT").replace("TRF","TRANSFER"),valor:0},"O relatório tem "+(feitos.length-resto.length)+" serviço(s) a mais que o mapa neste dia",0);
        }
        // apoio
        const idas=L.filter(l=>catMapa(l.servico)==="apoio-ida"), voltas=L.filter(l=>catMapa(l.servico)==="apoio-volta");
        if(idas.length||voltas.length){
          if(!temDoc) [...idas,...voltas].forEach(l=>add("pendente",l,"Sem relatório do guia neste dia"));
          else if(!(itens||[]).some(i=>String(catRel(i.servico)).startsWith("apoio"))) [...idas,...voltas].forEach(l=>add("semrelato",l,"Está no mapa, mas o relatório do dia não tem apoio"));
          const passeios=idas.map(l=>String((ros[l.ro]||{}).servico||"").toUpperCase());
          const mar=passeios.some(p=>/MARAGOGI/.test(p)), outros=passeios.some(p=>!/MARAGOGI/.test(p));
          const pagos=idas.length?((mar&&outros)?2:1):0;
          if(idas.length>pagos){ const ext=[...idas].sort((a,b)=>b.hora.localeCompare(a.hora)).slice(0,idas.length-pagos);
            ext.forEach(l=>add("apoio",l,idas.length+" apoios de manhã ("+(passeios.filter(Boolean).map(p=>p.split(" (")[0]).join(", ")||"passeio não identificado")+"): paga "+pagos)); }
          if(voltas.length>1) voltas.slice(1).forEach(l=>add("apoio",l,voltas.length+" apoios de volta no dia: paga 1"));
        }
      }
      if(precisaRelato&&!temRelato&&!nomesRel.includes(nomeG)) add("nome",null,"Nenhum relatório com o nome \""+g.nome+"\" na quinzena",0);
      return {nome:g.nome,total:g.linhas.reduce((s,l)=>s+(l.valor||0),0),qtd:g.linhas.length,alertas};
    });
  }

  // ======================= CENTRAL: RELATÓRIO (relatórios dos guias × escala do Phoenix) =======================
  // Duas visões: "Relatórios do dia" (o que cada guia marcou e a escala dele no Phoenix, lado a lado)
  // e "Divergências da quinzena" (mesma conferência do mapa, mas lendo direto do Phoenix, sem arquivo do PAAR).
  // Passeio não entra na conferência (não precisa de relatório); apoio segue as regras combinadas.
  const RELT={ aba:"dia", dia:null, qid:null, dados:{}, filtro:"pend", abertos:{}, busca:"" };
  function relHoje(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Recife"}).format(new Date()); }
  function relSomaDias(iso,n){ const d=new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
  function relQuinzenas(){
    const h=relHoje(), out=[]; let a=+h.slice(0,4), m=+h.slice(5,7), meio=+h.slice(8,10)>15;
    for(let k=0;k<4;k++){
      const mm=String(m).padStart(2,"0"), ult=new Date(a,m,0).getDate();
      out.push(meio?[a+"-"+mm+"-16",a+"-"+mm+"-"+ult]:[a+"-"+mm+"-01",a+"-"+mm+"-15"]);
      if(meio) meio=false; else { meio=true; m--; if(!m){ m=12; a--; } }
    }
    return out.map(([i,f])=>({qid:i+"_"+f,ini:i,fim:f,txt:dataBR(i).slice(0,5)+" a "+dataBR(f).slice(0,5)+(f>=h&&i<=h?" (em andamento)":"")}));
  }
  function relServico(cod){ const s=String(cod||"");
    if(s.startsWith("chegada")) return "IN"; if(s.startsWith("saida")) return "OUT";
    if(s==="apoio-recife-tarde") return "Apoio (volta)"; if(s.startsWith("apoio")) return "Apoio";
    if(s==="passeio") return "Passeio"; if(s==="so-vendas") return "Só vendas"; if(!s) return "—"; return "Transfer"; }
  async function relChamar(acao,ini,fim){
    const r=await fetch(API_CONFERENCIA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,inicio:ini,fim})});
    const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro||"erro"); return j;
  }
  // lê Phoenix + relatórios do período e faz a conferência
  async function relCarregar(ini,fim,info){
    const k=ini+"_"+fim; if(RELT.dados[k]) return RELT.dados[k];
    info("Lendo os relatórios dos guias...");
    const rel=(await relChamar("relatorios",ini,fim)).relatorios||[];
    info("Lendo as escalas no Phoenix de "+dataBR(ini)+(ini===fim?"":" a "+dataBR(fim))+"... pode levar 1 a 2 minutos na primeira vez");
    // escala lida na hora do Phoenix, dia a dia (a mesma leitura da tela Escala dos guias),
    // para não usar uma cópia guardada antes de alguma mudança na escala
    const dias=[]; for(let d=ini; d<=fim; d=relSomaDias(d,1)) dias.push(d);
    const linhas=[], falhou=[]; let feitos=0;
    const lerDia=async(d)=>{
      try{
        const r=await fetch(API_ESCALA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:d,token:USUARIO.token})});
        const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro||"erro");
        (j.linhas||[]).forEach(l=>linhas.push({...l,data:d}));
      }catch(e){ if(/sessão expirada/.test(e.message)) throw e; console.log("[relatorio] escala de",d,e.message); falhou.push(d); }
      feitos++; info("Lendo as escalas no Phoenix: "+feitos+" de "+dias.length+" dia(s)...");
    };
    const fila=[...dias]; await Promise.all([0,1,2].map(async()=>{ while(fila.length) await lerDia(fila.shift()); }));
    if(falhou.length){ // dia que não carregou: usa a leitura da conferência só para ele
      try{ const resto=(await relChamar("linhas",falhou.sort()[0],falhou.sort().slice(-1)[0])).linhas||[]; resto.filter(l=>falhou.includes(l.data)).forEach(l=>linhas.push(l)); }
      catch(e){ throw new Error("não consegui ler a escala de "+falhou.map(d=>dataBR(d).slice(0,5)).join(", ")); }
    }
    const ros={}; for(const l of linhas) if(l.escala&&!ros[l.escala]) ros[l.escala]={servico:l.servico};
    // escala do Phoenix agrupada por guia, no formato da conferência do mapa
    const porG={};
    // fora da conferência: deslocamento de carro entre garagens (TRF GARAGEM ... / GARAGEM ...)
    // e apoio de volta
    const ignorar=(l)=>/GARAGEM/i.test(l.servico||"")||(l.auxiliar&&/VOLTA/i.test(l.servico||""));
    for(const l of linhas){
      const g=String(l.guia||"").trim(); if(!g||ignorar(l)) continue;
      const k2=normP(g); const x=porG[k2]=porG[k2]||{nome:g,doc:"",linhas:[]};
      x.linhas.push({data:l.data,hora:String(l.apresentacao||l.inicio||"").slice(0,5),ro:l.escala||"",modo:"",
        servico:l.auxiliar?("APOIO · "+l.servico):String(l.servico||""),veiculo:l.veiculo||"",motorista:String(l.motorista||"").trim(),valor:null,tipo:l.tipo||""});
    }
    const guias=Object.values(porG);
    // cada relatório é ligado a UM guia do Phoenix: nome igual; ou nome parecido (ex.: "Fabio" e
    // "FABIO COZZI") só quando esse guia tem, no mesmo dia, serviço do mesmo tipo do relatório.
    // Se não der para ter certeza, o relatório fica separado ("não achei na escala"), em vez de cair
    // no guia errado.
    const catsDoRel=(r)=>new Set((r.itens||[]).map(i=>catRel(i.servico)).filter(c=>c&&c!=="passeio").map(c=>String(c).startsWith("apoio")?"apoio":c));
    const catsDoDia=(g,d)=>new Set(g.linhas.filter(l=>l.data===d).map(l=>{ const c=catMapa(l.servico); return String(c).startsWith("apoio")?"apoio":c; }).filter(c=>c!=="passeio"));
    const dono=(r)=>{
      const N=normP(r.guia); if(!N) return null;
      const ex=guias.find(g=>normP(g.nome)===N); if(ex) return ex;
      let c=guias.filter(g=>nomeBate(r.guia,g.nome)||nomeBate(g.nome,r.guia));
      const cr=catsDoRel(r);
      if(cr.size) c=c.filter(g=>[...catsDoDia(g,r.data)].some(x=>cr.has(x)));
      else c=c.filter(g=>g.linhas.some(l=>l.data===r.data));
      if(c.length<=1) return c[0]||null;
      // mais de um guia possível: desempata pelo motorista do relatório e pelo nome mais completo
      const mots=new Set((r.itens||[]).map(i=>normP(i.motorista)).filter(Boolean));
      const pont=(g)=>g.linhas.filter(l=>l.data===r.data&&mots.has(normP(l.motorista))).length*10
        +(nomeBate(r.guia,g.nome)?2:0)+(nomeBate(g.nome,r.guia)?1:0);
      const notas=c.map(g=>({g,p:pont(g)})).sort((x,y)=>y.p-x.p);
      return notas[0].p>notas[1].p?notas[0].g:null;
    };
    const relDe={}, soltos=[];
    for(const r of rel){ const g=dono(r); if(g) (relDe[g.nome]=relDe[g.nome]||[]).push({...r,guia:g.nome}); else soltos.push(r); }
    // conferência guia a guia, só com os relatórios dele (assim o nome de um não cai no outro)
    const resultado=guias.map(g=>conferirMapa([g],relDe[g.nome]||[],ros)[0]);
    // relatórios ligados ao guia em dias sem escala dele, ou com apoio que a escala não tem
    for(const g of guias){
      const res=resultado.find(x=>x.nome===g.nome);
      for(const r of relDe[g.nome]||[]){
        const feitos=(r.itens||[]).filter(i=>!i.naoRealizado&&catRel(i.servico)&&catRel(i.servico)!=="passeio"); if(!feitos.length) continue;
        const doDia=g.linhas.filter(l=>l.data===r.data);
        const add=(i,det)=>res.alertas.push({tipo:"falta",data:r.data,ro:"",servico:relServico(i.servico),detalhe:det,valor:0});
        if(!doDia.length) feitos.forEach(i=>add(i,"O relatório diz que fez, mas não há escala desse guia no Phoenix nesse dia"));
        else if(!doDia.some(l=>/APOIO/i.test(l.servico))) feitos.filter(i=>String(catRel(i.servico)).startsWith("apoio")).forEach(i=>add(i,"O relatório tem apoio, mas a escala do Phoenix não tem apoio nesse dia"));
      }
    }
    // relatórios que não casaram com nenhum guia da escala
    for(const r of soltos){
      const feitos=(r.itens||[]).filter(i=>!i.naoRealizado&&catRel(i.servico)&&catRel(i.servico)!=="passeio"); if(!feitos.length) continue;
      const nome=String(r.guia||"(sem nome)").trim();
      let res=resultado.find(x=>x.solto&&normP(x.nome)===normP(nome));
      if(!res){ res={nome,total:0,qtd:0,alertas:[],semEscala:true,solto:true}; resultado.push(res); }
      feitos.forEach(i=>res.alertas.push({tipo:"falta",data:r.data,ro:"",servico:relServico(i.servico),detalhe:"Relatório com o nome \""+nome+"\" no app, mas não achei esse guia na escala do Phoenix nesse dia",valor:0}));
    }
    resultado.forEach(x=>x.alertas=x.alertas.filter(a=>a.tipo!=="zero"&&a.tipo!=="cnpj"&&!(ini===fim&&a.tipo==="nome")));
    const d={ini,fim,rel,linhas,guias,resultado,relDe,soltos,em:Date.now()}; RELT.dados[k]=d; return d;
  }

  function renderRelatorio(m){
    if(!RELT.dia) RELT.dia=relSomaDias(relHoje(),-1);
    if(!RELT.qid) RELT.qid=relQuinzenas()[0].qid;
    cab("Relatórios dos guias × escala do Phoenix","");
    const qs=relQuinzenas();
    m.innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">'
      +'<span class="chip '+(RELT.aba==="dia"?"on":"")+'" onclick="RELT.aba=\'dia\';renderRelatorio(document.getElementById(\'mainConteudo\'))">Relatórios do dia</span>'
      +'<span class="chip '+(RELT.aba==="quinzena"?"on":"")+'" onclick="RELT.aba=\'quinzena\';renderRelatorio(document.getElementById(\'mainConteudo\'))">Divergências da quinzena</span></div>'
      +'<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">'
      +(RELT.aba==="dia"
        ?'<input type="date" id="relDia" value="'+RELT.dia+'" max="'+relHoje()+'" onchange="RELT.dia=this.value;relAtualizar()" style="padding:8px 10px;border:1px solid var(--linha);border-radius:9px;font:inherit">'
        :'<select id="relQ" onchange="RELT.qid=this.value;relAtualizar()" style="padding:8px 10px;border:1px solid var(--linha);border-radius:9px;font:inherit">'+qs.map(q=>'<option value="'+q.qid+'"'+(q.qid===RELT.qid?" selected":"")+'>'+q.txt+'</option>').join("")+'</select>')
      +'<button class="btn" onclick="relAtualizar(true)">Conferir</button>'
      +'<input placeholder="Buscar guia..." value="'+esc(RELT.busca)+'" oninput="RELT.busca=this.value;relDesenhar()" style="padding:8px 10px;border:1px solid var(--linha);border-radius:9px;font:inherit;min-width:180px">'
      +'<span id="relInfo" style="font-size:.8rem;color:var(--muted)"></span></div>'
      +'<div id="relCorpo"></div>';
    relAtualizar();
  }
  function relPeriodo(){ if(RELT.aba==="dia") return [RELT.dia,RELT.dia]; const [i,f]=RELT.qid.split("_"); const h=relHoje(); return [i,f<h?f:h]; }
  async function relAtualizar(forcar){
    const [ini,fim]=relPeriodo(); const k=ini+"_"+fim; const info=(t)=>{ const e=document.getElementById("relInfo"); if(e) e.textContent=t; };
    if(forcar) delete RELT.dados[k];
    const corpo=document.getElementById("relCorpo"); if(!corpo) return;
    if(!RELT.dados[k]) corpo.innerHTML='<div class="card" style="color:var(--muted)">Carregando...</div>';
    try{ await relCarregar(ini,fim,info); const d=RELT.dados[k];
      info(d.rel.length+" relatório(s) · "+d.guias.length+" guia(s) escalado(s) · atualizado às "+new Date(d.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
      relDesenhar();
    }catch(e){ console.error(e); info(""); if(relPeriodo().join("_")===k) corpo.innerHTML='<div class="card" style="color:var(--alerta)">Não consegui conferir: '+esc(e.message)+'</div>'; }
  }
  function relPill(t,n){ const a=ALERTA[t]; return '<span style="font-size:.7rem;font-weight:800;color:'+a[2]+';background:'+a[1]+';border-radius:999px;padding:3px 9px;white-space:nowrap">'+(n!=null?n+" · ":"")+a[0]+'</span>'; }
  function relDesenhar(){
    const corpo=document.getElementById("relCorpo"); if(!corpo) return;
    const [ini,fim]=relPeriodo(); const d=RELT.dados[ini+"_"+fim]; if(!d) return;
    const bq=normP(RELT.busca);
    const R=d.resultado.filter(g=>!bq||normP(g.nome).includes(bq));
    const cont={}; d.resultado.forEach(g=>g.alertas.forEach(a=>cont[a.tipo]=(cont[a.tipo]||0)+1));
    const comPend=d.resultado.filter(g=>g.alertas.length);
    const kpi=(t)=>'<div class="resumo'+(cont[t]?' alerta':'')+'"><div class="num">'+(cont[t]||0)+'</div><div class="lbl">'+ALERTA[t][0]+'</div></div>';
    let h='<div class="cards-resumo"><div class="resumo ok"><div class="num">'+(d.resultado.length-comPend.length)+'</div><div class="lbl">Guias sem divergência</div></div>'+kpi("falta")+kpi("naofez")+kpi("semrelato")+kpi("pendente")+kpi("apoio")+'</div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'
      +'<span class="chip '+(RELT.filtro==="pend"?"on":"")+'" onclick="RELT.filtro=\'pend\';relDesenhar()">Com divergência ('+comPend.length+')</span>'
      +'<span class="chip '+(RELT.filtro==="todos"?"on":"")+'" onclick="RELT.filtro=\'todos\';relDesenhar()">Todos ('+d.resultado.length+')</span>'
      +'<button class="btn sec mini" style="margin-left:auto" onclick="relBaixar()">Baixar planilha</button></div>';
    h+='<p style="font-size:.8rem;color:var(--muted);margin-bottom:10px">Corrija no Phoenix e clique em Conferir de novo até zerar. Passeio não entra: não precisa de relatório.</p>';
    const lista=(RELT.filtro==="pend"?R.filter(g=>g.alertas.length):R).slice().sort((a,b)=>b.alertas.length-a.alertas.length||a.nome.localeCompare(b.nome));
    if(!lista.length) h+='<div class="card" style="color:var(--muted)">'+(R.length?"Nenhuma divergência. Tudo batendo com o Phoenix.":"Nenhum guia encontrado.")+'</div>';
    h+=lista.map(g=>relCartao(g,d)).join("");
    corpo.innerHTML=h;
  }
  function relCartao(g,d){
    const chave=normP(g.nome), ab=!!RELT.abertos[chave];
    const tipos={}; g.alertas.forEach(a=>tipos[a.tipo]=(tipos[a.tipo]||0)+1);
    const pills=Object.keys(tipos).length?Object.entries(tipos).map(([t,n])=>relPill(t,n)).join(" "):'<span style="font-size:.7rem;font-weight:800;color:var(--ok);background:#e3f2ee;border-radius:999px;padding:3px 9px">Tudo certo</span>';
    let det="";
    if(ab){
      if(g.alertas.length) det+='<div style="border-top:1px solid var(--linha);padding:4px 0">'+g.alertas.slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).map(a=>
        '<div style="display:grid;grid-template-columns:60px minmax(0,1.3fr) minmax(0,2fr) minmax(0,1.3fr);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha);font-size:.8rem">'
        +'<b>'+esc(a.data?dataBR(a.data).slice(0,5):"")+'</b><span>'+relPill(a.tipo)+'<br><span style="color:var(--muted)">'+esc(a.servico||"")+(a.ro?' · '+esc(a.ro):'')+'</span></span>'
        +'<span>'+esc(a.detalhe)+'</span><span style="color:var(--verde);font-weight:600">'+esc(ALERTA[a.tipo][3])+'</span></div>').join("")+'</div>';
      if(RELT.aba==="dia") det+=relLadoALado(g,d);
    }
    return '<div class="card" style="padding:10px 16px;margin-bottom:8px">'
      +'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer" onclick="RELT.abertos[\''+chave+'\']=!RELT.abertos[\''+chave+'\'];relDesenhar()">'
      +'<span>'+(ab?"▾":"▸")+'</span><div style="min-width:170px"><b>'+esc(g.nome)+'</b>'+(g.solto?'<div style="font-size:.72rem;color:var(--muted)">nome do app · não achei na escala do Phoenix</div>':'')+'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap">'+pills+'</div></div>'+det+'</div>';
  }
  // relatório do guia e escala do Phoenix lado a lado (visão do dia)
  function relLadoALado(g,d){
    const N=normP(g.nome);
    const rels=g.solto?d.soltos.filter(r=>normP(r.guia)===N):(d.relDe[g.nome]||[]);
    const esc2=(d.guias.find(x=>normP(x.nome)===N)||{linhas:[]}).linhas.slice().sort((a,b)=>a.hora.localeCompare(b.hora));
    const ITENS_CONHECIDOS=["servico","naoRealizado","motivo","motorista","recIdioma","_usado"];
    const itensRel=rels.flatMap(r=>r.itens||[]);
    const colR=itensRel.length?itensRel.map(i=>{
      const extra=Object.entries(i).filter(([k,v])=>!ITENS_CONHECIDOS.includes(k)&&v!=null&&v!==""&&typeof v!=="object"&&String(v).length<120).map(([k,v])=>esc(k)+": "+esc(v)).join(" · ");
      return '<div style="padding:7px 0;border-bottom:1px solid var(--linha)"><b>'+esc(relServico(i.servico))+'</b> '
        +(i.naoRealizado?'<span style="color:#8a4a0c;font-weight:700">não realizado</span>':'<span style="color:var(--ok);font-weight:700">feito</span>')
        +(i.motorista?' · motorista '+esc(i.motorista):'')+(i.recIdioma?' · idioma REC '+esc(i.recIdioma):'')
        +(i.motivo?'<div style="color:var(--muted)">Motivo: '+esc(i.motivo)+'</div>':'')+(extra?'<div style="color:var(--muted);font-size:.74rem">'+extra+'</div>':'')+'</div>';
    }).join(""):'<p style="color:var(--muted)">'+(rels.length?"Relatório sem serviços marcados.":"Sem relatório neste dia.")+'</p>';
    const colP=esc2.length?esc2.map(l=>'<div style="padding:7px 0;border-bottom:1px solid var(--linha)"><b>'+esc(l.hora||"--:--")+'</b> '+esc(l.servico)
      +'<div style="color:var(--muted);font-size:.74rem">'+esc(l.ro)+(l.veiculo?' · '+esc(l.veiculo):'')+(l.motorista?' · '+esc(l.motorista):'')+'</div></div>').join(""):'<p style="color:var(--muted)">Sem escala no Phoenix neste dia.</p>';
    return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;border-top:1px solid var(--linha);padding:10px 0 4px;font-size:.8rem">'
      +'<div><div style="font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Relatório do guia</div>'+colR+'</div>'
      +'<div><div style="font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Escala no Phoenix</div>'+colP+'</div></div>';
  }
  function relBaixar(){
    const [ini,fim]=relPeriodo(); const d=RELT.dados[ini+"_"+fim]; if(!d) return;
    const linhas=[["Guia","Data","Escala (RO)","Serviço","Situação","Detalhe","O que fazer"]];
    d.resultado.forEach(g=>g.alertas.forEach(a=>linhas.push([g.nome,a.data?dataBR(a.data):"",a.ro,a.servico,ALERTA[a.tipo][0],a.detalhe,ALERTA[a.tipo][3]])));
    const csv="\ufeff"+linhas.map(l=>l.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";")).join("\n");
    baixarArquivo("relatorios_x_phoenix_"+ini+(ini===fim?"":"_"+fim)+".csv",new Blob([csv],{type:"text/csv"}));
  }


  // ======================= CONSULTA DE RESERVAS e VAGAS (as mesmas consultas do bot) =======================
  const API_CONSULTA = "https://us-central1-operacional-luck.cloudfunctions.net/consulta";
  const CONS={ ultimas:[], vagasDia:null, vagas:{}, vagasReg:"todas" };
  async function chamarConsulta(acao,dados){
    const r=await fetch(API_CONSULTA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,...dados})});
    const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro||"erro"); return j;
  }
  const consHoje=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/Recife"}).format(new Date());

  // ---- Consulta de reservas ----
  function renderConsulta(m){
    cab("Dados da reserva, guia e motorista de cada serviço","");
    m.innerHTML='<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">'
      +'<input id="consRec" placeholder="Número da reserva (ex: 965965)" inputmode="numeric" style="flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--linha);border-radius:9px;font:inherit;font-size:1rem" onkeydown="if(event.key===\'Enter\')consBuscar()">'
      +'<button class="btn" id="consBtn" onclick="consBuscar()">Consultar</button></div>'
      +(CONS.ultimas.length?'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-6px 0 14px"><span style="font-size:.75rem;color:var(--muted)">Últimas:</span>'+CONS.ultimas.map(n=>'<span class="chip" onclick="document.getElementById(\'consRec\').value=\''+n+'\';consBuscar()">REC-'+n+'</span>').join("")+'</div>':'')
      +'<div id="consRes"></div>';
    const i=document.getElementById("consRec"); if(i) i.focus();

  async function consBuscar(){
    const i=document.getElementById("consRec"), b=document.getElementById("consBtn"), box=document.getElementById("consRes");
    const n=(String(i.value||"").match(/\d{4,}(?:\.\d{1,3})?/)||[""])[0]; if(!n){ alert("Digite o número da reserva."); return; }
    b.disabled=true; box.innerHTML='<div class="card" style="color:var(--muted)">Consultando a REC-'+n+' no Phoenix...</div>';
    try{
      const r=await chamarConsulta("reserva",{numero:n});
      CONS.ultimas=[n,...CONS.ultimas.filter(x=>x!==n)].slice(0,6);
      box.innerHTML=r.encontrada?consCartao(r):'<div class="card">Não encontrei a reserva <b>REC-'+esc(n)+'</b>. Confira o número.</div>';
    }catch(e){ box.innerHTML='<div class="card" style="color:var(--alerta)">Não consegui consultar: '+esc(e.message)+'</div>'; }
    finally{ b.disabled=false; }
  }
  function consOrigem(v){ if(v.origem&&v.origem.tipo==="pdv") return "Venda PDV · lançada por "+esc(v.origem.quem); if(v.origem&&v.origem.tipo==="operadora") return "Incluso · "+esc(v.origem.quem); return ""; }
  function consServicos(lista){
    const ic={IN:"✈️",OUT:"✈️",TOUR:"🏖️",TRANSFER:"🚐",PACOTE:"🎟️"};
    if(!(lista||[]).length) return '<div style="font-size:.82rem;color:var(--muted);padding:10px 0;border-top:1px solid var(--linha)">Nenhum serviço nesta venda.</div>';
    return lista.map(s=>{
      let esc2="";
      if(s.situacao==="escalado") esc2='<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:.82rem"><span>🚐 <b>'+esc(s.motorista||"-")+'</b>'+(s.veiculo?' · '+esc(s.veiculo):'')+'</span><span>🧭 Guia: <b>'+esc(s.guia||"(sem guia)")+'</b></span>'+(s.ro?'<span style="color:var(--muted)">'+esc(s.ro)+'</span>':'')+'</div>';
      else if(s.situacao==="pacote") esc2='<div style="font-size:.8rem;color:var(--muted);margin-top:6px">Pacote: os passeios escolhidos aparecem separados.</div>';
      else if(s.situacao==="sem-registro") esc2='<div style="font-size:.8rem;color:var(--muted);margin-top:6px">Sem escala registrada.</div>';
      else if(s.situacao==="indisponivel") esc2='<div style="font-size:.8rem;color:var(--alerta);margin-top:6px">A escala não carregou'+(s.motivo?': '+esc(s.motivo):'')+'.</div>';
      else esc2='<div style="font-size:.8rem;color:#8a4a0c;font-weight:700;margin-top:6px">Ainda não escalado.</div>';
      const apr=s.tipo==="OUT"&&s.apresentacao?(()=>{ const [d,h]=s.apresentacao.split(" "); return '<div style="font-size:.82rem;margin-top:4px">🕐 Apresentação no hotel: <b>'+esc(h)+'</b>'+(d!==s.data?' ('+esc(d)+')':'')+'</div>'; })():'';
      return '<div style="padding:12px 0;border-top:1px solid var(--linha)">'
        +'<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span>'+(ic[s.tipo]||"•")+'</span><b>'+esc(s.nome||s.tipo)+'</b>'
        +'<span style="font-size:.82rem;color:var(--muted)">'+esc(s.data)+(s.horario?' '+esc(s.horario):'')+(s.voo?' · voo '+esc(s.voo):'')+(s.modo?' · '+esc(s.modo):'')+'</span></div>'
        +apr+(s.obs?'<div style="font-size:.82rem;margin-top:4px;color:var(--muted)">📝 '+esc(s.obs)+'</div>':'')+esc2+'</div>';
    }).join("");
  }
  function consAviso(st){ return st&&/rascunho|cancel|pendente/i.test(st)?'<div style="background:#fff1e0;color:#8a4a0c;border-radius:10px;padding:8px 12px;font-weight:700;font-size:.85rem;margin-bottom:10px">⚠️ '+esc(st)+'</div>':''; }
  function consCartao(r){
    const linha=(rot,val)=>val?'<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--linha);font-size:.86rem"><span style="min-width:110px;color:var(--muted)">'+rot+'</span><b style="font-weight:600">'+val+'</b></div>':'';
    // ordem: reserva mãe primeiro (REC-767019), depois as filhas (.1, .2...)
    const todas=[r,...(r.outras||[])].sort((a,b)=>a.codigo.localeCompare(b.codigo,"pt",{numeric:true}));
    const topo=todas.find(v=>!v.naoAbriu)||r;
    const tel=topo.telefone?esc(topo.telefone)+' <a href="https://wa.me/'+String(topo.telefone).replace(/\D/g,"")+'" target="_blank" style="color:var(--verde);font-weight:700;margin-left:6px">WhatsApp</a>':'';
    const ancora=(v)=>'cv-'+esc(v.codigo).replace(/\W/g,"");
    let h='<div class="card">'
      +linha("Cliente",esc(topo.cliente||"-"))+linha("Telefone",tel)+linha("Idioma",esc(topo.idioma||""));
    if(todas.length>1) h+='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px"><span style="font-size:.78rem;color:var(--muted)">Vendas da mesma reserva:</span>'
      +todas.map(v=>'<span class="chip'+(v.codigo===r.codigo?' on':'')+'" onclick="document.getElementById(\''+ancora(v)+'\').scrollIntoView({behavior:\'smooth\'})">'+esc(v.codigo)+'</span>').join("")+'</div>';
    todas.forEach((v,k)=>{
      h+='<div id="'+ancora(v)+'" style="'+(k?'border-top:2px solid var(--linha);':'')+'margin-top:'+(k?'18px':'14px')+'">'
        +'<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:'+(k?'18px':'4px')+' 0 4px">'
        +'<h3 style="font-size:1.15rem;font-weight:800">'+esc(v.codigo)+'</h3>'
        +(consOrigem(v)?'<span style="font-size:.8rem;color:var(--muted)">'+consOrigem(v)+'</span>':'')

        +(v.codigo===r.codigo&&todas.length>1?'<span style="font-size:.72rem;font-weight:800;color:var(--verde)">· a que você consultou</span>':'')+'</div>';
      if(v.naoAbriu) h+='<div style="font-size:.82rem;color:var(--muted)">Não consegui abrir esta venda. <a href="#" style="color:var(--verde);font-weight:700" onclick="document.getElementById(\'consRec\').value=\''+esc(v.codigo)+'\';consBuscar();return false">Consultar só ela</a></div>';
      else{
        if(v.cliente&&normP(v.cliente)!==normP(topo.cliente)) h+='<div style="font-size:.82rem;margin-bottom:4px">Cliente: <b>'+esc(v.cliente)+'</b></div>';
        if(!(v.servicos||[]).length&&/rascunho/i.test(v.status||"")) h+='<div style="background:#fff1e0;color:#8a4a0c;border-radius:10px;padding:10px 12px;font-size:.85rem;margin-top:6px"><b>⚠️ Venda em rascunho</b> · ainda não foi finalizada no PDV (por exemplo, aguardando autorização de desconto). Os serviços aparecem aqui quando ela for finalizada.</div>';
        else h+=consAviso(v.status)+consServicos(v.servicos);
      }
      h+='</div>';
    });
    return h+'</div>';
  }

  // ---- Envio das vagas nos grupos de WhatsApp ----
  const VAG_DEST={ porto:{rot:"Porto",grupos:"VAGAS PASSEIOS SAINDO DE PORTO"}, recife:{rot:"Recife",grupos:"Phoenix Recife e Informativos Luck"} };
  const VAGENV={ previa:null, hist:{}, enviando:false };
  function vagPodeEnviar(d){ return USUARIO.admin||(USUARIO.areas||[]).includes("central")||(d==="porto"&&(USUARIO.areas||[]).includes("porto")); }
  function vagPainelEnvio(){
    const dests=Object.keys(VAG_DEST).filter(vagPodeEnviar); if(!dests.length) return "";
    const hist=VAGENV.hist[CONS.vagasDia]||{};
    let h='<div class="card" style="margin-bottom:16px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:.9rem">📲 Enviar nos grupos</b>'
      +dests.map(d=>'<button class="btn sec mini" onclick="vagPrevia(\''+d+'\')">'+VAG_DEST[d].rot+'</button>'+(hist[d]?'<span style="font-size:.74rem;color:var(--ok)">enviado às '+new Date(hist[d].em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+' por '+esc(hist[d].por||"")+'</span>':'')).join("")+'</div>';
    const p=VAGENV.previa;
    if(p&&p.dia===CONS.vagasDia){
      h+='<div style="margin-top:12px;border-top:1px solid var(--linha);padding-top:12px">'
        +'<div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">Prévia · vai para: <b>'+esc(VAG_DEST[p.destino].grupos)+'</b></div>'
        +(p.carregando?'<div style="color:var(--muted);font-size:.85rem">Montando a mensagem...</div>'
          :p.erro?'<div style="color:var(--alerta);font-size:.85rem">'+esc(p.erro)+'</div>'
          :'<pre style="white-space:pre-wrap;font-family:inherit;font-size:.84rem;background:#f3f7f5;border-radius:10px;padding:12px;max-height:340px;overflow:auto">'+esc(p.texto)+'</pre>'
            +(p.resultado?'<div style="font-size:.84rem;margin-top:8px">'+p.resultado.map(x=>(x.ok?'✅ ':'⚠️ ')+esc(x.grupo)+(x.ok?'':' — '+esc(x.erro))).join("<br>")+'</div>'
              :'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" '+(VAGENV.enviando?'disabled':'')+' onclick="vagEnviar()">'+(VAGENV.enviando?'Enviando...':'Enviar agora')+'</button><button class="btn sec" onclick="VAGENV.previa=null;vagDesenhar()">Cancelar</button></div>'))
        +'</div>';
    }
    return h+'</div>';
  }
  async function vagHistorico(dia){
    try{ const j=await chamarConsulta("vagasHistorico",{data:dia}); VAGENV.hist[dia]=j.envios||{}; if(CONS.vagasDia===dia) vagDesenhar(); }catch(e){}
  }
  async function vagPrevia(destino){
    const dia=CONS.vagasDia; VAGENV.previa={destino,dia,carregando:true}; vagDesenhar();
    try{ const j=await chamarConsulta("vagasTexto",{data:dia,destino}); if(VAGENV.previa&&VAGENV.previa.dia===dia) VAGENV.previa={destino,dia,texto:j.texto}; }
    catch(e){ VAGENV.previa={destino,dia,erro:"Não consegui montar a mensagem: "+e.message}; }
    vagDesenhar();
  }
  async function vagEnviar(){
    const p=VAGENV.previa; if(!p||VAGENV.enviando) return;
    if(!confirm("Enviar as vagas de "+dataBR(p.dia)+" para "+VAG_DEST[p.destino].grupos+"?")) return;
    VAGENV.enviando=true; vagDesenhar();
    try{ const j=await chamarConsulta("vagasEnviar",{data:p.dia,destino:p.destino}); p.resultado=j.enviados||[]; vagHistorico(p.dia); }
    catch(e){ p.resultado=[{grupo:"Envio",ok:false,erro:e.message}]; }
    VAGENV.enviando=false; vagDesenhar();
  }

  // ---- Vagas nos passeios ----
  function renderVagas(m, area){
    if(!CONS.vagasDia) CONS.vagasDia=consHoje();
    if(area==="porto"&&CONS.vagasReg==="todas") CONS.vagasReg="PORTO DE GALINHAS";
    cab("Vagas livres nos passeios do dia (já descontados guia e, nos passeios saindo de Porto exceto Maragogi, o fotógrafo; sem privativos)","");
    m.innerHTML='<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">'
      +'<button class="btn sec mini" onclick="consMudaDia(-1)">‹</button>'
      +'<input type="date" id="vagDia" value="'+CONS.vagasDia+'" onchange="CONS.vagasDia=this.value;vagCarregar()" style="padding:8px 10px;border:1px solid var(--linha);border-radius:9px;font:inherit">'

  function consMudaDia(n){ const d=new Date(CONS.vagasDia+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); CONS.vagasDia=d.toISOString().slice(0,10); const i=document.getElementById("vagDia"); if(i) i.value=CONS.vagasDia; vagCarregar(); }
  async function vagCarregar(forcar){
    const dia=CONS.vagasDia, box=document.getElementById("vagRes"), info=document.getElementById("vagInfo"); if(!box) return;
    vagHistorico(dia);
    const c=CONS.vagas[dia];
    if(c&&!forcar&&Date.now()-c.em<5*60e3){ vagDesenhar(); return; }
    box.innerHTML='<div class="card" style="color:var(--muted)">Lendo a escala dos passeios no Phoenix...</div>'; if(info) info.textContent="";
    try{ const r=await chamarConsulta("vagas",{data:dia}); CONS.vagas[dia]={...r,em:Date.now()}; if(CONS.vagasDia===dia) vagDesenhar(); }
    catch(e){ if(CONS.vagasDia===dia) box.innerHTML='<div class="card" style="color:var(--alerta)">Não consegui ler as vagas: '+esc(e.message)+'</div>'; }
  }
  function vagDesenhar(){
    const r=CONS.vagas[CONS.vagasDia], box=document.getElementById("vagRes"), info=document.getElementById("vagInfo"); if(!r||!box) return;
    if(info) info.textContent="atualizado às "+new Date(r.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    if(!r.regioes.length){ box.innerHTML='<div class="card" style="color:var(--muted)">Nenhum passeio escalado com guia em '+dataBR(r.data)+'.</div>'; return; }
    const regs=r.regioes.map(x=>x.regiao);
    let h=vagPainelEnvio()+'<div class="cards-resumo"><div class="resumo ok"><div class="num">'+r.totalVagas+'</div><div class="lbl">Vagas livres no dia</div></div>'
      +r.regioes.map(x=>'<div class="resumo"><div class="num">'+x.passeios.reduce((s,p)=>s+p.vagas,0)+'</div><div class="lbl">'+esc(x.regiao)+'</div></div>').join("")+'</div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><span class="chip '+(CONS.vagasReg==="todas"?"on":"")+'" onclick="CONS.vagasReg=\'todas\';vagDesenhar()">Todas as saídas</span>'
      +regs.map(g=>'<span class="chip '+(CONS.vagasReg===g?"on":"")+'" onclick="CONS.vagasReg=\''+g+'\';vagDesenhar()">'+esc(g.charAt(0)+g.slice(1).toLowerCase())+'</span>').join("")+'</div>';
    for(const x of r.regioes){
      if(CONS.vagasReg!=="todas"&&CONS.vagasReg!==x.regiao) continue;
      h+='<div style="font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px">📍 '+esc(x.regiao)+'</div>';
      h+=x.passeios.map(p=>'<div class="card" style="padding:12px 16px;margin-bottom:8px">'
        +'<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap"><b>🏖️ '+esc(p.nome)+'</b><span style="font-size:.8rem;font-weight:800;color:'+(p.vagas?"var(--ok)":"var(--alerta)")+'">'+(p.vagas?p.vagas+" vaga(s)":"lotado")+'</span></div>'
        +p.carros.map(c=>'<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--linha);margin-top:6px;font-size:.84rem">'
          +'<span style="min-width:150px">🚐 '+esc(c.veiculo||"-")+'</span><span style="flex:1;min-width:140px">🧭 '+esc(c.guia||"-")+'</span>'
          +'<span style="color:var(--muted);min-width:90px">'+(c.capacidade!=null?c.pax+"/"+c.capacidade+" pax":"")+'</span>'
          +(c.vagas>0?'<span style="font-weight:800;color:var(--ok);min-width:80px;text-align:right">'+c.vagas+' vaga(s)</span>':'<span style="font-weight:800;color:var(--alerta);min-width:80px;text-align:right">🔴 lotado</span>')+'</div>').join("")
        +'</div>').join("");
    }
    box.innerHTML=h;
  }


  // ======================= OPERACIONAL RECIFE: OBSERVAÇÕES ESPECIAIS =======================
  // Do dia: observações que o box não pode esquecer (criança/cadeirinha, cadeirante, idoso...), por tipo.
  // Relatório: observações digitadas de forma errada, por quem digitou, no período.
  const OBS={ aba:"dia", dia:null, cat:"todas", dados:{}, mes:null, rel:{}, busca:"" };
  // as observações com problema ficam fora da tela por enquanto (regras em ajuste); mude para true para voltar
  const OBS_MOSTRAR_ERROS=false;
  const OBS_COR={crianca:["#fde7d3","#8a3b0b"],mobilidade:["#dbe7fb","#1e3a8a"],idoso:["#ece3fb","#5b2a9c"],gestante:["#fbd9e3","#8a1538"],celebracao:["#fff1b8","#7a5600"],alergia:["#fde0dc","#9a2a1c"],bagagem:["#e8ecea","#3c4a46"],vip:["#dcefe9","#0b4f44"]};
  function renderObs(m){
    if(!OBS.dia) OBS.dia=consHoje();
    if(!OBS.mes) OBS.mes=OBS.dia.slice(0,7);
    if(!OBS_MOSTRAR_ERROS) OBS.aba="dia";
    cab(OBS_MOSTRAR_ERROS?"Lembretes para o box e observações digitadas com erro":"Lembretes para o box: reservas com observação especial","");
    m.innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'
      +'<span class="chip '+(OBS.aba==="dia"?"on":"")+'" onclick="OBS.aba=\'dia\';renderObs(document.getElementById(\'mainConteudo\'))">Do dia</span>'
      +(OBS_MOSTRAR_ERROS?'<span class="chip '+(OBS.aba==="rel"?"on":"")+'" onclick="OBS.aba=\'rel\';renderObs(document.getElementById(\'mainConteudo\'))">Relatório de observações erradas</span>':'')+'</div>'
      +(OBS.aba==="dia"
        ?'<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn sec mini" onclick="obsMudaDia(-1)">‹</button><input type="date" value="'+OBS.dia+'" onchange="OBS.dia=this.value;obsCarregar()" style="padding:8px 10px;border:1px solid var(--linha);border-radius:9px;font:inherit"><button class="btn sec mini" onclick="obsMudaDia(1)">›</button><button class="btn" onclick="obsCarregar(true)">Atualizar do Phoenix</button><span id="obsInfo" style="font-size:.8rem;color:var(--muted)"></span></div>'
        :'<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:.9rem">Mês</b><input type="month" value="'+OBS.mes+'" onchange="OBS.mes=this.value;obsCarregarRel()" style="padding:8px 10px;border:1px solid var(--linha);border-radius:9px;font:inherit"><button class="btn sec" onclick="delete OBS.rel[OBS.mes];obsCarregarRel()">Atualizar</button><span id="obsInfo" style="font-size:.8rem;color:var(--muted)"></span></div>')
      +'<div id="obsCorpo"></div>';
    if(OBS.aba==="dia") obsCarregar(); else obsCarregarRel();
  }
  function obsMudaDia(n){ const d=new Date(OBS.dia+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); OBS.dia=d.toISOString().slice(0,10); renderObs(document.getElementById("mainConteudo")); }
  async function obsCarregar(forcar){
    const dia=OBS.dia, box=document.getElementById("obsCorpo"); if(!box) return;
    if(OBS.dados[dia]&&!forcar){ obsDesenhar(); return; }
    box.innerHTML='<div class="card" style="color:var(--muted)">Lendo as observações das reservas no Phoenix... pode levar 1 a 2 minutos.</div>';
    try{ const j=await chamarConsulta("obsDia",{data:dia}); OBS.dados[dia]=j; OBS.cats=j.categorias; if(OBS.dia===dia) obsDesenhar(); }
    catch(e){ if(OBS.dia===dia) box.innerHTML='<div class="card" style="color:var(--alerta)">Não consegui ler: '+esc(e.message)+'</div>'; }
  }
  function obsLinha(x,extra){
    const hora=x.hApr&&x.hApr!=="00:00"?x.hApr:(x.hVoo||"");
    return '<div style="padding:10px 0;border-top:1px solid var(--linha)">'
      +'<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><b style="min-width:46px;color:var(--verde-esc)">'+esc(hora||"--:--")+'</b>'
      +'<b>'+esc(x.servico||"")+'</b><span style="font-size:.8rem;color:var(--muted)">'+esc(x.rec)+' · '+esc(x.cliente||"")+(x.pax?' · '+esc(x.pax):'')+(x.voo?' · voo '+esc(x.voo):'')+'</span></div>'
      +'<div style="font-size:.86rem;margin:4px 0 0 56px">“'+esc(x.obs)+'”</div>'
      +'<div style="font-size:.76rem;color:var(--muted);margin:3px 0 0 56px">'+[x.hotel,x.veiculo?("🚐 "+x.veiculo+(x.motorista?" · "+x.motorista:"")):"",x.guia?("🧭 "+x.guia):""].filter(Boolean).map(esc).join(" · ")+'</div>'
      +(extra||"")+'</div>';
  }
  function obsDesenhar(){
    const box=document.getElementById("obsCorpo"), info=document.getElementById("obsInfo"); const d=OBS.dados[OBS.dia]; if(!box||!d) return;
    if(info) info.textContent="lido às "+new Date(d.em).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    const cats=OBS.cats||d.categorias||[]; const nomeCat=(id)=>(cats.find(c=>c.id===id)||{}).nome||id;
    const cont={}; d.especiais.forEach(x=>x.cats.forEach(c=>cont[c]=(cont[c]||0)+1));
    let h='<div class="cards-resumo"><div class="resumo"><div class="num">'+d.especiais.length+'</div><div class="lbl">Serviços com observação especial</div></div>'
      +(OBS_MOSTRAR_ERROS?'<div class="resumo'+(d.erros.length?' alerta':'')+'"><div class="num">'+d.erros.length+'</div><div class="lbl">Observações com problema</div></div>':'')+'</div>';
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><span class="chip '+(OBS.cat==="todas"?"on":"")+'" onclick="OBS.cat=\'todas\';obsDesenhar()">Todas ('+d.especiais.length+')</span>'
      +cats.filter(c=>cont[c.id]).map(c=>'<span class="chip '+(OBS.cat===c.id?"on":"")+'" onclick="OBS.cat=\''+c.id+'\';obsDesenhar()">'+esc(c.nome)+' ('+cont[c.id]+')</span>').join("")+'</div>';
    const lista=d.especiais.filter(x=>OBS.cat==="todas"||x.cats.includes(OBS.cat)).slice().sort((a,b)=>String(a.hApr||a.hVoo||"99").localeCompare(String(b.hApr||b.hVoo||"99")));
    if(!lista.length) h+='<div class="card" style="color:var(--muted)">Nenhuma observação especial neste dia.</div>';
    else h+='<div class="card" style="padding:6px 18px 10px">'+lista.map(x=>obsLinha(x,'<div style="display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 0 56px">'+x.cats.map(c=>{ const k=OBS_COR[c]||["#eef1f0","#3c524d"]; return '<span style="font-size:.7rem;font-weight:800;background:'+k[0]+';color:'+k[1]+';border-radius:6px;padding:2px 7px">'+esc(nomeCat(c))+'</span>'; }).join("")+'</div>')).join("")+'</div>';
    if(OBS_MOSTRAR_ERROS&&d.erros.length){
      h+='<h3 style="font-size:1rem;margin:18px 0 8px">Observações digitadas com problema ('+d.erros.length+')</h3>';
      h+='<div class="card" style="padding:6px 18px 10px">'+d.erros.map(x=>obsLinha(x,'<div style="margin:6px 0 0 56px;font-size:.8rem"><b style="color:#8a4a0c">'+x.motivos.map(esc).join(" · ")+'</b><br><span style="color:var(--muted)">Digitado por: '+esc(x.criadoPor||x.quem||"não identificado")+'</span></div>')).join("")+'</div>';
    }
    box.innerHTML=h;
  }
  async function obsCarregarRel(){
    const mes=OBS.mes, box=document.getElementById("obsCorpo"); if(!box) return;
    if(OBS.rel[mes]){ obsDesenharRel(); return; }
    box.innerHTML='<div class="card" style="color:var(--muted)">Carregando o mês...</div>';
    const ult=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();
    try{ const j=await chamarConsulta("obsRelatorio",{ini:mes+"-01",fim:mes+"-"+String(ult).padStart(2,"0")}); OBS.rel[mes]=j; if(OBS.mes===mes) obsDesenharRel(); }
    catch(e){ box.innerHTML='<div class="card" style="color:var(--alerta)">Não consegui carregar: '+esc(e.message)+'</div>'; }
  }
  function obsDesenharRel(){
    const box=document.getElementById("obsCorpo"), info=document.getElementById("obsInfo"); const r=OBS.rel[OBS.mes]; if(!box||!r) return;
    if(info) info.textContent=r.dias+" dia(s) analisado(s) no mês";
    const quem=(e)=>e.criadoPor||e.quem||"Não identificado";
    const por={}; r.erros.forEach(e=>{ const k=quem(e); const x=por[k]=por[k]||{nome:k,total:0,motivos:{},itens:[]}; x.total++; x.itens.push(e); e.motivos.forEach(m=>{ const t=m.replace(/\s*\(.*\)\s*$/,""); x.motivos[t]=(x.motivos[t]||0)+1; }); });
    const lista=Object.values(por).sort((a,b)=>b.total-a.total);
    let h='<div class="cards-resumo"><div class="resumo'+(r.erros.length?' alerta':'')+'"><div class="num">'+r.erros.length+'</div><div class="lbl">Observações com problema no mês</div></div><div class="resumo"><div class="num">'+lista.length+'</div><div class="lbl">Pessoas / origens</div></div></div>';
    if(!lista.length) h+='<div class="card" style="color:var(--muted)">Nenhuma observação com problema registrada neste mês.</div>';
    else{
      h+='<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn sec mini" onclick="obsBaixarRel()">Baixar planilha</button></div>';
      h+=lista.map(x=>'<details class="card" style="padding:12px 18px"><summary style="cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b style="min-width:200px">'+esc(x.nome)+'</b><span style="font-size:.8rem;font-weight:800;color:#8a4a0c">'+x.total+' observação(ões)</span><span style="font-size:.76rem;color:var(--muted)">'+Object.entries(x.motivos).map(([m,n])=>esc(m)+": "+n).join(" · ")+'</span></summary>'
        +x.itens.map(e=>obsLinha(e,'<div style="margin:6px 0 0 56px;font-size:.8rem;color:#8a4a0c;font-weight:700">'+esc(dataBR(e.data).slice(0,5))+' · '+e.motivos.map(esc).join(" · ")+'</div>')).join("")+'</details>').join("");
    }
    box.innerHTML=h;
  }
  function obsBaixarRel(){
    const r=OBS.rel[OBS.mes]; if(!r) return;
    const L=[["Data","REC","Cliente","Serviço","Observação","Problema","Digitado por","Vendedor/Origem"]];
    r.erros.forEach(e=>L.push([dataBR(e.data),e.rec,e.cliente,e.servico,e.obs,e.motivos.join(" | "),e.criadoPor||"",e.quem||""]));
    const csv="\ufeff"+L.map(l=>l.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";")).join("\n");
    baixarArquivo("observacoes_erradas_"+OBS.mes+".csv",new Blob([csv],{type:"text/csv"}));
  }


  // ======================= APOIO AO BOX =======================
  // O Box cria os apoios do dia (quantos, início, Full/Half, idioma); a Central coloca o guia e avisa.
  // Com guia, o apoio entra sozinho no histórico e no pagamento do guia.
  const API_APOIOBOX="https://us-central1-operacional-luck.cloudfunctions.net/apoiobox";
  const ABX={ dia:null, apoios:[], valores:null, carregando:false };
  const abxCentral=()=>USUARIO.admin||(USUARIO.areas||[]).includes("central");
  async function chamarApoioBox(acao,dados){
    const r=await fetch(API_APOIOBOX,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,token:USUARIO.token,data:ABX.dia,...dados})});
    const j=await r.json(); if(sessaoExpirou(j)) throw new Error("sessão expirada"); if(!j.ok) throw new Error(j.erro||"erro"); return j;
