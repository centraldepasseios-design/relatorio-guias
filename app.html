<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5444">
<link rel="manifest" href="manifest-guia.json">
<link rel="icon" href="icone-guia-192.png">
<link rel="apple-touch-icon" href="icone-guia-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guia Luck">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Luck · App do Guia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--verde:#0e7c6b;--escuro:#0d3b30;--claro:#e3f2ee;--bg:#f1f6f3;--tinta:#0d3b30;--muted:#64817a;--linha:#e1ece6;--borda:#bfdccf;
        --saida:#e07a3a;--chegada:#2a7fd4;--apoio:#9a6bd4;--passeio:#0e9f7e;--trf:#64817a;--alerta:#b3261e;--aviso:#a3501a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--tinta);background:var(--bg);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:15px}
  .topo{background:linear-gradient(160deg,#0a5444 0%,#0e7c6b 55%,#3fb984 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 64px}
  .topo .linha{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:520px;margin:0 auto}
  .topo .ola{font-size:13px;font-weight:700;color:#d5f0e4} .topo .nome{font-size:26px;font-weight:900;letter-spacing:-.4px}
  .topo .sair{background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:800;border-radius:12px;padding:9px 14px;cursor:pointer}
  .folha{max-width:520px;margin:-44px auto 0;padding:0 14px calc(100px + env(safe-area-inset-bottom,0px));position:relative}
  .card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(13,59,48,.08);margin-bottom:12px}
  .muted{color:var(--muted)} .peq{font-size:13px} .tit{font-size:17px;font-weight:900;margin:0 0 4px}
  .btn{display:block;width:100%;height:50px;border:none;border-radius:16px;background:var(--verde);color:#fff;font-weight:900;font-size:15px;cursor:pointer}
  .btn.sec{background:#fff;border:2px solid var(--verde);color:var(--verde)} .btn:disabled{opacity:.6}
  .mini{border:1.5px solid var(--borda);background:#fff;color:var(--verde);font-weight:800;border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer}
  .pilulas{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
  .pilula{flex:0 0 auto;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.16);color:#dcf3e8;border:none;cursor:pointer}
  .pilula b{font-size:17px;font-weight:900} .pilula span{font-size:10px;font-weight:800;letter-spacing:.06em}
  .pilula.on{background:#fff;color:var(--escuro)}
  .serv{display:flex;gap:12px;margin-bottom:12px}
  .serv .hora{width:58px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:4px}
  .serv .hora b{font-size:19px;font-weight:900} .serv .hora span{font-size:10px;font-weight:800;color:var(--muted);text-align:center}
  .serv .corpo{flex:1;min-width:0;background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(13,59,48,.08);border-left:5px solid var(--trf);display:flex;flex-direction:column;gap:5px}
  .tag{font-size:10px;font-weight:900;letter-spacing:.08em}
  .det{font-size:13px;color:#4c6a62}
  .obs{font-size:12px;background:#fff4e8;color:var(--aviso);border-radius:10px;padding:6px 10px}
  .seg{display:flex;background:#e3f2ee;border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;border:none;background:transparent;border-radius:10px;padding:9px 6px;font-weight:800;color:var(--muted);cursor:pointer;font-size:13px}
  .seg button.on{background:#fff;color:var(--escuro);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .chip{font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;display:inline-block}
  input[type=text],input[type=password],input[type=search],select,textarea{width:100%;border:1.5px solid var(--borda);border-radius:12px;padding:12px 14px;background:#fff;color:var(--tinta)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde)}
  label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:#3c524d}
  nav.abas{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;height:64px;background:var(--escuro);border-radius:22px;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;box-shadow:0 10px 24px rgba(13,59,48,.25);z-index:20}
  nav.abas button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#a9c7bb;font-size:9.5px;padding:0;font-weight:800;cursor:pointer}
  nav.abas button.on{color:#86e6b8}
  .vazio{text-align:center;padding:26px 10px;color:var(--muted);font-size:14px}
  .esqueleto{height:84px;border-radius:18px;background:linear-gradient(90deg,#e6efea 25%,#f4f8f6 50%,#e6efea 75%);background-size:200% 100%;animation:brilho 1.2s infinite;margin-bottom:12px}
  @keyframes brilho{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .toggle{display:flex;gap:6px} .toggle button{flex:1;padding:10px 0;border-radius:12px;border:none;background:var(--bg);color:#4c6a62;font-weight:800;cursor:pointer}
  .toggle button.on.fiz{background:var(--verde);color:#fff} .toggle button.on.rs{background:#d97a1e;color:#fff} .toggle button.on.ns{background:var(--alerta);color:#fff}
  .login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:440px;margin:0 auto}
  .login .logo{width:62px;height:62px;border-radius:18px;background:var(--verde);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .erro{color:var(--alerta);font-size:13px;font-weight:700;margin-top:8px}
  .tut{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#0a5444 0%,#0e7c6b 55%,#3fb984 100%);color:#fff;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
  .tut .pular{align-self:flex-end;background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:800;border-radius:12px;padding:9px 14px;cursor:pointer}
  .tut .meio{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto;width:100%}
  .tut .ic{width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
  .tut h2{font-size:28px;font-weight:900;margin:0 0 12px;letter-spacing:-.4px} .tut p{font-size:16px;line-height:1.5;color:#e2f5ec;margin:0 0 10px}
  .tut .dica{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;font-size:14px;color:#fff;margin-top:8px}
  .tut .pontos{display:flex;gap:6px;justify-content:center;margin:18px 0}
  .tut .pontos span{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35)} .tut .pontos span.on{width:22px;background:#fff}
  .tut .btn{background:#fff;color:#0d3b30;max-width:440px;margin:0 auto}
  .fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .folha-baixo{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
  // link do voo no FlightAware: ele só acha o voo certo com o código da companhia de 3 letras (ICAO).
  // Ex.: G3 1586 -> GLO1586 (Gol). Companhia fora da lista: abre a busca do Google com o voo.
  const ICAO={G3:"GLO",AD:"AZU",LA:"TAM",JJ:"TAM","2Z":"PTB",TP:"TAP",AR:"ARG",CM:"CMP",AA:"AAL",UA:"UAL",DL:"DAL",AF:"AFR",KL:"KLM",IB:"IBE",UX:"AEA",AV:"AVA",H2:"SKU",JA:"JAT",LH:"DLH"};
  function linkVoo(v){
    const m=String(v||"").toUpperCase().replace(/[\s-]/g,"").match(/^([A-Z0-9]{2})(\d{1,4})$/);
    if(!m||!ICAO[m[1]]) return "https://www.google.com/search?q=voo+"+encodeURIComponent(v||"");
    return "https://flightaware.com/live/flight/"+ICAO[m[1]]+m[2];
  }

const API="https://us-central1-operacional-luck.cloudfunctions.net/app";
const S={t:localStorage.getItem("ag_t"),nome:localStorage.getItem("ag_nome"),pag:localStorage.getItem("ag_pag"),aba:"escala",dia:null,relDia:null,histFiltro:"atual",cache:{}};
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=(v)=>"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const hoje=()=>{const d=new Date(Date.now()-3*3600e3);return d.toISOString().slice(0,10);};
const soma=(iso,n)=>{const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const dd=(iso)=>iso.slice(8,10)+"/"+iso.slice(5,7);
const SEM=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"], SEMX=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"], MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const diaLongo=(iso)=>{const d=new Date(iso+"T12:00:00");return SEMX[d.getDay()]+", "+d.getDate()+" de "+MES[d.getMonth()];};
const P=["de","da","do","das","dos","e"];
function tit(s){ s=String(s||"").replace(/\s*\|\s*PIEDADE/i,""); const m=s.match(/^(IN|OUT)\s*\((.*)\)\s*$/i); if(m) return m[1].toUpperCase()+" "+tit(m[2]);
  return s.toLowerCase().replace(/\s+/g," ").trim().split(" ").map((w,i)=>i&&P.includes(w)?w:w.replace(/(^|\()([a-zà-ú])/,(x,a,b)=>a+b.toUpperCase())).join(" "); }
async function api(acao,dados){ const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao,t:S.t,...dados})}); const j=await r.json(); if(j.sair){sair();throw new Error(j.erro);} return j; }
function sair(){ ["ag_t","ag_nome","ag_pag"].forEach(k=>localStorage.removeItem(k)); S.t=S.nome=S.pag=null; telaLogin(); }
// tipo do serviço no Phoenix -> etiqueta e cor
function tipoDe(l){ const S_=String(l.servico||"").toUpperCase();
  if(l.auxiliar||/APOIO/.test(S_)) return ["APOIO","var(--apoio)",true];
  if(l.tipo==="IN") return ["CHEGADA","var(--chegada)",true]; if(l.tipo==="OUT") return ["SAÍDA","var(--saida)",true];
  if(l.tipo==="TOUR") return ["PASSEIO","var(--passeio)",false]; return ["TRANSFER","var(--trf)",true]; }
const ico={escala:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',disp:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',rel:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',pag:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',com:'<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>'};
const svg=(k)=>'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ico[k]+'</svg>';

// ================= LOGIN =================
async function telaLogin(){
  document.getElementById("raiz").innerHTML='<div class="login"><img src="logo-luck.png" alt="Luck Receptivo" style="width:70px;height:70px;object-fit:contain;margin-bottom:14px">'
    +'<h1 style="margin:0 0 4px;font-size:28px;font-weight:900">App do Guia</h1><p class="muted" style="margin:0 0 22px">Luck Receptivo · escala, relatório e pagamento</p>'
    +'<div class="card"><label>Seu nome<input type="search" id="lgNome" list="lgLista" placeholder="Digite e escolha seu nome" autocomplete="off"></label><datalist id="lgLista"></datalist>'
    +'<label style="margin-top:12px">Senha<input type="password" id="lgSenha" placeholder="A mesma senha do app antigo" onkeydown="if(event.key===\'Enter\')entrar()"></label>'
    +'<div id="lgErro" class="erro"></div><button class="btn" id="lgBtn" style="margin-top:16px" onclick="entrar()">Entrar</button></div></div>';
  try{ const j=await api("nomes",{}); if(j.ok) document.getElementById("lgLista").innerHTML=j.nomes.map(n=>'<option value="'+esc(n)+'">').join(""); }catch(e){}
}
async function entrar(){
  const nome=document.getElementById("lgNome").value.trim(), senha=document.getElementById("lgSenha").value, b=document.getElementById("lgBtn"), er=document.getElementById("lgErro");
  if(!nome||!senha){ er.textContent="Preencha nome e senha."; return; }
  b.disabled=true; er.textContent="";
  try{ const j=await api("entrar",{nome,senha}); if(!j.ok) throw new Error(j.erro);
    S.t=j.appToken; S.nome=nome.toUpperCase(); S.pag=j.token||"";
    localStorage.setItem("ag_t",S.t); localStorage.setItem("ag_nome",S.nome); localStorage.setItem("ag_pag",S.pag); montar();
    if(!localStorage.getItem("ag_tut_v1")) tutorial(0);
  }catch(e){ er.textContent=e.message||"Não foi possível entrar."; b.disabled=false; }
}

// ================= ESTRUTURA =================
function saudacao(){ const h=new Date().getHours(); return h<12?"Bom dia,":h<18?"Boa tarde,":"Boa noite,"; }
function montar(){
  if(!S.dia) S.dia=hoje(); if(!S.relDia) S.relDia=hoje();
  document.getElementById("raiz").innerHTML='<header class="topo"><div class="linha"><div><div class="ola">'+saudacao()+'</div><div class="nome">'+esc(tit(S.nome))+'</div></div><span style="display:flex;gap:8px"><button class="sair" aria-label="Como usar o app" onclick="tutorial(0)">?</button><button class="sair" onclick="if(confirm(\'Sair do app?\'))sair()">Sair</button></span></div><div id="topoExtra" style="max-width:520px;margin:14px auto 0"></div></header>'
    +'<main class="folha" id="conteudo"></main>'
    +'<nav class="abas">'+[["escala","Escala"],["disp","Disponível"],["rel","Relatório"],["hist","Histórico"],["pag","Pagamento"],["com","Comissão"]].map(([k,t])=>'<button id="ab-'+k+'" onclick="ir(\''+k+'\')">'+svg(k)+t+'</button>').join("")+'</nav>';
  ir(S.aba);
}
function ir(aba){ S.aba=aba; document.querySelectorAll("nav.abas button").forEach(b=>b.classList.toggle("on",b.id==="ab-"+aba)); document.getElementById("topoExtra").innerHTML=""; window.scrollTo(0,0);
  ({escala:telaEscala,disp:telaDisp,rel:telaRel,hist:telaHist,pag:telaPag,com:telaCom})[aba](); }
function pilulas(sel,ini,qtd,acao){ let h='<div class="pilulas">'; for(let k=0;k<qtd;k++){ const d=soma(ini,k); const dt=new Date(d+"T12:00:00"); h+='<button class="pilula'+(d===sel?" on":"")+'" onclick="'+acao+'(\''+d+'\')"><span>'+(d===hoje()?"HOJE":SEM[dt.getDay()])+'</span><b>'+d.slice(8)+'</b></button>'; } return h+'</div>'; }
async function escalaDo(dia,forcar){ const c=S.cache[dia]; if(c&&!forcar&&Date.now()-c.em<5*60e3) return c.servicos;
  const j=await api("escala",{data:dia,forcar:!!forcar}); if(!j.ok) throw new Error(j.erro); S.cache[dia]={em:Date.now(),servicos:j.servicos}; return j.servicos; }

// ================= ESCALA =================
async function telaEscala(){
  document.getElementById("topoExtra").innerHTML=pilulas(S.dia,soma(hoje(),-1),8,"mudarDia");
  const box=document.getElementById("conteudo");
  box.innerHTML='<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>'+diaLongo(S.dia)+'</b><button class="mini" onclick="telaEscalaForcar()">Atualizar</button></div><div class="esqueleto"></div><div class="esqueleto"></div>';
  try{ desenharEscala(await escalaDo(S.dia)); }catch(e){ box.innerHTML+='<div class="card erro">Não consegui carregar a escala: '+esc(e.message)+'</div>'; }
}
function mudarDia(d){ S.dia=d; telaEscala(); }
async function telaEscalaForcar(){ try{ desenharEscala(await escalaDo(S.dia,true)); }catch(e){ alert(e.message); } }
function desenharEscala(servs){
  const box=document.getElementById("conteudo"); if(S.aba!=="escala") return;
  const ord=(l)=>l.apresentacao||l.inicio||"99:99"; servs=[...servs].sort((a,b)=>ord(a).localeCompare(ord(b)));
  let h='<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b>'+diaLongo(S.dia)+'</b><div class="peq muted">'+(servs.length?servs.length+' serviço(s)':'Sem serviços')+'</div></div><button class="mini" onclick="telaEscalaForcar()">Atualizar</button></div>';
  if(!servs.length){ box.innerHTML=h+'<div class="vazio">Você não tem serviços nesse dia no Phoenix.</div>'; return; }
  h+='<div class="card" style="display:flex;align-items:center;gap:12px;background:var(--claro);box-shadow:none"><span style="font-size:26px">📄</span><div style="flex:1"><b>Sua escala em PDF</b><div class="peq muted">A Ordem de Serviço do dia, direto do Phoenix</div></div><button class="mini" id="btnPdf" onclick="abrirPdf()">Abrir</button></div>';
  let anterior=null;
  for(const l of servs){
    const [tag,cor,transfer]=tipoDe(l), rs=l.reservas||[];
    const uniq=(a)=>[...new Set(a.filter(Boolean))];
    const voos=uniq(rs.map(r=>[r.voo,r.horaVoo].filter(Boolean).join(" · ")));
    const hoteis=uniq(rs.map(r=>tit(r.hotel))); const idi=uniq(rs.map(r=>r.idioma).join(",").split(",").map(s=>s.trim()));
    // observação só em serviço privativo (no regular cada REC tem a sua e não faz sentido juntar)
    const privativo=/PRIVATIVO/i.test(l.servico||"")||rs.some(r=>/PRIV/i.test(r.modo||""));
    const obs=privativo?uniq(rs.map(r=>r.obs)):[];
    const emSeguida=anterior&&l.tipo==="IN"&&anterior.tipo==="OUT"&&!l.apresentacao;
    const hora=transfer?(l.apresentacao||l.inicio||"—"):(l.apresentacao||l.inicio||"—");
    const sub=emSeguida?"em seguida":transfer?"apresentação":"saída";
    h+='<div class="serv"><div class="hora"><b>'+esc(emSeguida?"↳":hora.slice(0,5))+'</b><span>'+sub+'</span></div><div class="corpo" style="border-left-color:'+cor+'">'
      +'<span class="tag" style="color:'+cor+'">'+tag+(privativo?' · PRIVATIVO':'')+(l.inicio&&l.apresentacao&&l.inicio!==l.apresentacao?' · início '+esc(l.inicio.slice(0,5)):'')+'</span><b style="font-size:16px">'+esc(tit(l.servico))+'</b>'
      +(voos.length?'<span class="det">✈️ '+esc(voos.join(" / "))+'</span>':'')
      +'<span class="det">👥 '+(l.pax!=null?l.pax:rs.reduce((s,r)=>s+(r.pax||0),0))+' pax · 🚐 '+esc(tit(l.motorista))+(l.veiculo?' · '+esc(tit(l.veiculo)):'')+'</span>'
      +(hoteis.length?'<span class="det">🏨 '+esc(hoteis.join(" · "))+'</span>':'')
      +(idi.length?'<span class="det" style="color:var(--chegada);font-weight:800">🌐 Idioma: '+esc(idi.join(", "))+'</span>':'')
      +obs.map(o=>'<span class="obs">📝 '+esc(o)+'</span>').join("")
      +(l.tipo==="IN"&&voos.length?(()=>{ // um botão para cada voo diferente do IN
        const vs=uniq(rs.map(r=>String(r.voo||"").trim()).filter(Boolean));
        return '<span style="display:flex;gap:14px;flex-wrap:wrap">'+vs.map(v=>'<a class="peq" style="color:var(--chegada);font-weight:800" target="_blank" href="'+esc(linkVoo(v))+'">Rastrear '+(vs.length>1?esc(v)+' ':'voo ')+'↗</a>').join("")+'</span>';
      })():'')
      +'</div></div>';
    anterior=l;
  }
  box.innerHTML=h;
}
async function abrirPdf(){
  const b=document.getElementById("btnPdf"); b.disabled=true; b.textContent="Gerando...";
  try{ const j=await api("pdf",{data:S.dia}); if(!j.ok) throw new Error(j.erro);
    const bin=atob(j.base64), arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);

  const t=TUT[i]; if(!t){ fecharTutorial(); return; } if(!el){ el=document.createElement("div"); el.id="tut"; el.className="tut"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Como usar o app"); document.body.appendChild(el); }
  el.innerHTML='<button class="pular" onclick="fecharTutorial()">Pular</button><div class="meio"><div class="ic">'+svg(t[0]).replace('width="22" height="22"','width="40" height="40"')+'</div><h2>'+t[1]+'</h2><p>'+t[2]+'</p><div class="dica">💡 '+t[3]+'</div></div>'
    +'<div class="pontos">'+[...TUT,0].map((x,k)=>'<span class="'+(k===i?"on":"")+'"></span>').join("")+'</div>'
    +'<button class="btn" onclick="tutorial('+(i+1)+')">Próximo</button>';
}
function fecharTutorial(){ const el=document.getElementById("tut"); if(el) el.remove(); localStorage.setItem("ag_tut_v1","1"); }

// ================= COMISSÃO (venda por venda, pelo Phoenix) =================
async function telaCom(){
  S.comQual=S.comQual||"atual";
  const box=document.getElementById("conteudo");
  box.innerHTML='<div class="seg" style="margin-bottom:12px">'+[["atual","Quinzena atual"],["anterior","Quinzena anterior"]].map(([k,t])=>'<button class="'+(S.comQual===k?"on":"")+'" onclick="S.comQual=\''+k+'\';telaCom()">'+t+'</button>').join("")+'</div><div class="esqueleto" style="height:130px"></div><div class="esqueleto"></div>';
  try{ const j=await api("comissao",{qual:S.comQual}); if(!j.ok) throw new Error(j.erro); if(S.aba!=="com") return; desenharCom(j); }
  catch(e){ box.innerHTML+='<div class="card erro">'+esc(e.message)+'</div>'; }
}
function desenharCom(j){
  const box=document.getElementById("conteudo"), x=j.comissao;
  let h='<div class="seg" style="margin-bottom:12px">'+[["atual","Quinzena atual"],["anterior","Quinzena anterior"]].map(([k,t])=>'<button class="'+(S.comQual===k?"on":"")+'" onclick="S.comQual=\''+k+'\';telaCom()">'+t+'</button>').join("")+'</div>';
  h+='<div class="card" style="background:var(--escuro);color:#fff"><div class="tag" style="color:#a6dcc2">COMISSÃO · '+dd(j.periodo[0])+' A '+dd(j.periodo[1])+'</div><div style="font-size:32px;font-weight:900;letter-spacing:-.5px;margin:4px 0;color:#86e6b8">'+brl(x?x.comissao:0)+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;color:#d2e6dc"><span>Vendas pagas ('+(x?x.qtd:0)+')</span><b style="color:#fff">'+brl(x?x.vendas:0)+'</b>'+(x&&x.reembolsos?'<span>Reembolsos / cancelamentos ('+x.reembolsos+')</span><b style="color:#ffb4a8">− '+brl(x.valorReembolso)+'</b>':'')+'</div>'
    +'<div class="peq" style="color:#a9c7bb;margin-top:8px">'+(x&&x.em?'Atualizado '+new Date(x.em).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+' · ':'')+'Aparecem as vendas já conciliadas no Phoenix. Venda feita e ainda não conciliada aparece quando o financeiro conciliar.</div></div>';
  const itens=(x&&x.itens)||[];
  if(!itens.length){ box.innerHTML=h+'<div class="vazio">Nenhuma venda conciliada nessa quinzena ainda.</div>'; return; }
  // agrupa por REC (a reserva pode ter vários passeios)
  const porRec={}; itens.forEach(i=>{ const k=String(i.rec||"").replace(/\.\d+$/,"")||"—"; (porRec[k]=porRec[k]||[]).push(i); });
  const recs=Object.entries(porRec).sort((a,b)=>String(b[1][0].dataVenda.split("/").reverse().join("")).localeCompare(a[1][0].dataVenda.split("/").reverse().join("")));
  for(const [rec,ls] of recs){
    const tot=ls.filter(i=>i.conta).reduce((s,i)=>s+i.comissao,0), reemb=ls.some(i=>i.reembolso);
    h+='<div class="card" style="padding:6px 16px'+(reemb?';border-left:5px solid var(--alerta)':'')+'"><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0 4px"><div><b>'+esc(rec)+'</b><div class="peq muted">vendida em '+esc(ls[0].dataVenda.slice(0,5))+'</div></div><b style="color:var(--verde)">'+brl(tot)+'</b></div>'
      +ls.map(i=>'<div style="border-top:1px solid var(--linha);padding:9px 0;display:flex;gap:10px;align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px">'+esc(tit(i.servico||""))+'</div><div class="peq muted">'+(i.dataExec?'serviço '+esc(i.dataExec.slice(0,5))+' · ':'')+'venda '+brl(i.valor)+(i.dataConc?' · conciliada '+esc(i.dataConc.slice(0,5)):'')+'</div></div>'
        +'<div style="text-align:right"><b style="'+(i.conta?'':'text-decoration:line-through;color:var(--muted)')+'">'+brl(i.comissao)+'</b><div><span class="chip" style="background:'+(i.reembolso?'#fde2dc':i.conta?'#d4f0ec':'#fff0dd')+';color:'+(i.reembolso?'#a3271a':i.conta?'#0b6e5f':'#a3501a')+'">'+esc(i.reembolso?(i.status||"Reembolso"):i.conta?"Paga":(i.status||"Pendente"))+'</span></div></div></div>').join("")+'</div>';
  }
  box.innerHTML=h;
}

// início
if(S.t&&S.nome){ montar(); if(!localStorage.getItem("ag_tut_v1")) tutorial(0); } else telaLogin();
</script>
